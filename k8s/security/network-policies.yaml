# k8s/network-policies.yaml: Thiết lập Zero-Trust Networking cho cụm K3s
---
# 1. Bảo vệ Database PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-postgres
  annotations:
    description: "Only allow valid Pods in the namespace to access the database."
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: mlops-paas-postgres
  policyTypes:
    - Ingress
  ingress:
    # Cho phép các Pod nội bộ của CloudNativePG giao tiếp với nhau (Replication)
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: mlops-paas-postgres
    # Cho phép toàn bộ ứng dụng và Argo workflows nội bộ truy cập cổng 5432
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # Cho phép Prometheus (namespace monitoring) truy cập cổng 9187 để lấy metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187

---
# 2. Bảo vệ Message Queue Redpanda
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-redpanda
  annotations:
    description: "Only allow internal services to connect to Kafka/Redpanda."
spec:
  podSelector:
    matchLabels:
      app: redpanda
  policyTypes:
    - Ingress
  ingress:
    # Cho phép Redpanda nội bộ giao tiếp
    - from:
        - podSelector:
            matchLabels:
              app: redpanda
    # Cho phép Control Plane, Consumer và Workflows truy cập cổng 9092 & 19092
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 19092
    # Cho phép Prometheus lấy metrics từ cổng 9644
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9644

---
# 3. Bảo vệ Django Control Plane
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-control-plane
  annotations:
    description: "Only allow Traefik Ingress, internal Pods, and Prometheus to access the Control Plane."
spec:
  podSelector:
    matchLabels:
      app: mlops-paas-control-plane
  policyTypes:
    - Ingress
  ingress:
    # Cho phép Traefik (từ namespace kube-system) truy cập API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
    # Cho phép các Pod nội bộ (như Consumer hoặc Workflows gọi webhook)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
    # Cho phép Prometheus lấy metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000

---
# 4. Bảo vệ Frontend Web (React Vite)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-web
  annotations:
    description: "Only allow Traefik and Cloudflared to access the Frontend."
spec:
  podSelector:
    matchLabels:
      app: mlops-paas-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 80
