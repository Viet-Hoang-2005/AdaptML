# evidently-cronjob.yaml
# Container phát hiện Data Drift chạy định kỳ mỗi ngày 0h.
# Kết nối đến CloudNativePG qua endpoint READ-ONLY (nids-postgres-ro)
# vì detect_drift.py chỉ thực hiện thao tác SELECT.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: evidently-drift-monitor
  labels:
    app: evidently-drift-monitor
spec:
  # Chạy hàng ngày lúc 0h UTC (7h sáng giờ Việt Nam)
  schedule: "0 0 * * *"

  # Giữ lại log của 3 lần chạy thành công gần nhất để debug
  successfulJobsHistoryLimit: 3
  # Giữ lại log của 1 lần chạy thất bại gần nhất
  failedJobsHistoryLimit: 1
  # Không cho phép 2 Job chạy đồng thời (tránh gửi 2 webhook)
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: drift-monitor
              image: tnvhoang/mlops-evidently-monitor:latest
              imagePullPolicy: Always
              env:
                # ---- PostgreSQL READ-ONLY Endpoint (CloudNativePG) ----
                # detect_drift.py chỉ SELECT → dùng nids-postgres-ro
                # để phân tải, không tác động đến Primary đang phục vụ API
                - name: DB_HOST_RO
                  value: "nids-postgres-ro"
                # Fallback cho detect_drift.py khi đọc biến DB_HOST thông thường
                - name: DB_HOST
                  value: "nids-postgres-ro"
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: "mlops_nids_db"
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_PASSWORD

                # ---- Cấu hình Drift Detection ----
                # Ngưỡng 50%: Nếu hơn một nửa số feature bị drift → kích hoạt retrain
                - name: DRIFT_THRESHOLD
                  value: "0.5"

                # ---- GitHub Webhook để kích hoạt retrain_pipeline.yml ----
                - name: GITHUB_REPO
                  value: "Viet-Hoang-2005/MLOps-weather-system"
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-secrets
                      key: GITHUB_TOKEN

          # Không cần volume nào — detect_drift.py đọc dữ liệu từ PostgreSQL,
          # không đọc file từ ổ cứng của Node (đã bỏ hostPath volume cũ)
