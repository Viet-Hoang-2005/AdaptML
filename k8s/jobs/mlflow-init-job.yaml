# k8s/mlflow-init-job.yaml: Job khởi tạo database cho MLflow trên CloudNativePG
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-db-init
  annotations:
    description: "One-time Job to initialize MLflow database schema and user roles in PostgreSQL"
  labels:
    app: mlflow-db-init
spec:
  ttlSecondsAfterFinished: 300 # Tự động xóa Job sau 5 phút kể từ khi hoàn thành
  template:
    metadata:
      labels:
        app: mlflow-db-init
    spec:
      nodeSelector:
        workload-type: worker
      restartPolicy: OnFailure
      containers:
        - name: init
          # Pull image của PostgreSQL để chạy script khởi tạo database
          image: postgres:15-alpine
          env:
            - name: PGHOST
              value: "mlops-paas-postgres-rw"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: MLFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: MLFLOW_DB_PASSWORD
          # Script khởi tạo database mlflow, user mlflow và cấp quyền
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              echo "Connecting to PostgreSQL: ${PGHOST}:${PGPORT}"

              # Chờ PostgreSQL sẵn sàng (timeout 60s)
              for i in $(seq 1 30); do
                if pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" 2>/dev/null; then
                  echo "PostgreSQL is ready!"
                  break
                fi
                echo "Waiting for PostgreSQL... ${i}/30"
                sleep 2
              done

              echo "Starting MLflow Database Initialization"

              # Tạo role mlflow nếu chưa có (bỏ qua lỗi nếu đã tồn tại)
              psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres \
                -c "CREATE ROLE mlflow LOGIN PASSWORD '${MLFLOW_DB_PASSWORD}';" 2>/dev/null || true
              # Đảm bảo role đã có đúng quyền LOGIN và mật khẩu
              psql -v ON_ERROR_STOP=1 -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres \
                -c "ALTER ROLE mlflow WITH LOGIN PASSWORD '${MLFLOW_DB_PASSWORD}';"

              # CREATE DATABASE không được chạy trong transaction block, nên kiểm tra riêng
              if [ "$(psql -v ON_ERROR_STOP=1 -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'mlflow'")" != "1" ]; then
                psql -v ON_ERROR_STOP=1 -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres -c "CREATE DATABASE mlflow"
              fi

              # Đồng bộ hóa owner và quyền trên database mlflow
              psql -v ON_ERROR_STOP=1 -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d postgres <<'SQL'
              ALTER DATABASE mlflow OWNER TO mlflow;
              GRANT ALL PRIVILEGES ON DATABASE mlflow TO mlflow;
              SQL

              # Đồng bộ schema public bên trong database mlflow
              psql -v ON_ERROR_STOP=1 -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d mlflow <<'SQL'
              ALTER SCHEMA public OWNER TO mlflow;
              GRANT ALL ON SCHEMA public TO mlflow;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO mlflow;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO mlflow;
              SQL

              echo "MLflow Database is ready!"
              echo "Database: mlflow | User: mlflow | Password: ***"
              echo "MLFLOW_TRACKING_URI=postgresql://mlflow:***@mlops-paas-postgres-rw:5432/mlflow"
