# evidently-job.yaml: Container phát hiện Data Drift được kích hoạt tự động qua Webhook
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-paas-evidently
  annotations:
    description: "Job to detect data drift between production data and baseline data using Evidently AI"
  labels:
    app: mlops-paas-evidently
spec:
  backoffLimit: 1
  template:
    spec:
      nodeSelector:
        workload-type: worker
      restartPolicy: Never
      containers:
        - name: mlops-paas-evidently
          image: tnvhoang/mlops-paas-evidently:latest
          imagePullPolicy: Always
          env:
            - name: DB_HOST_RO
              value: "mlops-paas-postgres-ro"
            - name: DB_HOST
              value: "mlops-paas-postgres-ro"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "mlops_paas_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            # Cấu hình Drift Detection
            # Ngưỡng 50%: Nếu hơn một nửa số feature bị drift
            - name: DRIFT_THRESHOLD
              value: "0.5"
            # GitHub Webhook để kích hoạt drift_alert workflow
            - name: GITHUB_REPO
              value: "Viet-Hoang-2005/MLOps-nids-system"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-secrets
                  key: GITHUB_TOKEN
          # Cấu hình tài nguyên cho container Evidently
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
