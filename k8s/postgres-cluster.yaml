# postgres-cluster.yaml: CloudNativePG Cluster
#   mlops-nids-postgres-rw -> Primary (dùng cho INSERT/UPDATE)
#   mlops-nids-postgres-ro -> Load-balanced Primary + Standby (dùng cho SELECT)
#   mlops-nids-postgres-r  -> Tất cả instances
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mlops-nids-postgres
  annotations:
    description: "CloudNativePG cluster for MLflow metadata and NIDS baseline data storage"
spec:
  # Chạy 2 instances để đảm bảo tính sẵn sàng cao (High Availability)
  # Node 1: Primary (RW), Node 2: Standby (RO)
  instances: 2
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:15

  # Khởi tạo database và application owner
  bootstrap:
    initdb:
      database: mlops_nids_db
      owner: postgres
      secret:
        name: postgres-secrets

  # Cấu hình Storage cho mỗi instance
  storage:
    storageClass: local-path
    size: 10Gi

  # Khi mở rộng lại nhiều instance, anti-affinity giúp tách các pod ra khác node.
  affinity:
    nodeSelector:
      workload-type: worker
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  # Tuning PostgreSQL parameters cho MLflow workload
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "32MB"
      maintenance_work_mem: "256MB"
      max_connections: "200"

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
