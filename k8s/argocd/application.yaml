# application.yaml: ArgoCD Application quản lý toàn bộ k8s/apps/
# ArgoCD sẽ tự động sync khi phát hiện commit mới trong thư mục này
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-paas-system
  namespace: argocd
  annotations:
    description: "MLOps PaaS System - Managed by ArgoCD GitOps"
spec:
  project: default

  # Nguồn: GitHub Repo và thư mục k8s/ (quản lý toàn bộ thông qua root kustomization)
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s

  # Đích: K3s Cluster (cùng Cluster với ArgoCD)
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  # Cấu hình đồng bộ tự động
  syncPolicy:
    automated:
      selfHeal: true  # Tự chữa lành: Nếu ai xóa nhầm Pod, ArgoCD sẽ tự dựng lại
      prune: true     # Tự dọn dẹp: Nếu file YAML bị xóa khỏi Git, resource trên cluster cũng bị xóa
    syncOptions:
      - CreateNamespace=true      # Tạo namespace nếu chưa tồn tại
      - ApplyOutOfSyncOnly=true   # Áp dụng từng resource một, tránh lỗi dây chuyền
      - ServerSideApply=true      # Sử dụng ServerSideApply để tránh lỗi Conflict
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # External Secrets Operator and manual force refreshes add runtime fields that
    # should not make the GitOps app look drifted.
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/annotations/force-sync
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
    # Kubernetes defaults StatefulSet fields after creation. These defaults are
    # visible in live state but are not part of the authored Redpanda manifest.
    - group: apps
      kind: StatefulSet
      name: redpanda
      namespace: default
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/template/spec/securityContext
        - /spec/template/spec/terminationGracePeriodSeconds
        - /spec/template/spec/containers/0/imagePullPolicy
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/containers/0/ports/0/protocol
        - /spec/template/spec/containers/0/ports/1/protocol
        - /spec/template/spec/containers/0/ports/2/protocol
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/spec/volumeMode
    # The Harbor chart omits API-server defaults from its rendered database and
    # Redis StatefulSets. Ignore only those defaulted paths so application drift
    # still reports changes to images, credentials, storage, and runtime config.
    - group: apps
      kind: StatefulSet
      name: mlops-paas-harbor-database
      namespace: harbor
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
        - /spec/template/spec/containers/0/livenessProbe/failureThreshold
        - /spec/template/spec/containers/0/livenessProbe/successThreshold
        - /spec/template/spec/containers/0/readinessProbe/failureThreshold
        - /spec/template/spec/containers/0/readinessProbe/successThreshold
        - /spec/template/spec/containers/0/resources
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/containers/0/volumeMounts/0/subPath
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/initContainers/0/resources
        - /spec/template/spec/initContainers/0/terminationMessagePath
        - /spec/template/spec/initContainers/0/terminationMessagePolicy
        - /spec/template/spec/initContainers/0/volumeMounts/0/subPath
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/metadata/annotations
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
    - group: apps
      kind: StatefulSet
      name: mlops-paas-harbor-redis
      namespace: harbor
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
        - /spec/template/spec/containers/0/livenessProbe/failureThreshold
        - /spec/template/spec/containers/0/livenessProbe/successThreshold
        - /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
        - /spec/template/spec/containers/0/readinessProbe/failureThreshold
        - /spec/template/spec/containers/0/readinessProbe/successThreshold
        - /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        - /spec/template/spec/containers/0/resources
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/containers/0/volumeMounts/0/subPath
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/metadata/annotations
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
    # CloudNativePG writes operator defaults into spec. Keep Git focused on the
    # authored intent while ignoring defaulted runtime fields.
    - group: postgresql.cnpg.io
      kind: Cluster
      name: mlops-paas-postgres
      namespace: default
      jsonPointers:
        - /spec/bootstrap/initdb/encoding
        - /spec/bootstrap/initdb/localeCType
        - /spec/bootstrap/initdb/localeCollate
        - /spec/failoverDelay
        - /spec/logLevel
        - /spec/maxSyncReplicas
        - /spec/minSyncReplicas
        - /spec/monitoring
        - /spec/postgresGID
        - /spec/postgresUID
        - /spec/postgresql/parameters/archive_mode
        - /spec/postgresql/parameters/archive_timeout
        - /spec/postgresql/parameters/dynamic_shared_memory_type
        - /spec/postgresql/parameters/log_destination
        - /spec/postgresql/parameters/log_directory
        - /spec/postgresql/parameters/log_filename
        - /spec/postgresql/parameters/log_rotation_age
        - /spec/postgresql/parameters/log_rotation_size
        - /spec/postgresql/parameters/log_truncate_on_rotation
        - /spec/postgresql/parameters/logging_collector
        - /spec/postgresql/parameters/max_parallel_workers
        - /spec/postgresql/parameters/max_replication_slots
        - /spec/postgresql/parameters/max_worker_processes
        - /spec/postgresql/parameters/shared_memory_type
        - /spec/postgresql/parameters/shared_preload_libraries
        - /spec/postgresql/parameters/ssl_max_protocol_version
        - /spec/postgresql/parameters/ssl_min_protocol_version
        - /spec/postgresql/parameters/wal_keep_size
        - /spec/postgresql/parameters/wal_receiver_timeout
        - /spec/postgresql/parameters/wal_sender_timeout
        - /spec/postgresql/syncReplicaElectionConstraint
        - /spec/primaryUpdateMethod
        - /spec/primaryUpdateStrategy
        - /spec/replicationSlots
        - /spec/smartShutdownTimeout
        - /spec/startDelay
        - /spec/stopDelay
        - /spec/storage/resizeInUseVolumes
        - /spec/switchoverDelay
