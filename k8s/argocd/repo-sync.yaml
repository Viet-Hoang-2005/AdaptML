# repo-sync.yaml: Cấu hình đồng bộ thông tin xác thực GitHub Private Repo cho ArgoCD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-repo-sync
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: github-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/Viet-Hoang-2005/MLOps-nids-system.git
        username: "Viet-Hoang-2005"
        password: "{{ .GITHUB_TOKEN }}"
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-secrets
              key: GITHUB_TOKEN
