# treafik-ping.yaml: Định nghĩa một IngressRoute để expose endpoint /ping của Traefik cho ALB helth check
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ping-expose
  namespace: kube-system # Đặt ở kube-system vì Traefik mặc định của K3s nằm ở đây
spec:
  entryPoints:
    - web # Lắng nghe trên cổng 80 (HTTP)
  routes:
    - match: PathPrefix(`/ping`) # Bắt tất cả traffic gõ vào /ping
      kind: Rule
      services:
        - name: ping@internal # Trỏ thẳng vào service quản lý sức khỏe ẩn của Traefik
          kind: TraefikService