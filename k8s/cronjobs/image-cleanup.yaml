apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlops-paas-unsaved-build-cleanup
  labels:
    app: mlops-paas-control-plane
    app.kubernetes.io/component: build-image-cleanup
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: mlops-paas-unsaved-build-cleanup
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: mlops-paas-control-plane:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "manage.py", "cleanup_unsaved_build_images", "--execute"]
              env:
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: DB_PASSWORD
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mlops-paas-secret
                      key: DJANGO_SECRET_KEY
                - name: HARBOR_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: harbor-registry-secret
                      key: HARBOR_USERNAME
                - name: HARBOR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: harbor-registry-secret
                      key: HARBOR_PASSWORD
              envFrom:
                - configMapRef:
                    name: mlops-paas-control-plane-config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
