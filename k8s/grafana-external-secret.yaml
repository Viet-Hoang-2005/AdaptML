# grafana-external-secret.yaml: Kéo Tunnel Token từ AWS về namespace monitoring cho Grafana
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tunnel-token
  namespace: monitoring # Đặt vào đúng chỗ cloudflared-grafana đang tìm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store # Sử dụng Store dùng chung toàn cluster
    kind: ClusterSecretStore
  target:
    name: tunnel-token # Tên secret sẽ tạo ra trong namespace monitoring
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: mlops/tunnel-token # Tên secret trên AWS Secrets Manager
        property: token
