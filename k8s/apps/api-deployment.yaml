# api-deployment.yaml: Triển khai FastAPI phục vụ predict với Init Container kéo model từ S3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-nids-api
  annotations:
    description: "FastAPI service for real-time Network Intrusion Detection System (NIDS) predictions"
  labels:
    app: mlops-nids-api
spec:
  replicas: 2 # Số lượng replica mặc định của API 
  selector:
    matchLabels:
      app: mlops-nids-api
  template:
    metadata:
      labels:
        app: mlops-nids-api
    spec:
      nodeSelector:
        workload-type: worker # Chỉ chạy trên máy worker
      affinity:
        podAntiAffinity:
          # Chạy 2 replica API trên 2 worker node khác nhau (High Availability)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mlops-nids-api
                topologyKey: "kubernetes.io/hostname"
      # Init Containers: Chạy trước FastAPI để kéo model từ S3
      initContainers:
        - name: aws-s3-model-sync
          image: amazon/aws-cli:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Đọc MODEL_VERSION từ env để biết tải version nào
              echo "Syncing model version: ${MODEL_VERSION} from S3..."
              mkdir -p /models/${MODEL_VERSION}

              # Tải file model XGBoost (.pkl)
              aws s3 cp s3://${AWS_BUCKET_NAME}/mlflow-artifacts/${EXPERIMENT_ID}/${RUN_ID}/artifacts/deployment_exports/xgb_nids_model_${MODEL_VERSION}.pkl \
                /models/${MODEL_VERSION}/xgb_nids_model_${MODEL_VERSION}.pkl

              # Tải file label classes (.json)
              aws s3 cp s3://${AWS_BUCKET_NAME}/mlflow-artifacts/${EXPERIMENT_ID}/${RUN_ID}/artifacts/deployment_exports/label_classes_${MODEL_VERSION}.json \
                /models/${MODEL_VERSION}/label_classes_${MODEL_VERSION}.json

              echo "Model sync complete."
              ls -la /models/${MODEL_VERSION}/
          # Cấu hình biến môi trường cho Init Container
          env:
            - name: MODEL_VERSION
              value: "v1"
            - name: EXPERIMENT_ID
              value: "1"
            - name: RUN_ID
              value: "unknown"
            - name: AWS_BUCKET_NAME
              value: "mlops-nids-artifacts"
            - name: AWS_DEFAULT_REGION
              value: "ap-southeast-1"
          # Mount volume để chia sẻ model đã tải về với App Container
          volumeMounts:
            - name: model-volume
              mountPath: /models
      # App Container: FastAPI NIDS Server
      containers:
        - name: fastapi-server
          image: tnvhoang/mlops-nids-api:92c1790dcb0057200f5eb6272f3e1b590df28dcb
          imagePullPolicy: Always # Luôn kéo image mới nhất từ registry
          ports:
            - containerPort: 5000 # FastAPI chạy trên cổng 5000
          env:
            - name: REDPANDA_BROKERS
              value: "redpanda-service:9092"
            - name: AWS_BUCKET_NAME
              value: "mlops-nids-artifacts"
            - name: MODEL_VERSION
              value: "v1"
            - name: EXPERIMENT_ID
              value: "1"
            - name: RUN_ID
              value: "unknown"
            - name: DB_HOST_RW
              value: "mlops-nids-postgres-rw"
            - name: DB_HOST
              value: "mlops-nids-postgres-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "mlops_nids_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
          # Mount volume chứa model đã được Init Container tải về
          volumeMounts:
            - name: model-volume
              mountPath: /models
          # Cấu hình tài nguyên cho API
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Kiểm tra pod sẵn sàng nhận traffic chưa
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          # Tự động restart pod nếu bị treo
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
      # Volume để chia sẻ model giữa Init Container và App Container
      volumes:
        - name: model-volume
          emptyDir: {}
# Service để load balance traffic đến các pod của API
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: mlops-nids-api
  type: ClusterIP
  # Cổng 80 của Service sẽ chuyển tiếp đến cổng 5000 của FastAPI trong pod
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
  template:
    spec:
      containers: []
# Ingress chỉ đường tới API Service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
spec:
  ingressClassName: traefik
  rules:
    # Chỉ định hostname để truy cập API
    - host: api.mlops-nids-nt114.id.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80
  template:
    spec:
      containers: []
