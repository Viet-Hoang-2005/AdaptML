# grafana-alertrules.yaml: Cấu hình PrometheusRule với các ngưỡng cảnh báo cho hệ thống NIDS
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nids-alert-rules
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    # Nhóm 1: API Health
    - name: nids.api.health
      rules:
        # Cảnh báo khi API latency p95 vượt 100ms liên tục 3 phút
        - alert: HighAPILatency
          expr: |
            histogram_quantile(0.95,
              rate(http_request_duration_seconds_bucket{handler="/predict"}[5m])
            ) > 0.1
          for: 3m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "API /predict latency is above 100ms"
            description: "The current p95 latency is {{ $value | humanizeDuration }}. Please check the Pod resources and Redpanda connection!"

        # Cảnh báo khi error rate vượt 1%
        - alert: HighAPIErrorRate
          expr: |
            rate(http_requests_total{status=~"5.."}[5m]) /
            rate(http_requests_total[5m]) > 0.01
          for: 2m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "API Error Rate is above 1%"
            description: "The current error rate is {{ $value | humanizePercentage }}. Please check the API logs!"

        # Cảnh báo khi API pod không còn running
        - alert: APIPodsUnavailable
          expr: kube_deployment_status_replicas_available{deployment="mlops-nids-api"} < 1
          for: 1m
          labels:
            severity: critical
            team: mlops
          annotations:
            summary: "API Pods unavailable"
            description: "The API deployment has 0 available replicas. Please check immediately!"

    # Nhóm 2: NIDS Security Events
    - name: nids.security
      rules:
        # Cảnh báo khi phát hiện DDoS traffic đột biến (tấn công thực)
        - alert: DDoSSpikeDetected
          expr: |
            rate(nids_predictions_total{label="DDoS"}[2m]) > 50
          for: 1m
          labels:
            severity: critical
            team: security
          annotations:
            summary: "DDoS Traffic Spike detected!"
            description: "The system is detecting {{ $value | humanize }} DDoS predictions/second. It may be under real attack!"

        # Cảnh báo khi PortScan tăng đột biến (giai đoạn trinh sát mạng)
        - alert: PortScanActivityDetected
          expr: |
            rate(nids_predictions_total{label="PortScan"}[5m]) > 20
          for: 2m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "PortScan activity detected!"
            description: "{{ $value | humanize }} PortScan predictions/second in the last 5 minutes."

        # Cảnh báo khi confidence score trung bình quá thấp (model có thể đang xử lý data lạ)
        - alert: LowModelConfidence
          expr: |
            histogram_quantile(0.5,
              rate(nids_prediction_confidence_bucket[10m])
            ) < 0.7
          for: 5m
          labels:
            severity: warning
            team: mlops
          annotations:
            summary: "Model Confidence Score < 70%"
            description: "The model is not confident with the input data. It may need to check Data Drift!"

    # Nhóm 3: Database Health
    - name: nids.database
      rules:
        # Cảnh báo khi PostgreSQL Pod down
        - alert: PostgresDown
          expr: cnpg_pg_up == 0
          for: 1m
          labels:
            severity: critical
            team: infrastructure
          annotations:
            summary: "PostgreSQL is not responding!"
            description: "A CloudNativePG instance is down. Check the database cluster immediately!"

        # Cảnh báo khi số connections gần đạt max_connections
        - alert: PostgresHighConnections
          expr: |
            sum(cnpg_pg_stat_database_numbackends) by (datname) > 80
          for: 5m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "PostgreSQL high connections"
            description: "Database {{ $labels.datname }} has {{ $value }} active connections."

    # Nhóm 4: Infrastructure
    - name: nids.infrastructure
      rules:
        # Cảnh báo khi RAM Worker Node vượt 85%
        - alert: NodeHighMemoryUsage
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "Worker Node RAM > 85%"
            description: "Node {{ $labels.instance }} is using {{ $value | humanize }}% RAM."

        # Cảnh báo khi disk vượt 80%
        - alert: NodeDiskAlmostFull
          expr: |
            (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
          for: 10m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "Node Disk almost full (> 80%)"
            description: "Node {{ $labels.instance }}: {{ $value | humanize }}% disk usage."
