# api-hpa.yaml: Horizontal Pod Autoscaler cho FastAPI NIDS
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mlops-nids-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mlops-nids-api
  minReplicas: 2      # Luôn duy trì ít nhất 2 Pod để đảm bảo HA
  maxReplicas: 5      # Tối đa 5 Pods để tránh hút cạn RAM của cụm máy ảo
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60 # Scale up khi CPU trung bình vượt quá 60%
