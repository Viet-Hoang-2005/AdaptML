# pod-disruption-budgets.yaml: Bảo vệ các service khỏi downtime khi bảo trì node (kubectl drain)
# 1. PDB cho API PaaS
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlops-paas-api-pdb
  namespace: default
spec:
  minAvailable: 1 # Luôn giữ ít nhất 1 Pod phục vụ Inference
  selector:
    matchLabels:
      app: mlops-paas-api
---
# 2. PDB cho Cloudflare Tunnel
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared
---
# 3. PDB cho MLflow Server
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlflow-server-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mlflow-server
---
