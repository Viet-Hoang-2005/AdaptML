apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../base

resources:
  - ingress.yaml

images:
  # GitHub Actions CI/CD pipeline will override this tag with the actual SHA/version dynamically
  - name: mlops-paas-consumer
    newName: tnvhoang/mlops-paas-consumer
    newTag: latest
  - name: mlops-paas-django
    newName: tnvhoang/mlops-paas-django
    newTag: latest
  - name: mlops-paas-mlflow
    newName: tnvhoang/mlops-paas-mlflow
    newTag: latest
  - name: mlops-paas-web
    newName: tnvhoang/mlops-paas-web
    newTag: latest
