# k8s/network-policies.yaml: Thiết lập Zero-Trust Networking cho cụm K3s
---
# 1. Bảo vệ Database PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-postgres
  annotations:
    description: "Chỉ cho phép các dịch vụ hợp lệ truy cập Database"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: mlops-nids-postgres
  policyTypes:
    - Ingress
  ingress:
    # Cho phép các Pod nội bộ của CloudNativePG giao tiếp với nhau (Replication)
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: mlops-nids-postgres
    # Cho phép các ứng dụng truy cập cổng 5432
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - mlops-nids-api
                  - mlops-nids-consumer
                  - mlflow-server
                  - mlops-nids-evidently
                  - mlops-nids-dispatch
                  - mlops-nids-sync-data
                  - mlflow-db-init
      ports:
        - protocol: TCP
          port: 5432
    # Cho phép Prometheus (namespace monitoring) truy cập cổng 9187 để lấy metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187

---
# 2. Bảo vệ Message Queue Redpanda
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-redpanda
  annotations:
    description: "Chỉ cho phép API và Consumer kết nối Kafka"
spec:
  podSelector:
    matchLabels:
      app: redpanda
  policyTypes:
    - Ingress
  ingress:
    # Cho phép Redpanda nội bộ giao tiếp
    - from:
        - podSelector:
            matchLabels:
              app: redpanda
    # Cho phép API và Consumer truy cập cổng 9092
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - mlops-nids-api
                  - mlops-nids-consumer
      ports:
        - protocol: TCP
          port: 9092
    # Cho phép localhost port-forwarding (thường bypass NP, nhưng an toàn thì mở cổng 19092 cho toàn bộ namespace default)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 19092
    # Cho phép Prometheus lấy metrics từ cổng 9644
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9644

---
# 3. Bảo vệ API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-api
  annotations:
    description: "Chỉ cho phép Traefik Ingress và Prometheus truy cập API"
spec:
  podSelector:
    matchLabels:
      app: mlops-nids-api
  policyTypes:
    - Ingress
  ingress:
    # Cho phép Traefik (từ namespace kube-system) truy cập API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 5000
    # Cho phép Prometheus lấy metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5000

---
# 4. Bảo vệ MLflow Server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-mlflow-server
  annotations:
    description: "Chỉ cho phép Cloudflared proxy vào MLflow Server"
spec:
  podSelector:
    matchLabels:
      app: mlflow-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 5000
