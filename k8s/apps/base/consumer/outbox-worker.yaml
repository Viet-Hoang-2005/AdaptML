apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-paas-consumer-drift-outbox
  labels:
    app: mlops-paas-consumer-drift-outbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-paas-consumer-drift-outbox
  template:
    metadata:
      labels:
        app: mlops-paas-consumer-drift-outbox
    spec:
      nodeSelector:
        workload-type: worker
      containers:
        - name: outbox-worker
          image: mlops-paas-consumer
          imagePullPolicy: Always
          command: ["python", "-m", "src.drift_outbox_worker"]
          envFrom:
            - configMapRef:
                name: mlops-paas-consumer-config
          env:
            - name: CONTROL_PLANE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlops-paas-secret
                  key: CONTROL_PLANE_WEBHOOK_SECRET
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
