apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-registry-ingress
  namespace: harbor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: registry.mlops-nids-nt114.id.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor
                port:
                  number: 80
