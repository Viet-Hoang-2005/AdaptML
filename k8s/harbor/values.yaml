expose:
  type: clusterIP
  tls:
    enabled: false
  ingress:
    enabled: false

externalURL: https://registry.mlops-nids-nt114.id.vn

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      storageClass: local-path
      size: 5Gi
    jobservice:
      storageClass: local-path
      size: 1Gi
    redis:
      storageClass: local-path
      size: 2Gi
    database:
      storageClass: local-path
      size: 3Gi
  imageChartStorage:
    type: s3
    redirect:
      disable: true
    s3:
      region: ap-southeast-1
      bucket: mlops-paas-artifacts
      v4auth: true
      secure: true
      rootdirectory: /harbor-registry

registry:
  registry:
    relativeurls: true

trivy:
  enabled: false
notary:
  enabled: false
