kind: ExternalSecret
metadata:
  name: grafana-alertmanager-sync
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-alertmanager-secrets
