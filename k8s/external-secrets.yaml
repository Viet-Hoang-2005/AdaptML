# external-secrets.yaml: Cấu hình tự động kéo Secrets từ AWS Secrets Manager về K3s
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-secrets-sync
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aws-secrets # Tên secret thật sẽ sinh ra trong K8s
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: mlops/aws-secrets
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: mlops/aws-secrets
        property: AWS_SECRET_ACCESS_KEY

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secrets-sync
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: mlops/postgres-secrets
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: mlops/postgres-secrets
        property: POSTGRES_PASSWORD
    # Bổ sung key username/password để CloudNativePG có thể hiểu được
    - secretKey: username
      remoteRef:
        key: mlops/postgres-secrets
        property: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: mlops/postgres-secrets
        property: POSTGRES_PASSWORD

