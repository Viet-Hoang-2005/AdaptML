apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-platform-edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    mlops-paas.io/plane: platform
    mlops-paas.io/component: routing
spec:
  project: mlops-platform
  info:
    - name: Owner
      value: Platform Engineering
    - name: Sources
      value: k8s/platform/edge/{cloudflare,routing,health}
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#edge
  sources:
    - repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
      targetRevision: main
      path: k8s/platform/edge/cloudflare
    - repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
      targetRevision: main
      path: k8s/platform/edge/routing
    - repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
      targetRevision: main
      path: k8s/platform/edge/health
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/annotations/force-sync
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
