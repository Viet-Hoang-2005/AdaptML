apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-prod-mlflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    mlops-paas.io/plane: platform
    mlops-paas.io/component: mlflow
spec:
  project: mlops-platform
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/infra/mlflow
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#mlflow
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/infra/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow-server
