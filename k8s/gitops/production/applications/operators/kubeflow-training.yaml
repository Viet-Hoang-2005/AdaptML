apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kubeflow-training
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/part-of: mlops-paas
    mlops-paas.io/environment: production
    mlops-paas.io/plane: operator
    mlops-paas.io/component: kubeflow-training
spec:
  project: platform-operators
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: k8s/operators/kubeflow-training
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#operators
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/operators/kubeflow-training
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
      - FailOnSharedResource=true
