apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mlops-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-paas
    mlops-paas.io/environment: production
spec:
  description: Production storage, data, registry, observability and edge services.
  sourceRepos:
    - https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: argo-events
      server: https://kubernetes.default.svc
    - namespace: cloudflare
      server: https://kubernetes.default.svc
    - namespace: harbor
      server: https://kubernetes.default.svc
    - namespace: mlflow-server
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: user-jobs
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: external-secrets.io
      kind: ClusterSecretStore
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
    ignore:
      # Runtime/bootstrap resources in the shared default namespace.
      - group: ""
        kind: ConfigMap
        name: cnpg-default-monitoring
      - group: discovery.k8s.io
        kind: EndpointSlice
        name: kubernetes
      - group: rbac.authorization.k8s.io
        kind: Role
        name: argo-workflows-workflow
      - group: rbac.authorization.k8s.io
        kind: RoleBinding
        name: argo-workflows-workflow
