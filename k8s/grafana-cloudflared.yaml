# grafana-cloudflared.yaml: Expose Grafana Dashboard ra internet qua Cloudflare Tunnel
# DNS: grafana.mlops-nids-nt114.id.vn
# Lưu ý: Cần cấu hình route trong Cloudflare Zero Trust Dashboard trỏ
# grafana.mlops-nids-nt114.id.vn -> http://monitoring-grafana.monitoring.svc.cluster.local:80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-grafana
  namespace: monitoring
  labels:
    app: cloudflared-grafana
  annotations:
    description: "Cloudflare Tunnel to expose Grafana Dashboard"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-grafana
  template:
    metadata:
      labels:
        app: cloudflared-grafana
    spec:
      nodeSelector:
        workload-type: worker
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            # Dùng chung tunnel-token với cloudflared chính (route được cấu hình trên Cloudflare Dashboard)
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token
                  key: token
          resources:
            requests:
              cpu: 30m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
