apiVersion: v1
kind: Namespace
metadata:
  name: kubeflow
---
# ServiceAccount cho Kubeflow Training Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training-operator
  namespace: kubeflow
---
# ClusterRole cho phép Training Operator quản lý Pods, Services và Custom Resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: training-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events", "configmaps"]
    verbs: ["*"]
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs", "tfjobs", "xgboostjobs", "mpijobs", "pytorchjobs/status", "tfjobs/status"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: training-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: training-operator
subjects:
  - kind: ServiceAccount
    name: training-operator
    namespace: kubeflow
---
# Training Operator Deployment (K3s / Cloud K8s compatible)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-operator
  namespace: kubeflow
  labels:
    app: training-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-operator
  template:
    metadata:
      labels:
        app: training-operator
    spec:
      serviceAccountName: training-operator
      containers:
        - name: training-operator
          image: kubeflow/training-operator:v1.7.0
          command:
            - /manager
          args:
            - --enable-scheme=pytorch,tf,xgboost
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
