apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    mlops-paas.io/plane: operator
    mlops-paas.io/component: karpenter
spec:
  project: platform-operators
  info:
    - name: Owner
      value: Platform Engineering
    - name: Source
      value: public.ecr.aws/karpenter/karpenter@1.13.0
    - name: Runbook
      value: https://github.com/Viet-Hoang-2005/MLOps-paas-system/blob/main/k8s/README.md#operators
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.13.0
    helm:
      releaseName: karpenter
      values: |
        replicas: 1
        nodeSelector:
          workload-type: worker
        settings:
          clusterName: runtime-injected
          clusterEndpoint: https://runtime-injected.invalid:6443
          interruptionQueue: runtime-injected
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
      - FailOnSharedResource=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: karpenter
      namespace: karpenter
      jqPathExpressions:
        - .spec.template.spec.containers[] | select(.name == "controller").env[] | select(.name == "CLUSTER_NAME" or .name == "CLUSTER_ENDPOINT" or .name == "INTERRUPTION_QUEUE")
