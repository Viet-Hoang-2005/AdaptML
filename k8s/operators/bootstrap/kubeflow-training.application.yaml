apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kubeflow-training
  namespace: argocd
spec:
  project: platform-operators
  source:
    repoURL: https://github.com/Viet-Hoang-2005/MLOps-paas-system.git
    targetRevision: main
    path: k8s/operators/kubeflow-training
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
      - FailOnSharedResource=true
