apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: mlops-paas-training-cpu
spec:
  template:
    metadata:
      labels:
        mlops-paas/nodepool: training-cpu
        workload-type: training
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - "c6i.2xlarge"
            - "c6i.4xlarge"
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: training-cpu
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: mlops-paas-training-gpu
spec:
  template:
    metadata:
      labels:
        mlops-paas/nodepool: training-gpu
        workload-type: training
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - "g4dn.xlarge"
            - "g4dn.12xlarge"
            - "g5.xlarge"
            - "g5.12xlarge"
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: training-gpu
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: training-cpu
spec:
  amiFamily: Custom
  amiSelectorTerms:
    - name: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
      owner: "099720109477"
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  instanceProfile: mlops-karpenter-node-profile
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "mlops-paas-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "mlops-paas-cluster"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
  userData: |
    #!/bin/bash
    set -euxo pipefail
    exec > >(tee /var/log/mlops-k3s-agent-bootstrap.log | logger -t mlops-k3s-agent-bootstrap -s 2>/dev/console) 2>&1

    metadata_token="$(curl -fsSL -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" http://169.254.169.254/latest/api/token)"
    metadata() {
      curl -fsSL -H "X-aws-ec2-metadata-token: ${metadata_token}" "http://169.254.169.254/latest/meta-data/${1}"
    }

    instance_id="$(metadata instance-id)"
    availability_zone="$(metadata placement/availability-zone)"
    instance_type="$(metadata instance-type)"
    region="${availability_zone%?}"
    provider_id="aws:///${availability_zone}/${instance_id}"

    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y awscli ca-certificates curl jq

    secret_value="$(aws secretsmanager get-secret-value --region "${region}" --secret-id mlops/k3s-agent-token --query SecretString --output text)"
    if echo "${secret_value}" | jq -e . >/dev/null 2>&1; then
      k3s_token="$(echo "${secret_value}" | jq -r '.token // .K3S_TOKEN // .k3s_token // .value')"
    else
      k3s_token="${secret_value}"
    fi

    curl -sfL https://get.k3s.io | \
      K3S_URL="https://10.0.1.179:6443" \
      K3S_TOKEN="${k3s_token}" \
      INSTALL_K3S_EXEC="agent \
        --node-label=karpenter.sh/nodepool=mlops-paas-training-cpu \
        --node-label=karpenter.k8s.aws/ec2nodeclass=training-cpu \
        --node-label=mlops-paas/nodepool=training-cpu \
        --node-label=workload-type=training \
        --node-label=node.kubernetes.io/instance-type=${instance_type} \
        --node-label=topology.kubernetes.io/region=${region} \
        --node-label=topology.kubernetes.io/zone=${availability_zone} \
        --kubelet-arg=provider-id=${provider_id}" \
      sh -
---
