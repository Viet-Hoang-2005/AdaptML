apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: mlops-paas-training-cpu
spec:
  template:
    metadata:
      labels:
        mlops-paas/nodepool: training-cpu
        workload-type: training
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - "c6i.2xlarge"
            - "c6i.4xlarge"
      nodeClassRef:
        name: default
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: mlops-paas-training-gpu
spec:
  template:
    metadata:
      labels:
        mlops-paas/nodepool: training-gpu
        workload-type: training
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - "g4dn.xlarge"
            - "g4dn.12xlarge"
            - "g5.xlarge"
            - "g5.12xlarge"
      nodeClassRef:
        name: default
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # K3s self-managed note: IAM lets Karpenter create EC2 instances, but
  # those instances still need userData or a custom AMI that runs k3s agent
  # and joins them to the existing K3s master.
  amiFamily: AL2
  instanceProfile: mlops-karpenter-node-profile
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "mlops-paas-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "mlops-paas-cluster"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
