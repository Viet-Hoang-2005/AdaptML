apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: mlflow-server
  labels:
    app: mlflow-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      nodeSelector:
        workload-type: worker
      initContainers:
        - name: ensure-mlflow-schema
          image: ghcr.io/mlflow/mlflow:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import os, psycopg2
              conn = psycopg2.connect(
                  host="mlops-paas-postgres-rw.default.svc.cluster.local",
                  port=5432,
                  user=os.environ["DB_USER"],
                  password=os.environ["DB_PASSWORD"],
                  dbname="mlops_paas_db"
              )
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute("CREATE SCHEMA IF NOT EXISTS mlflow;")
              conn.close()
              print("Schema mlflow verified successfully.")
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DB_PASSWORD
      containers:
        - name: mlflow-server
          image: ghcr.io/mlflow/mlflow:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri "postgresql://${DB_USER}:${DB_PASSWORD}@mlops-paas-postgres-rw.default.svc.cluster.local:5432/mlops_paas_db?options=-c%20search_path%3Dmlflow" \
                --default-artifact-root "s3://mlops-paas-artifacts/mlflow/"
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: mlflow-server-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
