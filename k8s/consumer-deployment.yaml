apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-nids-consumer
  labels:
    app: mlops-nids-consumer
spec:
  # Consumer chỉ cần 1 replica (vì ta dùng kafka group consumer) là đủ dọt dẹp thoải mái
  replicas: 1
  selector:
    matchLabels:
      app: mlops-nids-consumer
  template:
    metadata:
      labels:
        app: mlops-nids-consumer
    spec:
      containers:
        - name: consumer
          # Ta xài lén image của API, vì thư viện confluent-kafka và DB_MANAGER đều nằm chung
          image: tnvhoang/mlops-nids-api:latest
          imagePullPolicy: Always
          command: ["python", "src/consumer.py"]
          env:
            - name: REDPANDA_BROKERS
              value: "redpanda-service:9092"
            - name: EVIDENTLY_TRIGGER_THRESHOLD
              value: "100"
            - name: GITHUB_REPO
              value: "Viet-Hoang-2005/MLOps-nids-system"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-secrets
                  key: GITHUB_TOKEN
            - name: DB_HOST_RW
              value: "nids-postgres-rw"
            - name: DB_HOST # Dự phòng cho các logic local ngầm
              value: "nids-postgres-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "mlops_nids_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
