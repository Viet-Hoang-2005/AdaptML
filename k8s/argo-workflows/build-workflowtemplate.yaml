apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-model-packager-template
  namespace: default
spec:
  serviceAccountName: argo-workflow-sa
  entrypoint: build-model
  onExit: notify-build-exit
  volumes:
    - name: workspace-vol
      emptyDir: {}
    - name: harbor-config
      secret:
        secretName: harbor-registry-dockerconfig
        items:
          - key: config.json
            path: config.json
  templates:
    - name: build-model
      inputs:
        parameters:
          - name: model_id
          - name: model_hashid
          - name: tenant_id
          - name: flavor
          - name: requirements_text
          - name: source_key
          - name: source_type
          - name: training_artifact_uri
          - name: output_key
          - name: task_type
          - name: label_mapping_key
          - name: control_plane_webhook_url
      steps:
        - - name: prepare-package
            template: prepare-package-step
            arguments:
              parameters:
                - name: model_id
                  value: "{{inputs.parameters.model_id}}"
                - name: model_hashid
                  value: "{{inputs.parameters.model_hashid}}"
                - name: tenant_id
                  value: "{{inputs.parameters.tenant_id}}"
                - name: flavor
                  value: "{{inputs.parameters.flavor}}"
                - name: requirements_text
                  value: "{{inputs.parameters.requirements_text}}"
                - name: source_key
                  value: "{{inputs.parameters.source_key}}"
                - name: source_type
                  value: "{{inputs.parameters.source_type}}"
                - name: training_artifact_uri
                  value: "{{inputs.parameters.training_artifact_uri}}"
                - name: output_key
                  value: "{{inputs.parameters.output_key}}"
                - name: task_type
                  value: "{{inputs.parameters.task_type}}"
                - name: label_mapping_key
                  value: "{{inputs.parameters.label_mapping_key}}"
                - name: control_plane_webhook_url
                  value: "{{inputs.parameters.control_plane_webhook_url}}"
        - - name: kaniko-build
            template: kaniko-build-step
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{inputs.parameters.tenant_id}}"
                - name: model_hashid
                  value: "{{inputs.parameters.model_hashid}}"
        - - name: notify-success
            template: notify-success-step
            arguments:
              parameters:
                - name: model_id
                  value: "{{inputs.parameters.model_id}}"
                - name: model_hashid
                  value: "{{inputs.parameters.model_hashid}}"
                - name: control_plane_webhook_url
                  value: "{{inputs.parameters.control_plane_webhook_url}}"

    - name: prepare-package-step
      nodeSelector:
        workload-type: worker
      inputs:
        parameters:
          - name: model_id
          - name: model_hashid
          - name: tenant_id
          - name: flavor
          - name: requirements_text
          - name: source_key
          - name: source_type
          - name: training_artifact_uri
          - name: output_key
          - name: task_type
          - name: label_mapping_key
          - name: control_plane_webhook_url
      container:
        image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-model-packager:276dba0c13cbb3737b6ab730a64f737174cc37c1
        imagePullPolicy: Always
        volumeMounts:
          - name: workspace-vol
            mountPath: /workspace
        env:
          - name: BUILD_ENGINE
            value: "kaniko"
          - name: BUILD_WORKSPACE_DIR
            value: "/workspace"
          - name: TASK_TYPE
            value: "{{inputs.parameters.task_type}}"
          - name: LABEL_MAPPING_KEY
            value: "{{inputs.parameters.label_mapping_key}}"
          - name: MODEL_ID
            value: "{{inputs.parameters.model_id}}"
          - name: MODEL_HASHID
            value: "{{inputs.parameters.model_hashid}}"
          - name: TENANT_ID
            value: "{{inputs.parameters.tenant_id}}"
          - name: FLAVOR
            value: "{{inputs.parameters.flavor}}"
          - name: REQUIREMENTS_TEXT
            value: "{{inputs.parameters.requirements_text}}"
          - name: SOURCE_KEY
            value: "{{inputs.parameters.source_key}}"
          - name: SOURCE_TYPE
            value: "{{inputs.parameters.source_type}}"
          - name: TRAINING_ARTIFACT_URI
            value: "{{inputs.parameters.training_artifact_uri}}"
          - name: OUTPUT_KEY
            value: "{{inputs.parameters.output_key}}"
          - name: CONTROL_PLANE_WEBHOOK_URL
            value: "{{inputs.parameters.control_plane_webhook_url}}"
          - name: CONTROL_PLANE_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: mlops-paas-secret
                key: CONTROL_PLANE_WEBHOOK_SECRET
        envFrom:
          - secretRef:
              name: mlops-paas-secret
          - secretRef:
              name: harbor-registry-secret
          - configMapRef:
              name: mlops-paas-control-plane-config

    - name: kaniko-build-step
      nodeSelector:
        workload-type: worker
      inputs:
        parameters:
          - name: tenant_id
          - name: model_hashid
      container:
        image: gcr.io/kaniko-project/executor:latest
        args:
          - "--context=dir:///workspace"
          - "--dockerfile=/workspace/Dockerfile"
          - "--destination=registry.mlops-nids-nt114.id.vn/user-images/{{inputs.parameters.tenant_id}}-model-{{inputs.parameters.model_hashid}}:latest"
          - "--insecure"
          - "--skip-tls-verify"
          - "--skip-tls-verify-pull"
        volumeMounts:
          - name: workspace-vol
            mountPath: /workspace
          - name: harbor-config
            mountPath: /kaniko/.docker/

    - name: notify-success-step
      nodeSelector:
        workload-type: worker
      inputs:
        parameters:
          - name: model_id
          - name: model_hashid
          - name: control_plane_webhook_url
      container:
        image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-model-packager:276dba0c13cbb3737b6ab730a64f737174cc37c1
        imagePullPolicy: Always
        volumeMounts:
          - name: workspace-vol
            mountPath: /workspace
        env:
          - name: TASK_TYPE
            value: "NOTIFY_BUILD"
          - name: BUILD_WORKSPACE_DIR
            value: "/workspace"
          - name: MODEL_ID
            value: "{{inputs.parameters.model_id}}"
          - name: MODEL_HASHID
            value: "{{inputs.parameters.model_hashid}}"
          - name: CONTROL_PLANE_WEBHOOK_URL
            value: "{{inputs.parameters.control_plane_webhook_url}}"
          - name: CONTROL_PLANE_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: mlops-paas-secret
                key: CONTROL_PLANE_WEBHOOK_SECRET
        envFrom:
          - secretRef:
              name: mlops-paas-secret
          - configMapRef:
              name: mlops-paas-control-plane-config

    - name: notify-build-exit
      nodeSelector:
        workload-type: worker
      container:
        image: curlimages/curl:8.8.0
        command: [sh, -c]
        args:
          - |
            if [ "{{workflow.status}}" = "Succeeded" ]; then
              echo "Build workflow succeeded; success callback is handled by notify-success-step."
              exit 0
            fi
            echo "Build workflow {{workflow.name}} finished with status {{workflow.status}}. Notifying Control Plane..."
            curl -sS -X POST "{{workflow.parameters.control_plane_webhook_url}}" \
              -H "Content-Type: application/json" \
              -H "X-Build-Webhook-Secret: ${CONTROL_PLANE_WEBHOOK_SECRET}" \
              --data "{\"status\":\"error\",\"task_type\":\"BUILD\",\"error_message\":\"Argo build workflow {{workflow.name}} failed with status {{workflow.status}}\"}"
        env:
          - name: CONTROL_PLANE_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: mlops-paas-secret
                key: CONTROL_PLANE_WEBHOOK_SECRET
