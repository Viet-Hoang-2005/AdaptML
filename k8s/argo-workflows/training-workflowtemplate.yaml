apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-training-pipeline-template
  namespace: default
spec:
  serviceAccountName: argo-workflow-sa
  entrypoint: training-pipeline
  onExit: report-status
  templates:
    - name: training-pipeline
      inputs:
        parameters:
          - name: job_id
          - name: project_id
          - name: tenant_id
          - name: job_name
          - name: namespace
          - name: vcpu
          - name: memory
          - name: accelerator_type
          - name: accelerator_count
          - name: s3_source_uri
          - name: s3_training_data_uri
          - name: s3_output_uri
          - name: entry_point
          - name: model_version
          - name: control_plane_webhook_url
          - name: requirements_text
            value: ""
          - name: mlflow_tracking_uri
            value: "http://mlflow-server.mlflow-server.svc.cluster.local:5000"
          - name: mlflow_experiment_name
            value: ""
          - name: mlflow_artifact_root
            value: ""
      steps:
        - - name: run-cpu-pytorch-job
            template: cpu-pytorch-job
            when: "'{{inputs.parameters.accelerator_type}}' != 'gpu' || {{inputs.parameters.accelerator_count}} == 0"
            arguments:
              parameters:
                - name: job_id
                  value: "{{inputs.parameters.job_id}}"
                - name: project_id
                  value: "{{inputs.parameters.project_id}}"
                - name: tenant_id
                  value: "{{inputs.parameters.tenant_id}}"
                - name: job_name
                  value: "{{inputs.parameters.job_name}}"
                - name: namespace
                  value: "{{inputs.parameters.namespace}}"
                - name: vcpu
                  value: "{{inputs.parameters.vcpu}}"
                - name: memory
                  value: "{{inputs.parameters.memory}}"
                - name: s3_source_uri
                  value: "{{inputs.parameters.s3_source_uri}}"
                - name: s3_training_data_uri
                  value: "{{inputs.parameters.s3_training_data_uri}}"
                - name: s3_output_uri
                  value: "{{inputs.parameters.s3_output_uri}}"
                - name: entry_point
                  value: "{{inputs.parameters.entry_point}}"
                - name: model_version
                  value: "{{inputs.parameters.model_version}}"
                - name: requirements_text
                  value: "{{inputs.parameters.requirements_text}}"
                - name: mlflow_tracking_uri
                  value: "{{inputs.parameters.mlflow_tracking_uri}}"
                - name: mlflow_experiment_name
                  value: "{{inputs.parameters.mlflow_experiment_name}}"
                - name: mlflow_artifact_root
                  value: "{{inputs.parameters.mlflow_artifact_root}}"
          - name: run-gpu-pytorch-job
            template: gpu-pytorch-job
            when: "'{{inputs.parameters.accelerator_type}}' == 'gpu' && {{inputs.parameters.accelerator_count}} > 0"
            arguments:
              parameters:
                - name: job_id
                  value: "{{inputs.parameters.job_id}}"
                - name: project_id
                  value: "{{inputs.parameters.project_id}}"
                - name: tenant_id
                  value: "{{inputs.parameters.tenant_id}}"
                - name: job_name
                  value: "{{inputs.parameters.job_name}}"
                - name: namespace
                  value: "{{inputs.parameters.namespace}}"
                - name: vcpu
                  value: "{{inputs.parameters.vcpu}}"
                - name: memory
                  value: "{{inputs.parameters.memory}}"
                - name: accelerator_count
                  value: "{{inputs.parameters.accelerator_count}}"
                - name: s3_source_uri
                  value: "{{inputs.parameters.s3_source_uri}}"
                - name: s3_training_data_uri
                  value: "{{inputs.parameters.s3_training_data_uri}}"
                - name: s3_output_uri
                  value: "{{inputs.parameters.s3_output_uri}}"
                - name: entry_point
                  value: "{{inputs.parameters.entry_point}}"
                - name: model_version
                  value: "{{inputs.parameters.model_version}}"
                - name: requirements_text
                  value: "{{inputs.parameters.requirements_text}}"
                - name: mlflow_tracking_uri
                  value: "{{inputs.parameters.mlflow_tracking_uri}}"
                - name: mlflow_experiment_name
                  value: "{{inputs.parameters.mlflow_experiment_name}}"
                - name: mlflow_artifact_root
                  value: "{{inputs.parameters.mlflow_artifact_root}}"
    - name: cpu-pytorch-job
      inputs:
        parameters:
          - name: job_id
          - name: project_id
          - name: tenant_id
          - name: job_name
          - name: namespace
          - name: vcpu
          - name: memory
          - name: s3_source_uri
          - name: s3_training_data_uri
          - name: s3_output_uri
          - name: entry_point
          - name: model_version
          - name: requirements_text
          - name: mlflow_tracking_uri
          - name: mlflow_experiment_name
          - name: mlflow_artifact_root
      resource:
        action: create
        successCondition: status.replicaStatuses.Master.succeeded == 1
        failureCondition: status.replicaStatuses.Master.failed > 0
        manifest: |
          apiVersion: kubeflow.org/v1
          kind: PyTorchJob
          metadata:
            name: {{inputs.parameters.job_name}}
            namespace: {{inputs.parameters.namespace}}
            labels:
              app.kubernetes.io/part-of: mlops-paas
              app.kubernetes.io/component: training
              app.kubernetes.io/managed-by: argo-workflows
              mlops.io/training-job-id: "{{inputs.parameters.job_id}}"
              mlops.io/project-id: "{{inputs.parameters.project_id}}"
              mlops.io/tenant-id: "{{inputs.parameters.tenant_id}}"
          spec:
            pytorchReplicaSpecs:
              Master:
                replicas: 1
                restartPolicy: Never
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/part-of: mlops-paas
                      app.kubernetes.io/component: training
                      app.kubernetes.io/managed-by: argo-workflows
                      mlops.io/training-job-id: "{{inputs.parameters.job_id}}"
                      mlops.io/project-id: "{{inputs.parameters.project_id}}"
                      mlops.io/tenant-id: "{{inputs.parameters.tenant_id}}"
                  spec:
                    nodeSelector:
                      mlops-paas/nodepool: training-cpu
                    imagePullSecrets:
                      - name: harbor-registry-pull-secret
                    containers:
                      - name: pytorch
                        image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-training-runner:276dba0c13cbb3737b6ab730a64f737174cc37c1
                        resources:
                          requests:
                            cpu: "{{inputs.parameters.vcpu}}"
                            memory: "{{inputs.parameters.memory}}Mi"
                          limits:
                            cpu: "{{inputs.parameters.vcpu}}"
                            memory: "{{inputs.parameters.memory}}Mi"
                        envFrom:
                          - secretRef:
                              name: mlops-paas-secret
                          - configMapRef:
                              name: mlops-paas-control-plane-config
                        env:
                          - name: S3_SOURCE_URI
                            value: "{{inputs.parameters.s3_source_uri}}"
                          - name: S3_TRAINING_DATA_URI
                            value: "{{inputs.parameters.s3_training_data_uri}}"
                          - name: S3_OUTPUT_URI
                            value: "{{inputs.parameters.s3_output_uri}}"
                          - name: REQUIREMENTS_TEXT
                            value: "{{inputs.parameters.requirements_text}}"
                          - name: TRAINING_JOB_ID
                            value: "{{inputs.parameters.job_id}}"
                          - name: TENANT_ID
                            value: "{{inputs.parameters.tenant_id}}"
                          - name: ENTRY_POINT
                            value: "{{inputs.parameters.entry_point}}"
                          - name: MODEL_VERSION
                            value: "{{inputs.parameters.model_version}}"
                          - name: REDIS_URL
                            value: "redis://mlops-paas-redis.default.svc.cluster.local:6379/1"
                          - name: MLFLOW_TRACKING_URI
                            value: "{{inputs.parameters.mlflow_tracking_uri}}"
                          - name: MLFLOW_EXPERIMENT_NAME
                            value: "{{inputs.parameters.mlflow_experiment_name}}"
                          - name: MLFLOW_ARTIFACT_ROOT
                            value: "{{inputs.parameters.mlflow_artifact_root}}"
    - name: gpu-pytorch-job
      inputs:
        parameters:
          - name: job_id
          - name: project_id
          - name: tenant_id
          - name: job_name
          - name: namespace
          - name: vcpu
          - name: memory
          - name: accelerator_count
          - name: s3_source_uri
          - name: s3_training_data_uri
          - name: s3_output_uri
          - name: entry_point
          - name: model_version
          - name: requirements_text
          - name: mlflow_tracking_uri
          - name: mlflow_experiment_name
          - name: mlflow_artifact_root
      resource:
        action: create
        successCondition: status.replicaStatuses.Master.succeeded == 1
        failureCondition: status.replicaStatuses.Master.failed > 0
        manifest: |
          apiVersion: kubeflow.org/v1
          kind: PyTorchJob
          metadata:
            name: {{inputs.parameters.job_name}}
            namespace: {{inputs.parameters.namespace}}
            labels:
              app.kubernetes.io/part-of: mlops-paas
              app.kubernetes.io/component: training
              app.kubernetes.io/managed-by: argo-workflows
              mlops.io/training-job-id: "{{inputs.parameters.job_id}}"
              mlops.io/project-id: "{{inputs.parameters.project_id}}"
              mlops.io/tenant-id: "{{inputs.parameters.tenant_id}}"
          spec:
            pytorchReplicaSpecs:
              Master:
                replicas: 1
                restartPolicy: Never
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/part-of: mlops-paas
                      app.kubernetes.io/component: training
                      app.kubernetes.io/managed-by: argo-workflows
                      mlops.io/training-job-id: "{{inputs.parameters.job_id}}"
                      mlops.io/project-id: "{{inputs.parameters.project_id}}"
                      mlops.io/tenant-id: "{{inputs.parameters.tenant_id}}"
                  spec:
                    nodeSelector:
                      mlops-paas/nodepool: training-gpu
                    tolerations:
                      - key: nvidia.com/gpu
                        operator: Equal
                        value: "true"
                        effect: NoSchedule
                    imagePullSecrets:
                      - name: harbor-registry-pull-secret
                    containers:
                      - name: pytorch
                        image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-training-runner:276dba0c13cbb3737b6ab730a64f737174cc37c1
                        imagePullPolicy: Always
                        resources:
                          requests:
                            cpu: "{{inputs.parameters.vcpu}}"
                            memory: "{{inputs.parameters.memory}}Mi"
                            nvidia.com/gpu: "{{inputs.parameters.accelerator_count}}"
                          limits:
                            cpu: "{{inputs.parameters.vcpu}}"
                            memory: "{{inputs.parameters.memory}}Mi"
                            nvidia.com/gpu: "{{inputs.parameters.accelerator_count}}"
                        envFrom:
                          - secretRef:
                              name: mlops-paas-secret
                          - configMapRef:
                              name: mlops-paas-control-plane-config
                        env:
                          - name: S3_SOURCE_URI
                            value: "{{inputs.parameters.s3_source_uri}}"
                          - name: S3_TRAINING_DATA_URI
                            value: "{{inputs.parameters.s3_training_data_uri}}"
                          - name: S3_OUTPUT_URI
                            value: "{{inputs.parameters.s3_output_uri}}"
                          - name: REQUIREMENTS_TEXT
                            value: "{{inputs.parameters.requirements_text}}"
                          - name: TRAINING_JOB_ID
                            value: "{{inputs.parameters.job_id}}"
                          - name: TENANT_ID
                            value: "{{inputs.parameters.tenant_id}}"
                          - name: ENTRY_POINT
                            value: "{{inputs.parameters.entry_point}}"
                          - name: MODEL_VERSION
                            value: "{{inputs.parameters.model_version}}"
                          - name: REDIS_URL
                            value: "redis://mlops-paas-redis.default.svc.cluster.local:6379/1"
                          - name: MLFLOW_TRACKING_URI
                            value: "{{inputs.parameters.mlflow_tracking_uri}}"
                          - name: MLFLOW_EXPERIMENT_NAME
                            value: "{{inputs.parameters.mlflow_experiment_name}}"
                          - name: MLFLOW_ARTIFACT_ROOT
                            value: "{{inputs.parameters.mlflow_artifact_root}}"
    - name: report-status
      container:
        image: curlimages/curl:latest
        args:
          - -sS
          - -X
          - POST
          - "{{workflow.parameters.control_plane_webhook_url}}"
          - -H
          - "Content-Type: application/json"
          - -H
          - "X-Control-Plane-Secret: $(CONTROL_PLANE_WEBHOOK_SECRET)"
          - --data
          - '{"status":"{{workflow.status}}","workflow_status":"{{workflow.status}}","output_uri":"{{workflow.parameters.s3_output_uri}}"}'
        env:
          - name: CONTROL_PLANE_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: mlops-paas-secret
                key: CONTROL_PLANE_WEBHOOK_SECRET
                optional: true
