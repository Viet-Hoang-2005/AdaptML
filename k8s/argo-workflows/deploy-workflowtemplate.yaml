apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-model-server-deploy-template
  namespace: default
spec:
  serviceAccountName: argo-workflow-sa
  entrypoint: deploy-model
  templates:
    - name: deploy-model
      nodeSelector:
        workload-type: worker
      inputs:
        parameters:
          - name: tenant_id
          - name: model_id
          - name: hashid
          - name: version
          - name: image_name
          - name: container_name
          - name: model_type
            default: "ml"
          - name: target_port
            default: "5001"
          - name: model_uri
            default: ""
      script:
        image: bitnami/kubectl:latest
        command: [bash]
        source: |
          set -e
          kubectl delete middleware rewrite-{{inputs.parameters.container_name}} --ignore-not-found
          kubectl delete ingressroute ingressroute-{{inputs.parameters.container_name}} --ignore-not-found
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{inputs.parameters.container_name}}
            namespace: default
            labels:
              app: model-endpoint
              tenant: {{inputs.parameters.tenant_id}}
              model: "{{inputs.parameters.model_id}}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: {{inputs.parameters.container_name}}
            template:
              metadata:
                labels:
                  app: {{inputs.parameters.container_name}}
              spec:
                nodeSelector:
                  workload-type: worker
                containers:
                  - name: model-server
                    image: {{inputs.parameters.image_name}}
                    imagePullPolicy: Always
                    ports:
                      - containerPort: {{inputs.parameters.target_port}}
                    envFrom:
                      - secretRef:
                          name: mlops-paas-secret
                      - configMapRef:
                          name: mlops-paas-control-plane-config
                    env:
                      - name: TENANT_ID
                        value: "{{inputs.parameters.tenant_id}}"
                      - name: MODEL_ID
                        value: "{{inputs.parameters.model_id}}"
                      - name: MODEL_HASHID
                        value: "{{inputs.parameters.hashid}}"
                      - name: MODEL_VERSION
                        value: "{{inputs.parameters.version}}"
                      - name: MODEL_URI
                        value: "{{inputs.parameters.model_uri}}"
                      - name: PYTHONPATH
                        value: "/app/libs:/app"
                    volumeMounts:
                      - name: dynamic-libs
                        mountPath: /app/libs
                      - name: pip-cache
                        mountPath: /root/.cache/pip
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        cpu: 1000m
                        memory: 1Gi
                volumes:
                  - name: dynamic-libs
                    emptyDir: {}
                  - name: pip-cache
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: {{inputs.parameters.container_name}}-svc
            namespace: default
            labels:
              component: model-server
              serving-engine: {{inputs.parameters.model_type}}
          spec:
            selector:
              app: {{inputs.parameters.container_name}}
            ports:
              - name: http
                protocol: TCP
                port: {{inputs.parameters.target_port}}
                targetPort: {{inputs.parameters.target_port}}
          EOF
          echo "Worker deployment successfully created: {{inputs.parameters.container_name}} using image {{inputs.parameters.image_name}}"
