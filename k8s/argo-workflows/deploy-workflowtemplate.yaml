apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-paas-model-server-deploy-template
  namespace: default
spec:
  serviceAccountName: argo-workflow-sa
  entrypoint: deploy-model
  templates:
    - name: deploy-model
      nodeSelector:
        workload-type: worker
      inputs:
        parameters:
          - name: tenant_id
          - name: model_id
          - name: hashid
          - name: version
          - name: image_name
          - name: container_name
      script:
        image: bitnami/kubectl:latest
        command: [bash]
        source: |
          set -e
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{inputs.parameters.container_name}}
            namespace: default
            labels:
              app: model-endpoint
              tenant: {{inputs.parameters.tenant_id}}
              model: "{{inputs.parameters.model_id}}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: {{inputs.parameters.container_name}}
            template:
              metadata:
                labels:
                  app: {{inputs.parameters.container_name}}
              spec:
                nodeSelector:
                  workload-type: worker
                containers:
                  - name: model-server
                    image: {{inputs.parameters.image_name}}
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 5000
                    envFrom:
                      - secretRef:
                          name: mlops-paas-secret
                      - configMapRef:
                          name: mlops-paas-control-plane-config
                    env:
                      - name: TENANT_ID
                        value: "{{inputs.parameters.tenant_id}}"
                      - name: MODEL_ID
                        value: "{{inputs.parameters.model_id}}"
                      - name: MODEL_HASHID
                        value: "{{inputs.parameters.hashid}}"
                      - name: MODEL_VERSION
                        value: "{{inputs.parameters.version}}"
                      - name: DB_USER
                        valueFrom:
                          secretKeyRef:
                            name: postgres-secrets
                            key: DB_USER
                      - name: DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: postgres-secrets
                            key: DB_PASSWORD
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        cpu: 1000m
                        memory: 1Gi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: {{inputs.parameters.container_name}}-svc
            namespace: default
            labels:
              component: model-server
          spec:
            selector:
              app: {{inputs.parameters.container_name}}
            ports:
              - name: http
                protocol: TCP
                port: 5000
                targetPort: 5000
          ---
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: rewrite-{{inputs.parameters.container_name}}
            namespace: default
          spec:
            replacePath:
              path: /models/{{inputs.parameters.hashid}}/predict
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: ingressroute-{{inputs.parameters.container_name}}
            namespace: default
          spec:
            entryPoints:
              - web
            routes:
              - match: PathPrefix(`/{{inputs.parameters.tenant_id}}/models/{{inputs.parameters.hashid}}/{{inputs.parameters.version}}/predict`)
                kind: Rule
                middlewares:
                  - name: rewrite-{{inputs.parameters.container_name}}
                services:
                  - name: {{inputs.parameters.container_name}}-svc
                    port: 5000
          EOF
          echo "Deployment successfully created: {{inputs.parameters.container_name}} using image {{inputs.parameters.image_name}}"
