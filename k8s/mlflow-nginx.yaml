---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-nginx-config
  labels:
    app: mlflow-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      client_max_body_size 100m;

      location / {
        auth_basic "MLflow";
        auth_basic_user_file /etc/nginx/auth/auth;

        proxy_pass http://mlflow-service:5000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-nginx
  labels:
    app: mlflow-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-nginx
  template:
    metadata:
      labels:
        app: mlflow-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-auth
              mountPath: /etc/nginx/auth
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: nginx-config
          configMap:
            name: mlflow-nginx-config
        - name: nginx-auth
          secret:
            secretName: mlflow-basic-auth

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-nginx-service
  labels:
    app: mlflow-nginx
spec:
  type: ClusterIP
  selector:
    app: mlflow-nginx
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
