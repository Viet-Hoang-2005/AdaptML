# api-deployment.yaml: Triển khai FastAPI NIDS lên K3s với Init Container kéo model từ S3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-nids-api
  labels:
    app: mlops-nids-api
spec:
  # Sử dụng 2 replicas để giảm áp lực RAM trên Worker khi chạy cùng CloudNativePG
  replicas: 2
  selector:
    matchLabels:
      app: mlops-nids-api
  template:
    metadata:
      labels:
        app: mlops-nids-api
    spec:
      # INIT CONTAINER: Chạy trước FastAPI để kéo model từ S3
      # Dùng emptyDir volume để chia sẻ file .pkl với app container
      initContainers:
        - name: aws-s3-model-sync
          image: amazon/aws-cli:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Đọc MODEL_VERSION từ env để biết tải version nào
              echo "Syncing model version: ${MODEL_VERSION} from S3..."
              mkdir -p /models/${MODEL_VERSION}

              # Tải file model XGBoost (.pkl)
              aws s3 cp s3://${AWS_BUCKET_NAME}/models/${MODEL_VERSION}/xgb_nids_model_${MODEL_VERSION}.pkl \
                /models/${MODEL_VERSION}/xgb_nids_model_${MODEL_VERSION}.pkl

              # Tải file label classes (.json)
              aws s3 cp s3://${AWS_BUCKET_NAME}/models/${MODEL_VERSION}/label_classes_${MODEL_VERSION}.json \
                /models/${MODEL_VERSION}/label_classes_${MODEL_VERSION}.json

              echo "Model sync complete."
              ls -la /models/${MODEL_VERSION}/
          # Cấu hình biến môi trường cho Init Container
          env:
            - name: MODEL_VERSION
              value: "v1"
            - name: AWS_BUCKET_NAME
              value: "mlops-nids-artifacts"
            - name: AWS_DEFAULT_REGION
              value: "ap-southeast-1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secrets
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: model-volume
              mountPath: /models

      # APP CONTAINER: FastAPI NIDS Server
      containers:
        - name: fastapi-server
          image: tnvhoang/mlops-nids-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            # Version model phải khớp với MODEL_VERSION trong Init Container
            - name: MODEL_VERSION
              value: "v1"

            # CloudNativePG READ-WRITE endpoint dùng cho INSERT log production data
            - name: DB_HOST_RW
              value: "nids-postgres-rw"
            # Fallback cho docker-compose local (chỉ có 1 host)
            - name: DB_HOST
              value: "nids-postgres-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "mlops_nids_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: model-volume
              mountPath: /models  # FastAPI đọc file .pkl từ đây

          # Kiểm tra pod sẵn sàng nhận traffic chưa (dùng endpoint health check đã thêm)
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          # Tự động restart pod nếu bị treo
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15

      volumes:
        - name: model-volume
          # emptyDir: Volume tạm thời trong RAM của Node
          # Init Container ghi file .pkl vào đây -> App Container đọc ra
          emptyDir: {}

# Service để load balance traffic đến các pod của API
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: mlops-nids-api
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000

# Ingress để expose API ra bên ngoài
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  annotations:
    # Báo cho K3s biết hãy dùng Traefik (mặc định) để bắt traffic
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80