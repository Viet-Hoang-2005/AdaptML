# external-secrets.yaml: Cấu hình tự động kéo Secrets từ AWS Secrets Manager về K3s
---
# 1. Kéo Postgres User và Password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secrets-sync
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: mlops/production-secrets
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: mlops/production-secrets
        property: DB_PASSWORD
    # Bổ sung key username/password để CloudNativePG có thể hiểu được
    - secretKey: username
      remoteRef:
        key: mlops/production-secrets
        property: DB_USER
    - secretKey: password
      remoteRef:
        key: mlops/production-secrets
        property: DB_PASSWORD

