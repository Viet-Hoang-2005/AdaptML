---
# 5. Kéo Secret của Apps (FE + BE)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-paas-app-secret-sync
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mlops-paas-secret
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: mlops/production-secrets
        property: DJANGO_SECRET_KEY
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: mlops/production-secrets
        property: JWT_PRIVATE_KEY
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: mlops/production-secrets
        property: JWT_PUBLIC_KEY
    - secretKey: CONTROL_PLANE_WEBHOOK_SECRET
      remoteRef:
        key: mlops/production-secrets
        property: CONTROL_PLANE_WEBHOOK_SECRET
    - secretKey: GOOGLE_OAUTH2_CLIENT_ID
      remoteRef:
        key: mlops/production-secrets
        property: GOOGLE_OAUTH2_CLIENT_ID
    - secretKey: GITHUB_OAUTH2_CLIENT_ID
      remoteRef:
        key: mlops/production-secrets
        property: GITHUB_OAUTH2_CLIENT_ID
    - secretKey: GITHUB_OAUTH2_CLIENT_SECRET
      remoteRef:
        key: mlops/production-secrets
        property: GITHUB_OAUTH2_CLIENT_SECRET

    - secretKey: EMAIL_HOST_USER
      remoteRef:
        key: mlops/production-secrets
        property: EMAIL_HOST_USER
    - secretKey: EMAIL_HOST_PASSWORD
      remoteRef:
        key: mlops/production-secrets
        property: EMAIL_HOST_PASSWORD
