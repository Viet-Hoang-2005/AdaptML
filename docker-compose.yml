version: '3.8'

services:
  # 1. PostgreSQL Database (mô phỏng CloudNativePG local)
  postgres:
    image: postgres:15-alpine
    container_name: mlops_nids_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - mlops_nids_pgdata:/var/lib/postgresql/data
    networks:
      - mlops_nids_network
    # Đợi PostgreSQL thực sự sẵn sàng nhận connection trước khi API start
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Django Control Plane (Auth & Users)
  control_plane:
    build:
      context: ./services/api/control-plane
      dockerfile: Dockerfile
    container_name: mlops_nids_django
    restart: always
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-dev-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,control_plane}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379/1
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      GOOGLE_OAUTH2_CLIENT_ID: ${GOOGLE_OAUTH2_CLIENT_ID}
      GITHUB_OAUTH2_CLIENT_ID: ${GITHUB_OAUTH2_CLIENT_ID}
      GITHUB_OAUTH2_CLIENT_SECRET: ${GITHUB_OAUTH2_CLIENT_SECRET}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:5173/oauth/github/callback}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-mlops-paas-artifacts}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
    volumes:
      - ./services/api/control-plane:/app
    command: sh -c "python src/manage.py migrate && python src/manage.py runserver 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mlops_nids_network

  # 3. FastAPI Inference Server (Data Plane)
  api:
    build:
      context: ./services/api/model-server
      dockerfile: Dockerfile
    container_name: mlops_nids_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: 1
      MODEL_VERSION: ${MODEL_VERSION:-v1}
      # CloudNativePG local: cả RW và RO đều trỏ về cùng 1 container postgres
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      REDPANDA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ai_paas_production_logs}
      JWKS_URL: http://control_plane:8000/api/auth/.well-known/jwks.json
      EVIDENTLY_TRIGGER_THRESHOLD: ${EVIDENTLY_TRIGGER_THRESHOLD:-100}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./models:/models # Mount thư mục models local vào container
      - ./services/api/model-server:/app
    command: uvicorn src.index:app --host 0.0.0.0 --port 5000 --reload
    depends_on:
      postgres:
        condition: service_healthy # Đợi postgres healthy mới start API
      redpanda:
        condition: service_started
    networks:
      - mlops_nids_network

  # 4. Evidently Drift Monitor
  evidently:
    build:
      context: ./services/evidently
      dockerfile: Dockerfile
    container_name: mlops_nids_evidently
    # Không restart tự động - đây là job chạy 1 lần như CronJob trong K3s
    restart: "no"
    environment:
      # Chạy local: cả RO đều trỏ về postgres container
      DB_HOST_RO: postgres
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DRIFT_THRESHOLD: ${DRIFT_THRESHOLD:-0.5}
      MIN_SAMPLES: ${MIN_SAMPLES:-100}
      MAX_SAMPLES: ${MAX_SAMPLES:-100000}
      TENANT_ID: ${TENANT_ID:-T-LOCALDEV}
      MODEL_ID: ${MODEL_ID:-demo-model}
      MODEL_URI: ${MODEL_URI:-models:/demo-model/Production}
      REFERENCE_DATA_S3_URI: ${REFERENCE_DATA_S3_URI:-s3://mlops-paas-artifacts/reference-data/demo-model/reference.csv}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://control_plane:8000/api/v1/internal/drift-webhook}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-super-secret-key}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-mlops-paas-artifacts}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      DRIFT_REPORTS_S3_PREFIX: ${DRIFT_REPORTS_S3_PREFIX:-drift-reports}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - mlops_nids_network

  # 5. MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlops_nids_mlflow
    restart: always
    ports:
      - "5001:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-mlops-paas-artifacts}
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5000 
      --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME} 
      --default-artifact-root s3://${AWS_BUCKET_NAME:-mlops-paas-artifacts}/mlflow-artifacts/
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops_nids_network

  # 6. NIDS Log Consumer (đứng giữa Redpanda và PostgreSQL)
  consumer:
    build:
      context: ./services/api/model-server
      dockerfile: Dockerfile
    container_name: mlops_nids_consumer
    restart: always
    environment:
      PYTHONUNBUFFERED: 1
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      REDPANDA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ai_paas_production_logs}
      EVIDENTLY_TRIGGER_THRESHOLD: ${EVIDENTLY_TRIGGER_THRESHOLD:-100}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./services/api/model-server:/app
    command: python src/consumer.py
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks:
      - mlops_nids_network

  # 7. Redpanda Kafka Broker
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: mlops_nids_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --mode dev-container
    ports:
      - "19092:19092"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - mlops_nids_network

  # Redpanda Console (Kafka UI)
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: mlops_nids_redpanda_console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda
    networks:
      - mlops_nids_network

  # 8. Redis (OTP Cache)
  redis:
    image: redis:7-alpine
    container_name: mlops_nids_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - mlops_nids_network

# Mạng nội bộ cho các container
networks:
  mlops_nids_network:
    driver: bridge

# Volume để lưu trữ dữ liệu của PostgreSQL và Redpanda
volumes:
  mlops_nids_pgdata:
    external: false
  redpanda_data:
