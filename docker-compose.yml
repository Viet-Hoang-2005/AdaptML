version: '3.8'

services:
  # 1. PostgreSQL Database (mô phỏng CloudNativePG local)
  postgres:
    image: postgres:15-alpine
    container_name: mlops_paas_postgres
    restart: on-failure:3
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - mlops_paas_pgdata:/var/lib/postgresql/data
    networks:
      - mlops_paas_network
    # Đợi PostgreSQL thực sự sẵn sàng nhận connection trước khi API start
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Init Container để tạo schema riêng cho Control Plane và MLflow
  schema-init:
    image: postgres:15-alpine
    container_name: mlops_paas_schema_init
    restart: "no"
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    command: >
      sh -c "psql -h postgres -U ${DB_USER} -d ${DB_NAME} -v ON_ERROR_STOP=1
      -c 'CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA:-control-plane};'
      -c 'CREATE SCHEMA IF NOT EXISTS ${MLFLOW_DB_SCHEMA:-mlflow};'"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops_paas_network

  # pgAdmin 4 (PostgreSQL Web GUI)
  pgadmin:
    image: dpage/pgadmin4
    container_name: mlops_paas_pgadmin
    restart: on-failure:3
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops_paas_network

  # 2. Django Control Plane (Auth & Users)
  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    image: mlops-paas-django
    container_name: mlops_paas_django
    restart: on-failure:3
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-dev-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,control-plane}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_SCHEMA: ${DB_SCHEMA:-control-plane}
      REDIS_URL: redis://redis:6379/1
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      GOOGLE_OAUTH2_CLIENT_ID: ${GOOGLE_OAUTH2_CLIENT_ID}
      GITHUB_OAUTH2_CLIENT_ID: ${GITHUB_OAUTH2_CLIENT_ID}
      GITHUB_OAUTH2_CLIENT_SECRET: ${GITHUB_OAUTH2_CLIENT_SECRET}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:5173/oauth/github/callback}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-mlops-paas-artifacts}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      TRAINING_BACKEND: ${TRAINING_BACKEND:-sagemaker}
      AWS_SAGEMAKER_ROLE_ARN: ${AWS_SAGEMAKER_ROLE_ARN}
      SAGEMAKER_INSTANCE_TYPE: ${SAGEMAKER_INSTANCE_TYPE:-ml.m5.large}
      SAGEMAKER_MAX_RUN: ${SAGEMAKER_MAX_RUN:-3600}
      SAGEMAKER_MAX_WAIT: ${SAGEMAKER_MAX_WAIT:-7200}
      SAGEMAKER_OUTPUT_PREFIX: ${SAGEMAKER_OUTPUT_PREFIX:-tenants}
      SAGEMAKER_SKLEARN_FRAMEWORK_VERSION: ${SAGEMAKER_SKLEARN_FRAMEWORK_VERSION:-1.2-1}
      SAGEMAKER_PY_VERSION: ${SAGEMAKER_PY_VERSION:-py3}
      SAGEMAKER_USE_SPOT: ${SAGEMAKER_USE_SPOT:-True}
      LOCAL_TRAINING_TIMEOUT: ${LOCAL_TRAINING_TIMEOUT:-1800}
      LOCAL_TRAINING_MAX_OUTPUT_MB: ${LOCAL_TRAINING_MAX_OUTPUT_MB:-500}
      LOCAL_TRAINING_ALLOW_PIP_INSTALL: ${LOCAL_TRAINING_ALLOW_PIP_INSTALL:-True}
      AWS_BATCH_REGION: ${AWS_BATCH_REGION:-ap-southeast-1}
      AWS_BATCH_JOB_QUEUE: ${AWS_BATCH_JOB_QUEUE}
      AWS_BATCH_JOB_DEFINITION: ${AWS_BATCH_JOB_DEFINITION}
      AWS_BATCH_LOG_GROUP: ${AWS_BATCH_LOG_GROUP:-/aws/batch/mlops-training}
      ENABLE_GPU_TRAINING: ${ENABLE_GPU_TRAINING:-False}
      AWS_BATCH_GPU_JOB_QUEUE: ${AWS_BATCH_GPU_JOB_QUEUE}
      AWS_BATCH_GPU_JOB_DEFINITION: ${AWS_BATCH_GPU_JOB_DEFINITION}
      TRAINING_MAX_ACTIVE_JOBS_PER_TENANT: ${TRAINING_MAX_ACTIVE_JOBS_PER_TENANT:-1}
      MODEL_SERVER_PUBLIC_URL: ${MODEL_SERVER_PUBLIC_URL:-http://localhost:5000}
      MODEL_PACKAGER_URL: http://model-packager:7000
    volumes:
      - ./services/control-plane:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "python src/manage.py ensure_db_schema && python src/manage.py migrate && cd src && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      model-packager:
        condition: service_started
    networks:
      - mlops_paas_network

  # Traefik API Gateway cho Model Server
  traefik:
    image: traefik:latest
    container_name: mlops_paas_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:5000"
    ports:
      - "5000:5000"
      - "8080:8080" # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mlops_paas_network

  # 3. FastAPI Inference Server Image Blueprint (Data Plane)
  model-server:
    build:
      context: ./services/model-server
      dockerfile: Dockerfile
    image: mlops-paas-model-server
    restart: "no"
    command: ["echo", "Model Server Image Built Successfully. Waiting for dynamic execution..."]
    environment:
      PYTHONUNBUFFERED: 1
      MODEL_VERSION: ${MODEL_VERSION:-v1}
      # CloudNativePG local: cả RW và RO đều trỏ về cùng 1 container postgres
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      REDPANDA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-mlops_paas_production_logs}
      JWKS_URL: http://control-plane:8000/api/auth/.well-known/jwks.json
      CONTROL_PLANE_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      CONTROL_PLANE_DB_SCHEMA: ${DB_SCHEMA:-control-plane}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      EVIDENTLY_TRIGGER_THRESHOLD: ${EVIDENTLY_TRIGGER_THRESHOLD:-100}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./models:/models # Mount thư mục models local vào container
      - ./services/model-server:/app

    depends_on:
      postgres:
        condition: service_healthy # Đợi postgres healthy mới start API
      redpanda:
        condition: service_started
    networks:
      - mlops_paas_network

  # 4. Internal MLflow Package Builder
  model-packager:
    build:
      context: ./services/model-packager
      dockerfile: Dockerfile
    image: mlops-paas-model-packager
    container_name: mlops_paas_model_packager
    restart: "no"
    command: ["echo", "Model Packager Image Built Successfully. Waiting for dynamic execution..."]
    environment:
      PYTHONUNBUFFERED: 1
    networks:
      - mlops_paas_network

  # 5. Evidently Drift Monitor
  evidently:
    build:
      context: ./services/evidently
      dockerfile: Dockerfile
    image: mlops-paas-evidently
    container_name: mlops_paas_evidently
    # Không restart tự động - đây là job chạy 1 lần như CronJob trong K3s
    restart: "no"
    environment:
      # Chạy local: cả RO đều trỏ về postgres container
      DB_HOST_RO: postgres
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DRIFT_THRESHOLD: ${DRIFT_THRESHOLD:-0.5}
      MIN_SAMPLES: ${MIN_SAMPLES:-100}
      MAX_SAMPLES: ${MAX_SAMPLES:-100000}
      TENANT_ID: ${TENANT_ID:-T-LOCALDEV}
      MODEL_ID: ${MODEL_ID:-demo-model}
      MODEL_URI: ${MODEL_URI:-models:/demo-model/Production}
      REFERENCE_DATA_S3_URI: ${REFERENCE_DATA_S3_URI:-s3://mlops-paas-artifacts/reference-data/demo-model/reference.csv}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://control-plane:8000/api/v1/internal/drift-webhook}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-super-secret-key}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-mlops-paas-artifacts}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      DRIFT_REPORTS_S3_PREFIX: ${DRIFT_REPORTS_S3_PREFIX:-drift-reports}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - mlops_paas_network

  # 6. MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlops_paas_mlflow
    restart: on-failure:3
    ports:
      - "5001:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-mlops-paas-artifacts}
      - MLFLOW_DB_SCHEMA=${MLFLOW_DB_SCHEMA:-mlflow}
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5000 
      --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?options=-csearch_path%3D${MLFLOW_DB_SCHEMA:-mlflow}%2Cpublic
      --default-artifact-root s3://${AWS_BUCKET_NAME:-mlops-paas-artifacts}/mlflow-artifacts/
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    networks:
      - mlops_paas_network

  # 7. PaaS Log Consumer (đứng giữa Redpanda và PostgreSQL)
  consumer:
    build:
      context: ./services/model-server
      dockerfile: Dockerfile
    image: mlops-paas-consumer
    container_name: mlops_paas_consumer
    restart: on-failure:3
    environment:
      PYTHONUNBUFFERED: 1
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      REDPANDA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-mlops_paas_production_logs}
      EVIDENTLY_TRIGGER_THRESHOLD: ${EVIDENTLY_TRIGGER_THRESHOLD:-100}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./services/model-server:/app
    command: python src/consumer.py
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks:
      - mlops_paas_network

  # 8. Redpanda Kafka Broker
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: mlops_paas_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --mode dev-container
    ports:
      - "19092:19092"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - mlops_paas_network

  # Redpanda Console UI
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: mlops_paas_redpanda_console
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda
    networks:
      - mlops_paas_network

  # 9. Redis (Cache)
  redis:
    image: redis:7-alpine
    container_name: mlops_paas_redis
    restart: on-failure:3
    ports:
      - "6379:6379"
    networks:
      - mlops_paas_network

# Mạng nội bộ cho các container
networks:
  mlops_paas_network:
    name: mlops_paas_network
    driver: bridge

# Volume để lưu trữ dữ liệu của PostgreSQL và Redpanda
volumes:
  mlops_paas_pgdata:
    name: mlops_paas_pgdata
  redpanda_data:
    name: mlops_paas_redpanda_data
