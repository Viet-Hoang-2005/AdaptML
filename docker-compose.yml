version: '3.8'

services:
  # 1. PostgreSQL Database (mô phỏng CloudNativePG local)
  postgres:
    image: postgres:15-alpine
    container_name: mlops_nids_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - mlops_nids_pgdata:/var/lib/postgresql/data
    networks:
      - mlops_nids_network
    # Đợi PostgreSQL thực sự sẵn sàng nhận connection trước khi API start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. FastAPI Inference Server
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mlops_nids_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: 1
      MODEL_VERSION: ${MODEL_VERSION:-v1}
      # CloudNativePG local: cả RW và RO đều trỏ về cùng 1 container postgres
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./models:/models  # Mount thư mục models local vào container
      - ./api:/app
    command: uvicorn src.index:app --host 0.0.0.0 --port 5000 --reload
    depends_on:
      postgres:
        condition: service_healthy  # Đợi postgres healthy mới start API
    networks:
      - mlops_nids_network

  # 3. Evidently Drift Monitor
  evidently:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: mlops_nids_evidently
    # Không restart tự động - đây là job chạy 1 lần như CronJob trong K3s
    restart: "no"
    environment:
      # Chạy local: cả RO đều trỏ về postgres container
      DB_HOST_RO: postgres
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DRIFT_THRESHOLD: ${DRIFT_THRESHOLD:-0.5}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops_nids_network

  # 4. MLflow Tracking Server + Model Registry
  mlflow:
    image: python:3.10-slim
    container_name: mlops_nids_mlflow
    restart: always
    working_dir: /app
    ports:
      - "5001:5000"          # Host:5001 → Container:5000 (MLflow default port)
    volumes:
      - ./mlflow_artifacts:/app/mlflow_artifacts  # SQLite DB + artifact store
      - ./scripts:/app/scripts                    # mount script để đăng ký model nếu cần
    command: >
      bash -c "pip install --no-cache-dir mlflow>=2.10.0 boto3 joblib xgboost -q &&
               mlflow ui
               --backend-store-uri sqlite:///mlflow_artifacts/mlflow.db
               --artifacts-root mlflow_artifacts
               --host 0.0.0.0
               --port 5000
               --serve-models"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops_nids_network

# 5. Mạng nội bộ cho các container
networks:
  mlops_nids_network:
    driver: bridge

# 6. Volume để lưu trữ dữ liệu của PostgreSQL + MLflow artifacts
volumes:
  mlops_nids_pgdata:
    external: false
  mlflow_artifacts: