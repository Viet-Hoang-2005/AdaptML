version: '3.8'

services:
  # 1. PostgreSQL Database (mô phỏng CloudNativePG local)
  postgres:
    image: postgres:15-alpine
    container_name: mlops_nids_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - mlops_nids_pgdata:/var/lib/postgresql/data
    networks:
      - mlops_nids_network
    # Đợi PostgreSQL thực sự sẵn sàng nhận connection trước khi API start
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. FastAPI Inference Server
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mlops_nids_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: 1
      MODEL_VERSION: ${MODEL_VERSION:-v1}
      # CloudNativePG local: cả RW và RO đều trỏ về cùng 1 container postgres
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      REDPANDA_BROKERS: redpanda:9092
      EVIDENTLY_TRIGGER_THRESHOLD: ${EVIDENTLY_TRIGGER_THRESHOLD:-100}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./models:/models # Mount thư mục models local vào container
      - ./api:/app
    command: uvicorn src.index:app --host 0.0.0.0 --port 5000 --reload
    depends_on:
      postgres:
        condition: service_healthy # Đợi postgres healthy mới start API
      redpanda:
        condition: service_started
    networks:
      - mlops_nids_network

  # 3. Evidently Drift Monitor
  evidently:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: mlops_nids_evidently
    # Không restart tự động - đây là job chạy 1 lần như CronJob trong K3s
    restart: "no"
    environment:
      # Chạy local: cả RO đều trỏ về postgres container
      DB_HOST_RO: postgres
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DRIFT_THRESHOLD: ${DRIFT_THRESHOLD:-0.5}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops_nids_network

  # 5. NIDS Log Consumer (đứng giữa Redpanda và PostgreSQL)
  consumer:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mlops_nids_consumer
    restart: always
    environment:
      PYTHONUNBUFFERED: 1
      DB_HOST_RW: postgres
      DB_HOST_RO: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      REDPANDA_BROKERS: redpanda:9092
      EVIDENTLY_TRIGGER_THRESHOLD: ${EVIDENTLY_TRIGGER_THRESHOLD:-100}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./api:/app
    command: python src/consumer.py
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks:
      - mlops_nids_network

  # 6. Redpanda Kafka Broker
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: mlops_nids_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --mode dev-container
    ports:
      - "19092:19092"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - mlops_nids_network

  # 7. Redpanda Console (Kafka UI)
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: mlops_nids_redpanda_console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda
    networks:
      - mlops_nids_network

# 8. Mạng nội bộ cho các container
networks:
  mlops_nids_network:
    driver: bridge

# 5. Volume để lưu trữ dữ liệu của PostgreSQL và Redpanda
volumes:
  mlops_nids_pgdata:
    external: false
  redpanda_data:
