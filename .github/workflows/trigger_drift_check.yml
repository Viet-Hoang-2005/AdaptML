# trigger_drift_check.yml: GitHub Actions workflow kích hoạt kiểm tra Data drift bằng Evidently
name: MLOps NIDS - Manual Trigger Evidently AI Drift Check

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_drift_check]

permissions:
  id-token: write
  contents: read

jobs:
  run-drift-check:
    name: "Trigger Evidently AI Data Drift Check on K3s"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Setup Kubeconfig
        run: |
          KUBE_CONFIG="${SECRETS_KUBE_CONFIG:-}"
          if [ -z "$KUBE_CONFIG" ] || [ "$KUBE_CONFIG" = "None" ] || [ "$KUBE_CONFIG" = "null" ]; then
            echo "Missing required secret: KUBE_CONFIG"
            exit 1
          fi

          echo "::add-mask::$KUBE_CONFIG"
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Trigger K8s Data Drift Check Job
        run: |
          echo "Starting Evidently AI Data Drift Check..."
          echo "Triggered by: ${{ github.event.client_payload.trigger_source || github.event_name }}"
          echo "Current data count: ${{ github.event.client_payload.current_data_count || 'manual' }}"
          
          # Xóa Job cũ nếu có (bỏ qua lỗi nếu chưa tồn tại)
          kubectl delete job mlops-nids-evidently --ignore-not-found
          
          # Áp dụng file YAML để tạo Job mới
          kubectl apply -f k8s/evidently-job.yaml
          
          echo "Waiting for K8s Job to start and monitoring logs..."
          for attempt in $(seq 1 60); do
            SUCCEEDED="$(kubectl get job mlops-nids-evidently -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
            FAILED="$(kubectl get job mlops-nids-evidently -o jsonpath='{.status.failed}' 2>/dev/null || true)"

            if [ "$SUCCEEDED" = "1" ]; then
              echo "Evidently drift check job completed successfully."
              kubectl logs job/mlops-nids-evidently --all-containers=true --tail=300 || true
              kubectl get job mlops-nids-evidently
              exit 0
            fi

            if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
              echo "Evidently drift check job failed."
              kubectl logs job/mlops-nids-evidently --all-containers=true --tail=300 || true
              kubectl describe job mlops-nids-evidently
              kubectl get pods -l job-name=mlops-nids-evidently -o wide
              exit 1
            fi

            echo "Job still running; waiting 10s..."
            sleep 10
          done

          echo "Timed out waiting for Evidently drift check job."
          kubectl logs job/mlops-nids-evidently --all-containers=true --tail=300 || true
          kubectl describe job mlops-nids-evidently
          exit 1
