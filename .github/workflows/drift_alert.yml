# drift_alert.yml: GitHub Actions workflow để gửi cảnh báo khi phát hiện Data drift
name: MLOps PaaS - Drift Alert

on:
  repository_dispatch:
    types: [drift_alert_required]

permissions:
  id-token: write
  contents: read

jobs:
  notify_data_engineer:
    name: "Data Drift Alert"
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Build Alert Summary
        run: |
          echo "## Data Drift Alert" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Drift share: ${{ github.event.client_payload.drift_share }}" >> $GITHUB_STEP_SUMMARY
          echo "- Drifted features: ${{ github.event.client_payload.drifted_features }}" >> $GITHUB_STEP_SUMMARY
          echo "- Threshold: ${{ github.event.client_payload.threshold }}" >> $GITHUB_STEP_SUMMARY
          echo "- Feature names: ${{ toJson(github.event.client_payload.drifted_feature_names) }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Phase 1 is alert-only. Retraining must be started by updating data_manifest.json on S3." >> $GITHUB_STEP_SUMMARY

      - name: Send Slack Alert
        if: env.SECRETS_SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ env.SECRETS_SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "text": (
                  "MLOps PaaS drift alert\n"
                  f"- Drift share: ${{ github.event.client_payload.drift_share }}\n"
                  f"- Drifted features: ${{ github.event.client_payload.drifted_features }}\n"
                  f"- Threshold: ${{ github.event.client_payload.threshold }}\n"
                  "Retraining is disabled in Phase 1. Data Engineer must update data_manifest.json."
              )
          }

          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              print(f"Slack response: {response.status}")
          PY

      - name: Alert Channel Missing
        if: env.SECRETS_SLACK_WEBHOOK_URL == ''
        run: echo "SLACK_WEBHOOK_URL is not configured. Alert summary was recorded in GitHub Actions only."
