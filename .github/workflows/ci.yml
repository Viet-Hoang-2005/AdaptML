name: CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    name: "Detect Changed Components"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      control_plane: ${{ steps.filter.outputs.control_plane }}
      consumer: ${{ steps.filter.outputs.consumer }}
      packager: ${{ steps.filter.outputs.packager }}
      evidently: ${{ steps.filter.outputs.evidently }}
      infra: ${{ steps.filter.outputs.infra }}
      matrix_targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
            control_plane:
              - 'services/control-plane/**'
            consumer:
              - 'services/consumer/**'
            packager:
              - 'services/model-packager/**'
            evidently:
              - 'services/evidently/**'
            infra:
              - 'k8s/**'
              - '.github/**'

      - name: Generate Dynamic Matrix
        id: matrix
        run: |
          python3 -c '
          import os, json
          changed = {
              "frontend": "${{ steps.filter.outputs.frontend }}" == "true",
              "control_plane": "${{ steps.filter.outputs.control_plane }}" == "true",
              "consumer": "${{ steps.filter.outputs.consumer }}" == "true",
              "packager": "${{ steps.filter.outputs.packager }}" == "true",
              "evidently": "${{ steps.filter.outputs.evidently }}" == "true",
          }
          configs = {
              "frontend": {"name": "Frontend Web", "id": "frontend", "context": "web", "image": "mlops-paas-web"},
              "control_plane": {"name": "Control Plane", "id": "control_plane", "context": "services/control-plane", "image": "mlops-paas-control-plane"},
              "consumer": {"name": "Consumer Service", "id": "consumer", "context": "services/consumer", "image": "mlops-paas-consumer"},
              "packager": {"name": "Model Packager", "id": "packager", "context": "services/model-packager", "image": "mlops-paas-model-packager"},
              "evidently": {"name": "Evidently Drift", "id": "evidently", "context": "services/evidently", "image": "mlops-paas-evidently"}
          }
          targets = [configs[k] for k, v in changed.items() if v]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"targets={json.dumps(targets)}\n")
          '

  secret-scan:
    name: "Secret Scan (GitLeaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks Scan
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "**GitLeaks**: No secrets found." >> $GITHUB_STEP_SUMMARY
          else
            echo "**GitLeaks**: Secrets found! Please check logs." >> $GITHUB_STEP_SUMMARY
          fi

  lint-frontend:
    name: "Frontend Code Quality (ESLint)"
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install Dependencies
        working-directory: web
        run: npm ci
      - name: Run ESLint
        working-directory: web
        run: npm run lint
      - name: Report Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "**ESLint**: Passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "**ESLint**: Failed! Please fix frontend code." >> $GITHUB_STEP_SUMMARY
          fi

  lint-backend:
    name: "Backend Code Quality (Pylint)"
    needs: detect-changes
    if: needs.detect-changes.outputs.control_plane == 'true' || needs.detect-changes.outputs.consumer == 'true' || needs.detect-changes.outputs.packager == 'true' || needs.detect-changes.outputs.evidently == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install pylint
          for d in services/*/; do
            if [ -f "$d/requirements.txt" ]; then
              pip install -r "$d/requirements.txt" --quiet || true
            fi
          done
      - name: Run Pylint (Warnings Only)
        run: |
          find services -name "*.py" -not -path "*/migrations/*" -not -path "*/venv/*" > pyfiles.txt
          pylint $(cat pyfiles.txt) --output-format=text > pylint_report.txt || true
          cat pylint_report.txt
          score=$(grep -oP 'Your code has been rated at \K[0-9.]+/10' pylint_report.txt || echo "N/A")
          echo "**Pylint Score**: $score (Warnings Only)" >> $GITHUB_STEP_SUMMARY

  lint-infra:
    name: "Infrastructure Validation (Kustomize & Kubeconform)"
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Install Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate K8s Manifests
        run: |
          echo "Building Kustomize to check syntax..."
          kustomize build --enable-helm k8s/ > full_manifest.yaml
          echo "Validating structure with Kubeconform..."
          kubeconform -ignore-missing-schemas -summary full_manifest.yaml
      - name: Report Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "**Infra Validation**: Kustomize & Kubeconform passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Infra Validation**: Failed! Please check K8s YAML files." >> $GITHUB_STEP_SUMMARY
          fi

  build-and-scan:
    name: "Build & Scan (${{ matrix.target.name }})"
    needs: [detect-changes, lint-frontend, lint-backend, lint-infra, secret-scan]
    if: always() && needs.secret-scan.result == 'success' && needs.detect-changes.outputs.matrix_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.matrix_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          push: false
          tags: ${{ matrix.target.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.target.image }}:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Report Status
        run: |
          echo "**Trivy Scan (${{ matrix.target.name }})**: Passed without blocking vulnerabilities." >> $GITHUB_STEP_SUMMARY
