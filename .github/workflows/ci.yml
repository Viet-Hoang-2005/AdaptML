name: CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: "Detect Changed Components"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
      control_plane: ${{ steps.filter.outputs.control_plane == 'true' || github.event_name == 'workflow_dispatch' }}
      consumer: ${{ steps.filter.outputs.consumer == 'true' || github.event_name == 'workflow_dispatch' }}
      packager: ${{ steps.filter.outputs.packager == 'true' || github.event_name == 'workflow_dispatch' }}
      evidently: ${{ steps.filter.outputs.evidently == 'true' || github.event_name == 'workflow_dispatch' }}
      model_server: ${{ steps.filter.outputs.model_server == 'true' || github.event_name == 'workflow_dispatch' }}
      machine_learning_serving: ${{ steps.filter.outputs.machine_learning_serving == 'true' || github.event_name == 'workflow_dispatch' }}
      deep_learning_serving: ${{ steps.filter.outputs.deep_learning_serving == 'true' || github.event_name == 'workflow_dispatch' }}
      training_runner: ${{ steps.filter.outputs.training_runner == 'true' || github.event_name == 'workflow_dispatch' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event_name == 'workflow_dispatch' }}
      matrix_targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
            control_plane:
              - 'services/control-plane/**'
            consumer:
              - 'services/consumer/**'
            packager:
              - 'services/model-packager/**'
            evidently:
              - 'services/evidently/**'
            model_server:
              - 'services/model-server/**'
            machine_learning_serving:
              - 'services/machine-learning-serving/**'
            deep_learning_serving:
              - 'services/deep-learning-serving/**'
            training_runner:
              - 'services/training-runner/**'
            infra:
              - 'k8s/**'
              - '.github/**'

      - name: Generate Dynamic Matrix
        id: matrix
        run: |
          python3 -c '
          import os, json
          is_manual = "${{ github.event_name }}" == "workflow_dispatch"
          changed = {
              "frontend": "${{ steps.filter.outputs.frontend }}" == "true" or is_manual,
              "control_plane": "${{ steps.filter.outputs.control_plane }}" == "true" or is_manual,
              "consumer": "${{ steps.filter.outputs.consumer }}" == "true" or is_manual,
              "packager": "${{ steps.filter.outputs.packager }}" == "true" or is_manual,
              "evidently": "${{ steps.filter.outputs.evidently }}" == "true" or is_manual,
              "model_server": "${{ steps.filter.outputs.model_server }}" == "true" or is_manual,
              "machine_learning_serving": "${{ steps.filter.outputs.machine_learning_serving }}" == "true" or is_manual,
              "deep_learning_serving": "${{ steps.filter.outputs.deep_learning_serving }}" == "true" or is_manual,
              "training_runner": "${{ steps.filter.outputs.training_runner }}" == "true" or is_manual,
          }
          configs = {
              "frontend": {"name": "Frontend Web", "id": "frontend", "context": "web", "image": "mlops-paas-web"},
              "control_plane": {"name": "Control Plane", "id": "control_plane", "context": "services/control-plane", "image": "mlops-paas-control-plane"},
              "consumer": {"name": "Redpanda Consumer", "id": "consumer", "context": "services/consumer", "image": "mlops-paas-consumer"},
              "packager": {"name": "Model Packager", "id": "packager", "context": "services/model-packager", "image": "mlops-paas-model-packager"},
              "evidently": {"name": "Evidently Drift", "id": "evidently", "context": "services/evidently", "image": "mlops-paas-evidently"},
              "model_server": {"name": "Model Server", "id": "model_server", "context": "services/model-server", "image": "mlops-paas-model-server"},
              "machine_learning_serving": {"name": "Machine Learning Serving", "id": "machine_learning_serving", "context": "services/machine-learning-serving", "image": "mlops-paas-machine-learning-serving"},
              "deep_learning_serving": {"name": "Deep Learning Serving", "id": "deep_learning_serving", "context": "services/deep-learning-serving", "image": "mlops-paas-deep-learning-serving"},
              "training_runner": {"name": "Training Runner", "id": "training_runner", "context": "services/training-runner", "image": "mlops-paas-training-runner"}
          }
          targets = [configs[k] for k, v in changed.items() if v]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"targets={json.dumps(targets)}\n")
          '

  secret-scan:
    name: "Secret Scan (GitLeaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LOG_OPTS: ${{ github.event_name != 'pull_request' && '--max-count=1' || '' }}
  lint-frontend:
    name: "Frontend Code Quality (ESLint)"
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      errors: ${{ steps.eslint.outputs.errors }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies (pnpm)
        working-directory: web
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
      - name: Run ESLint
        id: eslint
        working-directory: web
        run: |
          pnpm run lint > eslint_out.txt 2>&1 || true
          cat eslint_out.txt
          err_count=$(grep -oP '\d+(?= errors?)' eslint_out.txt | tail -1 || true)
          if [ -z "$err_count" ]; then
            err_count="0"
          fi
          echo "errors=$err_count" >> $GITHUB_OUTPUT
          if [ "$err_count" != "0" ]; then
            echo "::error::ESLint found $err_count errors!"
            exit 1
          fi

  lint-backend:
    name: "Backend Code Quality (Pylint)"
    needs: detect-changes
    if: needs.detect-changes.outputs.control_plane == 'true' || needs.detect-changes.outputs.consumer == 'true' || needs.detect-changes.outputs.packager == 'true' || needs.detect-changes.outputs.evidently == 'true' || needs.detect-changes.outputs.model_server == 'true' || needs.detect-changes.outputs.machine_learning_serving == 'true' || needs.detect-changes.outputs.deep_learning_serving == 'true' || needs.detect-changes.outputs.training_runner == 'true'
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.pylint.outputs.score }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install pylint
          for d in services/*/; do
            if [ -f "$d/requirements.txt" ]; then
              pip install -r "$d/requirements.txt" --quiet || true
            fi
          done
      - name: Run Pylint (Warnings Only)
        id: pylint
        run: |
          find services -name "*.py" -not -path "*/migrations/*" -not -path "*/venv/*" > pyfiles.txt
          pylint $(cat pyfiles.txt) --output-format=text > pylint_report.txt || true
          cat pylint_report.txt
          score=$(grep -oP 'Your code has been rated at \K[0-9.]+/10' pylint_report.txt || echo "N/A")
          echo "score=$score" >> $GITHUB_OUTPUT
  
  frontend-build:
    name: "Frontend Typecheck and Build"
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: web
        run: pnpm run build

  control-plane-quality:
    name: "Control Plane Tests and Migration Gate"
    needs: detect-changes
    if: needs.detect-changes.outputs.control_plane == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/control-plane/requirements.txt
      - name: Install dependencies
        working-directory: services/control-plane
        run: pip install -r requirements.txt
      - name: Ruff
        working-directory: services/control-plane
        run: python -m ruff check .
      - name: Type check
        working-directory: services/control-plane
        run: python -m mypy src/apps src/common src/infrastructure
      - name: Django system check
        working-directory: services/control-plane
        run: python manage.py check --settings=config.settings.test
      - name: Migration drift check
        working-directory: services/control-plane
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Tests
        working-directory: services/control-plane
        run: python -m pytest

  lint-infra:
    name: "Infrastructure Validation (Kustomize & Kubeconform)"
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Install Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate K8s Manifests
        run: |
          echo "Building Kustomize to check syntax..."
          for i in 1 2 3; do
            kustomize build --enable-helm k8s/ > full_manifest.yaml && break || sleep 10
          done
          if [ ! -s full_manifest.yaml ]; then
            echo "::error::Kustomize build failed after 3 retries due to network timeouts!"
            exit 1
          fi
          echo "Validating structure with Kubeconform..."
          kubeconform -ignore-missing-schemas -summary full_manifest.yaml

  build-and-scan:
    name: "Build & Scan (${{ matrix.target.name }})"
    needs: [detect-changes, lint-frontend, lint-backend, control-plane-quality, frontend-build, lint-infra, secret-scan]
    if: always() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.matrix_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.matrix_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          push: false
          tags: ${{ matrix.target.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.target.image }}:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  ci-summary:
    name: "CI Pipeline Summary Table"
    needs: [detect-changes, secret-scan, lint-frontend, lint-backend, control-plane-quality, frontend-build, lint-infra, build-and-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unified CI Summary Table
        run: |
          python3 -c '
          import os

          fe_changed = "${{ needs.detect-changes.outputs.frontend }}" == "true"
          cp_changed = "${{ needs.detect-changes.outputs.control_plane }}" == "true"
          cs_changed = "${{ needs.detect-changes.outputs.consumer }}" == "true"
          pk_changed = "${{ needs.detect-changes.outputs.packager }}" == "true"
          ev_changed = "${{ needs.detect-changes.outputs.evidently }}" == "true"
          inf_changed = "${{ needs.detect-changes.outputs.infra }}" == "true"

          md_changed = "${{ needs.detect-changes.outputs.model_server }}" == "true"
          ml_serving_changed = "${{ needs.detect-changes.outputs.machine_learning_serving }}" == "true"
          dl_serving_changed = "${{ needs.detect-changes.outputs.deep_learning_serving }}" == "true"
          training_runner_changed = "${{ needs.detect-changes.outputs.training_runner }}" == "true"

          secret_res = "${{ needs.secret-scan.result }}" == "success"
          eslint_res = "${{ needs.lint-frontend.result }}" == "success"
          eslint_errs = "${{ needs.lint-frontend.outputs.errors }}"
          pylint_res = "${{ needs.lint-backend.result }}" in ["success", "skipped"]
          pylint_score = "${{ needs.lint-backend.outputs.score }}"
          trivy_res = "${{ needs.build-and-scan.result }}" == "success"
          infra_res = "${{ needs.lint-infra.result }}" == "success"

          fmt = lambda ok: "Passed" if ok else "Failed"
          err_str = eslint_errs if eslint_errs else "?"
          eslint_fmt = fmt(eslint_res) if eslint_res else f"Failed ({err_str} errors)"
          pylint_fmt = f"{pylint_score}" if pylint_score else fmt(pylint_res)

          summary = ["### Unified CI Pipeline Results\n"]
          summary.append(f"**Secret Security (GitLeaks)**: {fmt(secret_res)}\n")

          rows = []
          if fe_changed:
              rows.append(f"| **Frontend Web** | {eslint_fmt} (ESLint) | {fmt(trivy_res)} |")
          if cp_changed:
              rows.append(f"| **Control Plane** | {pylint_fmt} (Pylint) | {fmt(trivy_res)} |")
          if cs_changed:
              rows.append(f"| **Redpanda Consumer** | {pylint_fmt} (Pylint) | {fmt(trivy_res)} |")
          if pk_changed:
              rows.append(f"| **Model Packager** | {pylint_fmt} (Pylint) | {fmt(trivy_res)} |")
          if ev_changed:
              rows.append(f"| **Evidently Drift** | {pylint_fmt} (Pylint) | {fmt(trivy_res)} |")
          if md_changed:
              rows.append(f"| **Model Server** | {pylint_fmt} (Pylint) | {fmt(trivy_res)} |")
          if ml_serving_changed:
              rows.append(f"| **Machine Learning Serving** | {pylint_fmt} (Pylint) | {fmt(trivy_res)} |")
          if dl_serving_changed:
              rows.append(f"| **Deep Learning Serving** | {pylint_fmt} (Pylint) | {fmt(trivy_res)} |")
          if training_runner_changed:
              rows.append(f"| **Training Runner** | {pylint_fmt} (Pylint) | {fmt(trivy_res)} |")

          if rows:
              summary.append("#### Application Services (FE & BE)")
              summary.append("| Services | Lint | Trivy |")
              summary.append("| :--- | :--- | :--- |")
              summary.extend(rows)
              summary.append("\n")

          if inf_changed:
              summary.append("#### Kubernetes Infrastructure")
              summary.append("| Services | Validation Status |")
              summary.append("| :--- | :--- |")
              summary.append(f"| **K8s Manifests (Kustomize & Kubeconform)** | {fmt(infra_res)} |")
              summary.append("\n")

          if not rows and not inf_changed:
              summary.append("*No application or K8s components changed in this run.*")

          content = "\n".join(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(content + "\n")
          with open("pr_comment.md", "w") as f:
              f.write(content + "\n")
          '

      - name: Comment CI Summary on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          path: pr_comment.md
