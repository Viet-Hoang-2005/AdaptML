name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    name: "Detect Changed Components"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      control_plane: ${{ steps.filter.outputs.control_plane == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      consumer: ${{ steps.filter.outputs.consumer == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      packager: ${{ steps.filter.outputs.packager == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      evidently: ${{ steps.filter.outputs.evidently == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      mlflow: ${{ steps.filter.outputs.mlflow == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      model_server: ${{ steps.filter.outputs.model_server == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      machine_learning_serving: ${{ steps.filter.outputs.machine_learning_serving == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      deep_learning_serving: ${{ steps.filter.outputs.deep_learning_serving == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      training_runner: ${{ steps.filter.outputs.training_runner == 'true' || steps.filter.outputs.cd_workflow == 'true' || github.event_name == 'workflow_dispatch' }}
      matrix_targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
            control_plane:
              - 'services/control-plane/**'
            consumer:
              - 'services/consumer/**'
            packager:
              - 'services/model-packager/**'
            evidently:
              - 'services/evidently/**'
            mlflow:
              - 'services/mlflow/**'
            model_server:
              - 'services/model-server/**'
            machine_learning_serving:
              - 'services/machine-learning-serving/**'
            deep_learning_serving:
              - 'services/deep-learning-serving/**'
            training_runner:
              - 'services/training-runner/**'
            cd_workflow:
              - '.github/workflows/cd.yml'

      - name: Generate Dynamic Matrix
        id: matrix
        run: |
          python3 -c '
          import os, json
          is_manual = "${{ github.event_name }}" == "workflow_dispatch"
          is_cd_workflow_change = "${{ steps.filter.outputs.cd_workflow }}" == "true"
          changed = {
              "frontend": "${{ steps.filter.outputs.frontend }}" == "true" or is_cd_workflow_change or is_manual,
              "control_plane": "${{ steps.filter.outputs.control_plane }}" == "true" or is_cd_workflow_change or is_manual,
              "consumer": "${{ steps.filter.outputs.consumer }}" == "true" or is_cd_workflow_change or is_manual,
              "packager": "${{ steps.filter.outputs.packager }}" == "true" or is_cd_workflow_change or is_manual,
              "evidently": "${{ steps.filter.outputs.evidently }}" == "true" or is_cd_workflow_change or is_manual,
              "mlflow": "${{ steps.filter.outputs.mlflow }}" == "true" or is_cd_workflow_change or is_manual,
              "model_server": "${{ steps.filter.outputs.model_server }}" == "true" or is_cd_workflow_change or is_manual,
              "machine_learning_serving": "${{ steps.filter.outputs.machine_learning_serving }}" == "true" or is_cd_workflow_change or is_manual,
              "deep_learning_serving": "${{ steps.filter.outputs.deep_learning_serving }}" == "true" or is_cd_workflow_change or is_manual,
              "training_runner": "${{ steps.filter.outputs.training_runner }}" == "true" or is_cd_workflow_change or is_manual,
          }
          configs = {
              "frontend": {"name": "Frontend Web", "id": "frontend", "context": "web", "image": "mlops-paas-web"},
              "control_plane": {"name": "Control Plane", "id": "control_plane", "context": "services/control-plane", "image": "mlops-paas-control-plane"},
              "consumer": {"name": "Redpanda Consumer", "id": "consumer", "context": "services/consumer", "image": "mlops-paas-consumer"},
              "packager": {"name": "Model Packager", "id": "packager", "context": "services/model-packager", "image": "mlops-paas-model-packager"},
              "evidently": {"name": "Evidently Drift", "id": "evidently", "context": "services/evidently", "image": "mlops-paas-evidently"},
              "mlflow": {"name": "MLflow Tracking Server", "id": "mlflow", "context": "services/mlflow", "image": "mlops-paas-mlflow"},
              "model_server": {"name": "Model Server", "id": "model_server", "context": "services/model-server", "image": "mlops-paas-model-server"},
              "machine_learning_serving": {"name": "Machine Learning Serving", "id": "machine_learning_serving", "context": "services/machine-learning-serving", "image": "mlops-paas-machine-learning-serving"},
              "deep_learning_serving": {"name": "Deep Learning Serving", "id": "deep_learning_serving", "context": "services/deep-learning-serving", "image": "mlops-paas-deep-learning-serving"},
              "training_runner": {"name": "Training Runner", "id": "training_runner", "context": "services/training-runner", "image": "mlops-paas-training-runner"}
          }
          targets = [configs[k] for k, v in changed.items() if v]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"targets={json.dumps(targets)}\n")
          '

  build-and-push:
    name: "Build & Push (${{ matrix.target.name }})"
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix_targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.matrix_targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push qua ALB Ingress (registry domain - DNS Only)
      - name: Login to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: registry.mlops-nids-nt114.id.vn
          username: ${{ env.SECRETS_HARBOR_GITHUB_USERNAME }}
          password: ${{ env.SECRETS_HARBOR_GITHUB_PASSWORD }}

      - name: Build and Push Image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          push: true
          provenance: false
          tags: |
            registry.mlops-nids-nt114.id.vn/mlops-paas/${{ matrix.target.image }}:${{ github.sha }}
            registry.mlops-nids-nt114.id.vn/mlops-paas/${{ matrix.target.image }}:latest
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GITHUB_CLIENT_ID=${{ vars.VITE_GITHUB_CLIENT_ID }}
            VITE_GITHUB_REDIRECT_URI=${{ vars.VITE_GITHUB_REDIRECT_URI }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Sign the published Docker image
        env:
          COSIGN_PASSWORD: ${{ env.SECRETS_COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ env.SECRETS_COSIGN_PRIVATE_KEY }}
          REGISTRY_HOST: "registry.mlops-nids-nt114.id.vn"
          IMAGE: "${{ matrix.target.image }}"
          SHA: "${{ github.sha }}"
        run: |
          printf "%b\n" "${COSIGN_PRIVATE_KEY}" > cosign.key
          
          DIGEST="${{ steps.build-and-push.outputs.digest }}"
          cosign sign --yes --key cosign.key "${REGISTRY_HOST}/mlops-paas/${IMAGE}@${DIGEST}"
          
          rm -f cosign.key

  gitops-promotion:
    name: "GitOps: Update Kustomize & Create PR"
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.matrix_targets != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Image Tags in Kustomization & WorkflowTemplates
        run: |
          REG="registry.mlops-nids-nt114.id.vn/mlops-paas"
          SHA="${{ github.sha }}"
          
          # 1. Promote each independently reconciled workload.
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            (cd k8s/workloads/overlays/production/web && kustomize edit set image mlops-paas-web=$REG/mlops-paas-web:$SHA)
          fi
          
          if [ "${{ needs.detect-changes.outputs.control_plane }}" == "true" ]; then
            (cd k8s/workloads/overlays/production/control-plane && kustomize edit set image mlops-paas-control-plane=$REG/mlops-paas-control-plane:$SHA)
          fi
          
          if [ "${{ needs.detect-changes.outputs.consumer }}" == "true" ]; then
            (cd k8s/workloads/overlays/production/consumer && kustomize edit set image mlops-paas-consumer=$REG/mlops-paas-consumer:$SHA)
          fi

          if [ "${{ needs.detect-changes.outputs.model_server }}" == "true" ]; then
            (cd k8s/workloads/overlays/production/model-server && kustomize edit set image mlops-paas-model-server=$REG/mlops-paas-model-server:$SHA)
          fi
          
          if [ "${{ needs.detect-changes.outputs.mlflow }}" == "true" ]; then
            (cd k8s/platform/mlflow && kustomize edit set image mlops-paas-mlflow=$REG/mlops-paas-mlflow:$SHA)
          fi
          
          # 2. Update Argo Workflow Templates (packager and evidently)
          if [ "${{ needs.detect-changes.outputs.packager }}" == "true" ]; then
            yq e -i '(.spec.templates[] | select(.name == "prepare-package" or .name == "notify-success") | .container.image) = "'$REG'/mlops-paas-model-packager:'$SHA'"' k8s/execution/argo/build-workflowtemplate.yaml
          fi

          if [ "${{ needs.detect-changes.outputs.evidently }}" == "true" ]; then
            yq e -i '(.spec.templates[] | select(.name == "run-evidently") | .container.image) = "'$REG'/mlops-paas-evidently:'$SHA'"' k8s/execution/argo/evidently-workflowtemplate.yaml
          fi

          if [ "${{ needs.detect-changes.outputs.training_runner }}" == "true" ]; then
            yq e -i '(.spec.templates[] | select(.name == "cpu-pytorch-job") | .resource.manifest) |= sub("image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-training-runner:[^\\n]+", "image: '$REG'/mlops-paas-training-runner:'$SHA'")' k8s/execution/argo/training-workflowtemplate.yaml
            yq e -i '(.spec.templates[] | select(.name == "gpu-pytorch-job") | .resource.manifest) |= sub("image: registry.mlops-nids-nt114.id.vn/mlops-paas/mlops-paas-training-runner:[^\\n]+", "image: '$REG'/mlops-paas-training-runner:'$SHA'")' k8s/execution/argo/training-workflowtemplate.yaml
          fi

      - name: Generate Summary Table
        id: summary
        run: |
          SHA="${{ github.sha }}"
          REG="registry.mlops-nids-nt114.id.vn/mlops-paas"
          
          WEB_TAG="no change"
          DJANGO_TAG="no change"
          CONSUMER_TAG="no change"
          PACKAGER_TAG="no change"
          EVIDENTLY_TAG="no change"
          MLFLOW_TAG="no change"
          MODEL_SERVER_TAG="no change"
          MACHINE_LEARNING_SERVING_TAG="no change"
          DEEP_LEARNING_SERVING_TAG="no change"
          TRAINING_RUNNER_TAG="no change"
          
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            WEB_TAG="$REG/mlops-paas-web:$SHA"
          fi
          
          if [ "${{ needs.detect-changes.outputs.control_plane }}" == "true" ]; then
            DJANGO_TAG="$REG/mlops-paas-control-plane:$SHA"
          fi
          
          if [ "${{ needs.detect-changes.outputs.consumer }}" == "true" ]; then
            CONSUMER_TAG="$REG/mlops-paas-consumer:$SHA"
          fi
          
          if [ "${{ needs.detect-changes.outputs.packager }}" == "true" ]; then
            PACKAGER_TAG="$REG/mlops-paas-model-packager:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.evidently }}" == "true" ]; then
            EVIDENTLY_TAG="$REG/mlops-paas-evidently:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.mlflow }}" == "true" ]; then
            MLFLOW_TAG="$REG/mlops-paas-mlflow:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.model_server }}" == "true" ]; then
            MODEL_SERVER_TAG="$REG/mlops-paas-model-server:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.machine_learning_serving }}" == "true" ]; then
            MACHINE_LEARNING_SERVING_TAG="$REG/mlops-paas-machine-learning-serving:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.deep_learning_serving }}" == "true" ]; then
            DEEP_LEARNING_SERVING_TAG="$REG/mlops-paas-deep-learning-serving:$SHA"
          fi

          if [ "${{ needs.detect-changes.outputs.training_runner }}" == "true" ]; then
            TRAINING_RUNNER_TAG="$REG/mlops-paas-training-runner:$SHA"
          fi
          
          EOF_DELIM=$(openssl rand -hex 8)
          
          RAW_SUMMARY="### Production Promotion Summary
          | Service | Image Tag |
          | :--- | :--- |
          | **Frontend Web** (\`mlops-paas-web\`) | \`$WEB_TAG\` |
          | **Control Plane** (\`mlops-paas-control-plane\`) | \`$DJANGO_TAG\` |
          | **Redpanda Consumer** (\`mlops-paas-consumer\`) | \`$CONSUMER_TAG\` |
          | **Model Packager** (\`mlops-paas-model-packager\`) | \`$PACKAGER_TAG\` |
          | **Evidently Drift** (\`mlops-paas-evidently\`) | \`$EVIDENTLY_TAG\` |
          | **MLflow Tracking Server** (\`mlops-paas-mlflow\`) | \`$MLFLOW_TAG\` |
          | **Model Server** (\`mlops-paas-model-server\`) | \`$MODEL_SERVER_TAG\` |
          | **Machine Learning Serving** (\`mlops-paas-machine-learning-serving\`) | \`$MACHINE_LEARNING_SERVING_TAG\` |
          | **Deep Learning Serving** (\`mlops-paas-deep-learning-serving\`) | \`$DEEP_LEARNING_SERVING_TAG\` |
          | **Training Runner** (\`mlops-paas-training-runner\`) | \`$TRAINING_RUNNER_TAG\` |"
          
          SUMMARY_CONTENT=$(echo "$RAW_SUMMARY" | sed 's/^ *//')
          
          echo "$SUMMARY_CONTENT" >> $GITHUB_STEP_SUMMARY
          
          echo "pr_body<<$EOF_DELIM" >> $GITHUB_OUTPUT
          echo "$SUMMARY_CONTENT" >> $GITHUB_OUTPUT
          echo "$EOF_DELIM" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(gitops): update image tags to ${{ github.sha }} [skip ci]"
          title: "GitOps: Promote images to Production (${{ github.sha }}) [skip ci]"
          body: |
            This PR is automatically generated by CD pipeline.
            It promotes newly built Docker images to Kubernetes Production manifests.

            ${{ steps.summary.outputs.pr_body }}

            Merge this PR to trigger ArgoCD deployment.
          branch: "gitops-promote-${{ github.sha }}"
          base: "main"
