name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    name: "Detect Changed Components"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
            backend:
              - 'services/**'
            infra:
              - 'k8s/**'
              - '.github/**'

  build-and-push:
    name: "Build & Push Docker Images"
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.mlops-nids-nt114.id.vn
          username: ${{ env.SECRETS_HARBOR_USERNAME }}
          password: ${{ env.SECRETS_HARBOR_PASSWORD }}

      - name: Set Image Envs
        run: |
          REG="harbor.mlops-nids-nt114.id.vn/mlops-paas"
          echo "WEB_IMAGE=$REG/mlops-paas-web" >> $GITHUB_ENV
          echo "API_IMAGE=$REG/mlops-paas-django" >> $GITHUB_ENV
          echo "CONSUMER_IMAGE=$REG/mlops-paas-consumer" >> $GITHUB_ENV
          echo "PACKAGER_IMAGE=$REG/mlops-paas-model-packager" >> $GITHUB_ENV
          echo "EVIDENTLY_IMAGE=$REG/mlops-paas-evidently" >> $GITHUB_ENV

      - name: Build and push Web
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: web
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GITHUB_CLIENT_ID=${{ vars.VITE_GITHUB_CLIENT_ID }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Control Plane
        if: needs.detect-changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/control-plane
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Consumer
        if: needs.detect-changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/consumer
          push: true
          tags: |
            ${{ env.CONSUMER_IMAGE }}:${{ github.sha }}
            ${{ env.CONSUMER_IMAGE }}:latest

      - name: Build and push Packager
        if: needs.detect-changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/model-packager
          push: true
          tags: |
            ${{ env.PACKAGER_IMAGE }}:${{ github.sha }}
            ${{ env.PACKAGER_IMAGE }}:latest

      - name: Build and push Evidently
        if: needs.detect-changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/evidently
          push: true
          tags: |
            ${{ env.EVIDENTLY_IMAGE }}:${{ github.sha }}
            ${{ env.EVIDENTLY_IMAGE }}:latest

  gitops-promotion:
    name: "GitOps: Update Kustomize & Create PR"
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Image Tags in Kustomization & WorkflowTemplates
        run: |
          REG="harbor.mlops-nids-nt114.id.vn/mlops-paas"
          SHA="${{ github.sha }}"
          
          # 1. Update kustomization.yaml (cho web, django, consumer)
          cd k8s/apps/production
          
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            kustomize edit set image mlops-paas-web=$REG/mlops-paas-web:$SHA
          fi
          
          if [ "${{ needs.detect-changes.outputs.backend }}" == "true" ]; then
            kustomize edit set image mlops-paas-django=$REG/mlops-paas-django:$SHA
            kustomize edit set image mlops-paas-consumer=$REG/mlops-paas-consumer:$SHA
          fi
          cd ../../../
          
          # 2. Update Argo Workflow Templates (cho packager và evidently)
          if [ "${{ needs.detect-changes.outputs.backend }}" == "true" ]; then
            # Update build-workflowtemplate
            yq e -i '(.spec.templates[] | select(.name == "build-model") | .container.image) = "'$REG'/mlops-paas-model-packager:'$SHA'"' k8s/argo-workflows/build-workflowtemplate.yaml
            
            # Update evidently-workflowtemplate
            yq e -i '(.spec.templates[] | select(.name == "run-evidently") | .container.image) = "'$REG'/mlops-paas-evidently:'$SHA'"' k8s/argo-workflows/evidently-workflowtemplate.yaml
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(gitops): update image tags to ${{ github.sha }}"
          title: "GitOps: Promote images to Production (${{ github.sha }})"
          body: |
            This PR is automatically generated by CD pipeline.
            It updates the image tags in `kustomization.yaml` and Argo `WorkflowTemplates` to the newly built image version `${{ github.sha }}`.
            Merge this PR to trigger ArgoCD deployment.
          branch: "gitops-promote-${{ github.sha }}"
          base: "main"
