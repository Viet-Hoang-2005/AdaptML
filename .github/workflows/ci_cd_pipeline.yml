# ci_cd_pipeline.yml: GitHub Actions workflow để tự động hóa CI/CD cho MLOps NIDS System
name: MLOps NIDS - CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      # Chỉ trigger khi có thay đổi ở những folder quan trọng
      - 'api/**'
      - 'evidently/**'
      - 'mlflow/**'
      - '.github/scripts/**'
      - '.github/workflows/ci_cd_pipeline.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # JOB 0: Phát hiện thành phần nào có sự thay đổi code
  detect_changes:
    name: "Detect Changed Components"
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      evidently: ${{ steps.filter.outputs.evidently }}
      mlflow: ${{ steps.filter.outputs.mlflow }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            evidently:
              - 'evidently/**'
            mlflow:
              - 'mlflow/**'
            scripts:
              - '.github/scripts/**'
  # JOB 1: Kiểm tra Chất lượng Code (Code Quality Gate)
  lint_and_test:
    name: "Code Quality Check (Lint & Syntax)"
    needs: detect_changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install API dependencies
        run: pip install -r api/requirements.txt --quiet

      - name: Check for critical syntax errors (Flake8 Strict)
        # Chỉ chặn các lỗi nghiêm trọng: Syntax Error (E9), undefined name (F82),
        # undefined variable (F63, F7) - không chặn warning style như dòng quá dài
        run: |
          pip install flake8 --quiet
          echo "Checking syntax in api/src/..."
          flake8 api/src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "Checking syntax in evidently/..."
          flake8 evidently/ --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "No critical syntax errors detected."

      - name: Check valid imports for CI/CD scripts
        run: |
          pip install boto3 pandas sqlalchemy --quiet
          echo "Checking .github/scripts/update_reference_data.py..."
          python -c "import ast; ast.parse(open('.github/scripts/update_reference_data.py').read()); print('update_reference_data.py OK')"

  # JOB 2: Build & Push Docker Images lên Docker Hub
  build_and_push:
    name: "Build Docker Images (API + Evidently)"
    needs: [lint_and_test, detect_changes]
    runs-on: ubuntu-latest
    # Chỉ build khi push lên main - không build khi chỉ mở PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx (Multi-platform support)
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Set Image Envs
        run: |
          echo "API_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-api" >> $GITHUB_ENV
          echo "EVIDENTLY_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-evidently" >> $GITHUB_ENV
          echo "SYNC_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-sync-data" >> $GITHUB_ENV
          echo "DISPATCH_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-dispatch" >> $GITHUB_ENV
          echo "MLFLOW_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-mlflow" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.SECRETS_DOCKERHUB_USERNAME }}
          password: ${{ env.SECRETS_DOCKERHUB_TOKEN }}

      # Build Image 1: FastAPI Server
      - name: Build & Push Docker Image - FastAPI API Server
        if: needs.detect_changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          # Gắn 2 tag: sha ngắn (để rollback chính xác) và latest (để K3s luôn kéo bản mới)
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          # Dùng cache GitHub Actions để tăng tốc build lần sau
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Image 2: Evidently Drift Monitor
      - name: Build & Push Docker Image - Evidently Drift Monitor
        if: needs.detect_changes.outputs.evidently == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./evidently
          file: ./evidently/Dockerfile
          push: true
          tags: |
            ${{ env.EVIDENTLY_IMAGE }}:${{ github.sha }}
            ${{ env.EVIDENTLY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Image 3: Reference Data Sync
      - name: Build & Push Docker Image - Data Sync Script
        if: needs.detect_changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./.github/scripts
          file: ./.github/scripts/Dockerfile
          push: true
          tags: |
            ${{ env.SYNC_IMAGE }}:${{ github.sha }}
            ${{ env.SYNC_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Image 4: MLflow Dispatcher
      - name: Build & Push Docker Image - MLflow Dispatcher
        if: needs.detect_changes.outputs.mlflow == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./mlflow/mlflow-client
          file: ./mlflow/mlflow-client/Dockerfile
          push: true
          tags: |
            ${{ env.DISPATCH_IMAGE }}:${{ github.sha }}
            ${{ env.DISPATCH_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Image 5: MLflow Server (pre-installed dependencies)
      - name: Build & Push Docker Image - MLflow Server
        if: needs.detect_changes.outputs.mlflow == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./mlflow/mlflow-server
          file: ./mlflow/mlflow-server/Dockerfile
          push: true
          tags: |
            ${{ env.MLFLOW_IMAGE }}:${{ github.sha }}
            ${{ env.MLFLOW_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary of built images
        run: |
          echo "Images pushed to Docker Hub:"
          echo "   API:        ${{ env.API_IMAGE }}:${{ github.sha }}"
          echo "   Evidently:  ${{ env.EVIDENTLY_IMAGE }}:${{ github.sha }}"
          echo "   Sync Data:  ${{ env.SYNC_IMAGE }}:${{ github.sha }}"
          echo "   Dispatcher: ${{ env.DISPATCH_IMAGE }}:${{ github.sha }}"
          echo "   MLflow:     ${{ env.MLFLOW_IMAGE }}:${{ github.sha }}"

  # JOB 3: Cập nhật Image Tag trong Git (GitOps - ArgoCD sẽ tự động sync vào K3s)
  update_image_tag:
    name: "Update Image Tag in Git (GitOps)"
    needs: [build_and_push, detect_changes]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # Cần quyền này để push commit ngược lại repo
      id-token: write # Cần quyền này để tạo OIDC Token cho AWS

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch GitHub PAT from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            GITHUB_SECRETS, mlops/github-secrets
          parse-json-secrets: true

      - uses: actions/checkout@v4
        with:
          token: ${{ env.GITHUB_SECRETS_GITHUB_TOKEN }}

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Set Image Envs
        run: |
          echo "API_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-api" >> $GITHUB_ENV
          echo "DISPATCH_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-dispatch" >> $GITHUB_ENV
          echo "MLFLOW_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-mlflow" >> $GITHUB_ENV
          echo "EVIDENTLY_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-evidently" >> $GITHUB_ENV
          echo "SYNC_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-sync-data" >> $GITHUB_ENV

      - name: Install yq (YAML processor)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update API image tag in k8s/apps/api-deployment.yaml
        if: needs.detect_changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          NEW_TAG="${{ env.API_IMAGE }}:${{ github.sha }}"
          echo "Updating API image to: $NEW_TAG"
          yq e -i \
            '(.spec.template.spec.containers[] | select(.name == "fastapi-server") | .image) = "'"$NEW_TAG"'"' \
            k8s/apps/api-deployment.yaml

      - name: Update Consumer image tag in k8s/apps/consumer-deployment.yaml
        if: needs.detect_changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          NEW_TAG="${{ env.API_IMAGE }}:${{ github.sha }}"
          echo "Updating Consumer image to: $NEW_TAG"
          yq e -i \
            '(.spec.template.spec.containers[] | select(.name == "consumer") | .image) = "'"$NEW_TAG"'"' \
            k8s/apps/consumer-deployment.yaml

      - name: Update Dispatch CronJob image tag in k8s/apps/dispatch-cronjob.yaml
        if: needs.detect_changes.outputs.mlflow == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          NEW_TAG="${{ env.DISPATCH_IMAGE }}:${{ github.sha }}"
          echo "Updating Dispatcher image to: $NEW_TAG"
          yq e -i \
            '(.spec.jobTemplate.spec.template.spec.containers[] | select(.name == "dispatcher") | .image) = "'"$NEW_TAG"'"' \
            k8s/apps/dispatch-cronjob.yaml

      - name: Update MLflow Server image tag in k8s/apps/mlflow-deployment.yaml
        if: needs.detect_changes.outputs.mlflow == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          NEW_TAG="${{ env.MLFLOW_IMAGE }}:${{ github.sha }}"
          echo "Updating MLflow image to: $NEW_TAG"
          yq e -i \
            '(.spec.template.spec.containers[] | select(.name == "mlflow") | .image) = "'"$NEW_TAG"'"' \
            k8s/apps/mlflow-deployment.yaml

      - name: Update Evidently Job image tag in k8s/jobs/evidently-job.yaml
        if: needs.detect_changes.outputs.evidently == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          NEW_TAG="${{ env.EVIDENTLY_IMAGE }}:${{ github.sha }}"
          echo "Updating Evidently Job image to: $NEW_TAG"
          yq e -i \
            '(.spec.template.spec.containers[] | select(.name == "evidently-monitor") | .image) = "'"$NEW_TAG"'"' \
            k8s/jobs/evidently-job.yaml

      - name: Update Sync Data Job image tag in k8s/jobs/sync-data-job.yaml
        if: needs.detect_changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          NEW_TAG="${{ env.SYNC_IMAGE }}:${{ github.sha }}"
          echo "Updating Sync Data Job image to: $NEW_TAG"
          yq e -i \
            '(.spec.template.spec.containers[] | select(.name == "sync-data") | .image) = "'"$NEW_TAG"'"' \
            k8s/jobs/sync-data-job.yaml

      - name: Commit & Push updated image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/api-deployment.yaml k8s/apps/consumer-deployment.yaml k8s/apps/dispatch-cronjob.yaml k8s/apps/mlflow-deployment.yaml k8s/jobs/evidently-job.yaml k8s/jobs/sync-data-job.yaml
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "ci: Update image tags to ${{ github.sha }} [skip ci]"
          git push

      - name: Summary
        env:
          # Lấy kết quả từ job detect_changes
          API_CHANGED: ${{ needs.detect_changes.outputs.api }}
          DISPATCH_CHANGED: ${{ needs.detect_changes.outputs.mlflow }}
          MLFLOW_CHANGED: ${{ needs.detect_changes.outputs.mlflow }}
          EVIDENTLY_CHANGED: ${{ needs.detect_changes.outputs.evidently }}
          SYNC_CHANGED: ${{ needs.detect_changes.outputs.scripts }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # Hàm helper để kiểm tra và in ra trạng thái chuẩn xác
          get_display_tag() {
            local changed=$1
            local image_name=$2
            # Nếu code có đổi hoặc bấm chạy thủ công
            if [ "$changed" == "true" ] || [ "$IS_MANUAL" == "true" ]; then
              echo "\`${image_name}:${{ github.sha }}\` (Updated)"
            else
              echo "*(Skipped - Unchanged)*"
            fi
          }

          # Gọi hàm tính toán cho từng component
          API_DISP=$(get_display_tag "$API_CHANGED" "${{ env.API_IMAGE }}")
          DISPATCH_DISP=$(get_display_tag "$DISPATCH_CHANGED" "${{ env.DISPATCH_IMAGE }}")
          MLFLOW_DISP=$(get_display_tag "$MLFLOW_CHANGED" "${{ env.MLFLOW_IMAGE }}")
          EVIDENTLY_DISP=$(get_display_tag "$EVIDENTLY_CHANGED" "${{ env.EVIDENTLY_IMAGE }}")
          SYNC_DISP=$(get_display_tag "$SYNC_CHANGED" "${{ env.SYNC_IMAGE }}")

          # In ra bảng Markdown
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## GitOps Deployment Summary

          | Service | Docker Image (SHA Tag) |
          | :--- | :--- |
          | **API Server** | $API_DISP |
          | **Consumer** | $API_DISP |
          | **Dispatcher** | $DISPATCH_DISP |
          | **MLflow** | $MLFLOW_DISP |
          | **Evidently** | $EVIDENTLY_DISP |
          | **Data Sync** | $SYNC_DISP |
          EOF

