# ci_cd_pipeline.yml: GitHub Actions workflow để tự động hóa CI/CD cho MLOps NIDS System
name: MLOps NIDS - CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      # Chỉ trigger khi có thay đổi ở những folder quan trọng
      # Thay đổi docs (README, ARCHITECTURE...) KHÔNG kích hoạt build
      - 'api/**'
      - 'evidently/**'
      - 'k8s/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # JOB 1: Kiểm tra Chất lượng Code (Code Quality Gate)
  lint_and_test:
    name: "Code Quality Check (Lint & Syntax)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install API dependencies
        run: pip install -r api/requirements.txt --quiet

      - name: Check for critical syntax errors (Flake8 Strict)
        # Chỉ chặn các lỗi nghiêm trọng: Syntax Error (E9), undefined name (F82),
        # undefined variable (F63, F7) - không chặn warning style như dòng quá dài
        run: |
          pip install flake8 --quiet
          echo "Checking syntax in api/src/..."
          flake8 api/src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "Checking syntax in evidently/..."
          flake8 evidently/ --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "No critical syntax errors detected."

      - name: Check valid imports for CI/CD scripts
        run: |
          pip install boto3 pandas sqlalchemy --quiet
          echo "Checking .github/scripts/update_reference_data.py..."
          python -c "import ast; ast.parse(open('.github/scripts/update_reference_data.py').read()); print('update_reference_data.py OK')"

  # JOB 2: Build & Push Docker Images lên Docker Hub
  build_and_push:
    name: "Build Docker Images (API + Evidently)"
    needs: lint_and_test
    runs-on: ubuntu-latest
    # Chỉ build khi push lên main - không build khi chỉ mở PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx (Multi-platform support)
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Set Image Envs
        run: |
          echo "API_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-api" >> $GITHUB_ENV
          echo "MONITOR_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-evidently" >> $GITHUB_ENV
          echo "SYNC_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-sync-data" >> $GITHUB_ENV
          echo "DISPATCH_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-dispatch" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.SECRETS_DOCKERHUB_USERNAME }}
          password: ${{ env.SECRETS_DOCKERHUB_TOKEN }}

      # Build Image 1: FastAPI Server
      - name: Build & Push Docker Image - FastAPI API Server
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          # Gắn 2 tag: sha ngắn (để rollback chính xác) và latest (để K3s luôn kéo bản mới)
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          # Dùng cache GitHub Actions để tăng tốc build lần sau
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Image 2: Evidently Drift Monitor
      - name: Build & Push Docker Image - Evidently Drift Monitor
        uses: docker/build-push-action@v5
        with:
          context: ./evidently
          file: ./evidently/Dockerfile
          push: true
          tags: |
            ${{ env.MONITOR_IMAGE }}:${{ github.sha }}
            ${{ env.MONITOR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Image 3: Reference Data Sync
      - name: Build & Push Docker Image - Data Sync Script
        uses: docker/build-push-action@v5
        with:
          context: ./.github/scripts
          file: ./.github/scripts/Dockerfile
          push: true
          tags: |
            ${{ env.SYNC_IMAGE }}:${{ github.sha }}
            ${{ env.SYNC_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Image 4: MLflow Dispatcher
      - name: Build & Push Docker Image - MLflow Dispatcher
        uses: docker/build-push-action@v5
        with:
          context: ./mlflow
          file: ./mlflow/Dockerfile
          push: true
          tags: |
            ${{ env.DISPATCH_IMAGE }}:${{ github.sha }}
            ${{ env.DISPATCH_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary of built images
        run: |
          echo "Images pushed to Docker Hub:"
          echo "   API:        ${{ env.API_IMAGE }}:${{ github.sha }}"
          echo "   Monitor:    ${{ env.MONITOR_IMAGE }}:${{ github.sha }}"
          echo "   Sync Job:   ${{ env.SYNC_IMAGE }}:${{ github.sha }}"
          echo "   Dispatcher: ${{ env.DISPATCH_IMAGE }}:${{ github.sha }}"

  # JOB 3: Deploy lên K3s (chỉ chạy trên nhánh main)
  deploy_to_k3s:
    name: "Deploy to K3s (Rolling Update)"
    needs: build_and_push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Set Image Envs
        run: |
          echo "API_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-api" >> $GITHUB_ENV
          echo "DISPATCH_IMAGE=${{ env.SECRETS_DOCKERHUB_USERNAME }}/mlops-nids-dispatch" >> $GITHUB_ENV

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ env.SECRETS_KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify K3s Deployments Exist
        # Không dùng kubectl apply ở đây vì nó sẽ ghi đè biến môi trường MODEL_VERSION do MLflow cấu hình.
        # Hạ tầng YAML được apply thủ công 1 lần, GitHub Actions chỉ lo việc Update Source Code Image.
        run: |
          echo "Verifying core deployments exist in K3s..."
          kubectl get deployment mlops-nids-api
          kubectl get deployment mlops-nids-consumer
          echo "Core deployments found. Proceeding to update images..."

      - name: Update latest image tag for API Deployment
        # Ép Deployment dùng đúng image SHA vừa build - tránh K3s cache image cũ
        run: |
          kubectl set image deployment/mlops-nids-api \
            fastapi-server=${{ env.API_IMAGE }}:${{ github.sha }}
          echo "Updated image tag: ${{ github.sha }}"

      - name: Update latest image tag for Consumer
        run: |
          kubectl set image deployment/mlops-nids-consumer \
            consumer=${{ env.API_IMAGE }}:${{ github.sha }}
          echo "Updated Consumer image tag: ${{ github.sha }}"

      - name: Update latest image tag for Dispatch CronJob
        run: |
          kubectl set image cronjob/mlops-nids-dispatch \
            dispatcher=${{ env.DISPATCH_IMAGE }}:${{ github.sha }} || true
          echo "Updated Dispatcher image tag (if exists)."

      - name: Wait for Rolling Update to complete (Zero-Downtime)
        run: |
          echo "Waiting for API pods rolling update..."
          kubectl rollout status deployment/mlops-nids-api --timeout=300s
          echo "Rolling update completed successfully."

      - name: Verify pod status after deployment
        run: |
          echo "Status of all pods:"
          kubectl get pods -o wide
          echo ""
          echo "Logs of API pod (last 20 lines):"
          kubectl logs -l app=mlops-nids-api --tail=20 || true

      - name: Send deployment success notification
        if: success()
        run: |
          echo "CI/CD Deployment complete!"
          echo "Commit:  ${{ github.sha }}"
          echo "Author:  ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"
