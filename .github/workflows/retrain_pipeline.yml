# retrain_pipeline.yml: GitHub Actions workflow để tự động hóa pipeline retraining có kiểm soát
name: MLOps NIDS - Controlled Retraining Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [data_manifest_updated]

env:
  AWS_BUCKET_NAME: mlops-nids-artifacts
  S3_TRAINING_DATA_PREFIX: training-data/
  MLFLOW_MODEL_NAME: NIDS-XGBoost

permissions:
  id-token: write
  contents: read

jobs:
  trigger_sagemaker_training:
    name: Trigger SageMaker Training Job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Load Data Manifest from S3
        id: read_manifest
        run: |
          aws s3 cp s3://${{ env.AWS_BUCKET_NAME }}/data_manifest.json ./data_manifest.json

          MODEL_VERSION=$(jq -r '.model_version' data_manifest.json)
          TARGET_CSV=$(jq -r '.target_csv' data_manifest.json)

          echo "model_version=$MODEL_VERSION" >> $GITHUB_OUTPUT
          echo "target_csv=$TARGET_CSV" >> $GITHUB_OUTPUT

          echo "Loaded manifest:"
          echo "  target_csv=$TARGET_CSV"
          echo "  model_version=$MODEL_VERSION"

      - name: Trigger SageMaker Training Job
        env:
          AWS_SAGEMAKER_ROLE_ARN: ${{ vars.AWS_SAGEMAKER_ROLE_ARN }}
          MODEL_VERSION: ${{ steps.read_manifest.outputs.model_version }}
          TARGET_CSV: ${{ steps.read_manifest.outputs.target_csv }}
          AWS_BUCKET_NAME: ${{ env.AWS_BUCKET_NAME }}
          S3_TRAINING_DATA_PREFIX: ${{ env.S3_TRAINING_DATA_PREFIX }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
        run: |
          aws secretsmanager get-secret-value \
            --region "$AWS_DEFAULT_REGION" \
            --secret-id mlops/github-actions-secrets \
            --output json > /tmp/github-actions-secret-response.json

          read_secret() {
            python -c 'import json, sys; response=json.load(open("/tmp/github-actions-secret-response.json", encoding="utf-8-sig")); data=json.loads(response["SecretString"]); print(data.get(sys.argv[1], ""))' "$1"
          }

          echo "Available github-actions secret keys:"
          python -c 'import json; response=json.load(open("/tmp/github-actions-secret-response.json", encoding="utf-8-sig")); data=json.loads(response["SecretString"]); print("\n".join(sorted(data.keys())))'

          export MLFLOW_TRACKING_URI="$(read_secret MLFLOW_TRACKING_URI)"
          export MLFLOW_TRACKING_USERNAME="$(read_secret MLFLOW_TRACKING_USERNAME)"
          export MLFLOW_TRACKING_PASSWORD="$(read_secret MLFLOW_TRACKING_PASSWORD)"

          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "Missing required environment variable: MLFLOW_TRACKING_URI"
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_USERNAME" ] || [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "Missing required MLflow auth variables"
            exit 1
          fi

          pip install boto3 "sagemaker<3.0.0" --quiet
          python .github/scripts/trigger_sagemaker.py

          echo "SageMaker training job triggered successfully."
          echo "This workflow is fire-and-forget by design."
