name: MLOps NIDS - Retraining Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [data_drift_detected, data_manifest_updated]

jobs:
  # JOB 1: Đọc Data Manifest và kích hoạt Kaggle Retrain
  retrain_kaggle:
    name: "🧠 Retrain Model (Kaggle Compute)"
    runs-on: ubuntu-latest
    outputs:
      model_version: ${{ steps.read_manifest.outputs.model_version }}
      target_csv: ${{ steps.read_manifest.outputs.target_csv }}
      champion_version: ${{ steps.read_manifest.outputs.champion_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt AWS CLI & đọc Data Manifest từ S3
        id: read_manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-1
        run: |
          # Tải data_manifest.json từ S3 — "nguồn sự thật" về dataset cần train
          aws s3 cp s3://mlops-nids-artifacts/data_manifest.json ./data_manifest.json
          
          # Trích xuất thông tin và truyền sang các Job tiếp theo qua output
          MODEL_VERSION=$(jq -r '.model_version' data_manifest.json)
          TARGET_CSV=$(jq -r '.target_csv' data_manifest.json)
          # champion_version là version đang chạy trên Production (mặc định v1)
          CHAMPION_VERSION=$(jq -r '.champion_version // "v1"' data_manifest.json)
          
          echo "model_version=$MODEL_VERSION"     >> $GITHUB_OUTPUT
          echo "target_csv=$TARGET_CSV"           >> $GITHUB_OUTPUT
          echo "champion_version=$CHAMPION_VERSION" >> $GITHUB_OUTPUT
          
          echo "📋 Manifest đọc được:"
          echo "   Dataset: $TARGET_CSV"
          echo "   Model Version mới: $MODEL_VERSION"
          echo "   Champion hiện tại: $CHAMPION_VERSION"

      - name: Thiết lập Kaggle API và gửi Job Retrain
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          MODEL_VERSION: ${{ steps.read_manifest.outputs.model_version }}
          TARGET_CSV: ${{ steps.read_manifest.outputs.target_csv }}
        run: |
          pip install kaggle --quiet
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          echo "🚀 Gửi script train.py lên Kaggle Kernel..."
          # Cập nhật biến môi trường trong kernel-metadata.json trước khi push
          jq --arg csv "$TARGET_CSV" --arg ver "$MODEL_VERSION" \
            '.environment_variables.TARGET_CSV = $csv | .environment_variables.MODEL_VERSION = $ver' \
            kaggle_training/kernel-metadata.json > /tmp/meta.json && \
            mv /tmp/meta.json kaggle_training/kernel-metadata.json
          
          kaggle kernels push -p kaggle_training/
          
          echo "⏳ Đợi Kaggle hoàn thành huấn luyện (tối đa 60 phút)..."
          # Vòng lặp polling kiểm tra trạng thái Kaggle Kernel mỗi 2 phút
          # Kernel slug phải khớp với field "id" trong kernel-metadata.json
          KERNEL_SLUG="hongtrnnguynvit/mlops-nids-training-pipeline"
          for i in $(seq 1 30); do
            STATUS=$(kaggle kernels status $KERNEL_SLUG | grep -oP '"\K[^"]+(?=" status)')
            echo "   Lần $i — Trạng thái: $STATUS"
            if [ "$STATUS" = "complete" ]; then
              echo "✅ Kaggle Kernel hoàn thành!"
              break
            elif [ "$STATUS" = "error" ]; then
              echo "❌ Kaggle Kernel gặp lỗi!"
              exit 1
            fi
            sleep 120
          done

      - name: Tải Artifacts (model PKL + metrics JSON) từ Kaggle về
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-1
          MODEL_VERSION: ${{ steps.read_manifest.outputs.model_version }}
        run: |
          mkdir -p models/$MODEL_VERSION
          kaggle kernels output hongtrnnguynvit/mlops-nids-training-pipeline -p models/$MODEL_VERSION/
          echo "📦 Files tải về:"
          ls -la models/$MODEL_VERSION/
          
          # Upload model lên S3 để Init Container K3s có thể kéo về
          aws s3 sync models/$MODEL_VERSION/ s3://mlops-nids-artifacts/models/$MODEL_VERSION/
          echo "☁️  Đã upload model lên S3: s3://mlops-nids-artifacts/models/$MODEL_VERSION/"

      - name: Lưu metrics JSON lên Artifacts của GitHub Actions
        env:
          MODEL_VERSION: ${{ steps.read_manifest.outputs.model_version }}
        uses: actions/upload-artifact@v4
        with:
          name: challenger-metrics
          path: models/${{ steps.read_manifest.outputs.model_version }}/metrics_${{ steps.read_manifest.outputs.model_version }}.json
          retention-days: 7

  # JOB 2: Trọng tài chấm điểm — Cho phép hay chặn Deploy
  evaluate_model:
    name: "⚖️  Trọng tài Đánh giá (Model Evaluation Gate)"
    needs: retrain_kaggle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện cho evaluate_model script
        run: pip install --quiet boto3

      - name: Tải metrics Champion hiện tại từ S3
        # Champion metrics là file của model đang chạy trên Production.
        # Tải từ S3 thay vì đọc file trong repo để đảm bảo luôn là bản mới nhất
        # sau mỗi lần retrain thành công trước đó.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-1
          CHAMPION_VERSION: ${{ needs.retrain_kaggle.outputs.champion_version }}
        run: |
          # Đọc champion_version từ manifest để biết tải metrics của version nào
          aws s3 cp s3://mlops-nids-artifacts/data_manifest.json ./data_manifest.json
          CHAMPION_VERSION=$(jq -r '.champion_version // "v1"' data_manifest.json)
          echo "📊 Champion version hiện tại: $CHAMPION_VERSION"
          
          # Tải metrics của champion từ S3 (đây là nguồn ground truth mới nhất)
          aws s3 cp \
            s3://mlops-nids-artifacts/models/$CHAMPION_VERSION/metrics_${CHAMPION_VERSION}.json \
            /tmp/champion_metrics.json || \
          cp models/v1/metrics_v1.json /tmp/champion_metrics.json  # Fallback về v1 nếu S3 chưa có
          
          echo "📊 Champion metrics:"
          cat /tmp/champion_metrics.json

      - name: Tải metrics Challenger từ Artifacts
        uses: actions/download-artifact@v4
        with:
          name: challenger-metrics
          path: /tmp/challenger/

      - name: Chạy Kịch bản Đánh giá Tự động
        run: |
          CHALLENGER_FILE=$(ls /tmp/challenger/metrics_*.json | head -1)
          echo "🏆 Challenger metrics: $CHALLENGER_FILE"
          cat $CHALLENGER_FILE
          
          python .github/scripts/evaluate_model.py \
            --champion  /tmp/champion_metrics.json \
            --challenger $CHALLENGER_FILE \
            --min-f1 0.85 \
            --drift-tolerance 0.01

  # JOB 3: Triển khai Zero-Downtime lên K3s (chỉ khi đủ điều kiện)
  deploy_to_k3s:
    name: "🚀 Triển khai K3s (Zero-Downtime Rolling Update)"
    needs: [retrain_kaggle, evaluate_model]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Xác thực Kubeconfig K3s
        uses: azure/k8s-set-context@v2
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Cập nhật biến MODEL_VERSION trên cụm K3s
        env:
          MODEL_VERSION: ${{ needs.retrain_kaggle.outputs.model_version }}
        run: |
          # Ép K3s deployment dùng model version mới
          kubectl set env deployment/mlops-nids-api MODEL_VERSION=$MODEL_VERSION
          echo "🏷️  Đã cập nhật MODEL_VERSION=$MODEL_VERSION trên deployment"

      - name: Khởi động Rolling Update (Zero-Downtime)
        run: |
          echo "🔄 Bắt đầu Rolling Update — Pod cũ tắt dần, Pod mới Init Container kéo model từ S3..."
          kubectl rollout restart deployment/mlops-nids-api
          kubectl rollout status deployment/mlops-nids-api --timeout=300s

      - name: Xác nhận Pods đang chạy
        run: kubectl get pods -l app=mlops-nids-api

  # JOB 4: Đồng bộ Reference Data — Khép kín vòng lặp MLOps
  sync_reference_data:
    name: "🔄 Đồng bộ Reference Data bằng K8s Job"
    needs: [retrain_kaggle, deploy_to_k3s]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Xác thực Kubeconfig K3s
        uses: azure/k8s-set-context@v2
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Kích hoạt K8s Job đồng bộ Reference Data
        # Áp dụng Job trên Cụm K3s, chạy bảo mật nội bộ thay vì kết nối mở port 5432
        run: |
          echo "🔄 Bắt đầu đồng bộ Reference Data mới bên trong K3s cluster..."
          
          # Xoá Job cũ nếu còn sót (bỏ qua lỗi nếu chưa tồn tại)
          kubectl delete job reference-data-sync-job --ignore-not-found
          
          # Cập nhật Job để đảm bảo sử dụng image mới nhất trên dockerhub nếu có
          kubectl apply -f k8s/sync-job.yaml
          
          echo "⏳ Đợi K8s Job đồng bộ hoàn thành (timeout 300s)..."
          # Chờ đến khi Job báo condition=complete
          kubectl wait --for=condition=complete job/reference-data-sync-job --timeout=300s
          
          echo "📋 Logs của tiến trình đồng bộ:"
          kubectl logs job/reference-data-sync-job

      - name: Gửi thông báo Pipeline hoàn tất
        if: always()
        run: |
          echo "=============================================="
          echo "  ✅ MLOps NIDS Pipeline hoàn tất!"
          echo "  📌 Model mới: ${{ needs.retrain_kaggle.outputs.model_version }}"
          echo "  📌 Dataset:   ${{ needs.retrain_kaggle.outputs.target_csv }}"
          echo "  📌 Reference Data đã được cập nhật."
          echo "=============================================="
