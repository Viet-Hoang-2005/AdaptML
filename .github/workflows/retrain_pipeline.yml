# retrain_pipeline.yml: GitHub Actions workflow để tự động hóa pipeline retraining có kiểm soát
name: MLOps NIDS - Controlled Retraining Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [data_manifest_updated]

env:
  AWS_BUCKET_NAME: mlops-nids-artifacts
  S3_TRAINING_DATA_PREFIX: training-data/
  MLFLOW_MODEL_NAME: NIDS-XGBoost

permissions:
  id-token: write
  contents: read

jobs:
  trigger_kaggle_training:
    name: Trigger Kaggle Training Job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Load Data Manifest from S3
        id: read_manifest
        run: |
          aws s3 cp s3://${{ env.AWS_BUCKET_NAME }}/data_manifest.json ./data_manifest.json

          MODEL_VERSION=$(jq -r '.model_version' data_manifest.json)
          TARGET_CSV=$(jq -r '.target_csv' data_manifest.json)

          echo "model_version=$MODEL_VERSION" >> $GITHUB_OUTPUT
          echo "target_csv=$TARGET_CSV" >> $GITHUB_OUTPUT

          echo "Loaded manifest:"
          echo "  target_csv=$TARGET_CSV"
          echo "  model_version=$MODEL_VERSION"

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Push Kaggle Training Kernel
        env:
          MODEL_VERSION: ${{ steps.read_manifest.outputs.model_version }}
          TARGET_CSV: ${{ steps.read_manifest.outputs.target_csv }}
          AWS_BUCKET_NAME: ${{ env.AWS_BUCKET_NAME }}
          S3_TRAINING_DATA_PREFIX: ${{ env.S3_TRAINING_DATA_PREFIX }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
        run: |
          SECRETS_JSON=$(jq -rc 'if type == "string" then fromjson else . end' <<< "$SECRETS")

          KAGGLE_USERNAME=$(jq -r '.KAGGLE_USERNAME // empty' <<< "$SECRETS_JSON")
          KAGGLE_API_TOKEN=$(jq -r '.KAGGLE_API_TOKEN // empty' <<< "$SECRETS_JSON")
          MLFLOW_TRACKING_URI=$(jq -r '.MLFLOW_TRACKING_URI // empty' <<< "$SECRETS_JSON")
          MLFLOW_TRACKING_USERNAME=$(jq -r '.MLFLOW_TRACKING_USERNAME // empty' <<< "$SECRETS_JSON")
          MLFLOW_TRACKING_PASSWORD=$(jq -r '.MLFLOW_TRACKING_PASSWORD // empty' <<< "$SECRETS_JSON")

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Missing required environment variable: KAGGLE_API_TOKEN"
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "Missing required environment variable: MLFLOW_TRACKING_URI"
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_USERNAME" ] || [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "Missing required MLflow auth variables"
            exit 1
          fi

          pip install "kaggle>=1.8.0,<2.0.0" --quiet
          kaggle --version

          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

          echo "Testing Kaggle authentication before kernel push..."
          kaggle kernels list --mine --page-size 1 >/dev/null
          echo "Kaggle authentication succeeded."

          jq \
            --arg csv "$TARGET_CSV" \
            --arg ver "$MODEL_VERSION" \
            --arg bucket "$AWS_BUCKET_NAME" \
            --arg prefix "$S3_TRAINING_DATA_PREFIX" \
            --arg mlflow_uri "$MLFLOW_TRACKING_URI" \
            --arg model_name "$MLFLOW_MODEL_NAME" \
            --arg aws_key "$AWS_ACCESS_KEY_ID" \
            --arg aws_secret "$AWS_SECRET_ACCESS_KEY" \
            --arg aws_token "$AWS_SESSION_TOKEN" \
            --arg mlflow_user "$MLFLOW_TRACKING_USERNAME" \
            --arg mlflow_pass "$MLFLOW_TRACKING_PASSWORD" \
            '.environment_variables.TARGET_CSV = $csv
            | .environment_variables.MODEL_VERSION = $ver
            | .environment_variables.AWS_BUCKET_NAME = $bucket
            | .environment_variables.S3_TRAINING_DATA_PREFIX = $prefix
            | .environment_variables.MLFLOW_TRACKING_URI = $mlflow_uri
            | .environment_variables.MLFLOW_MODEL_NAME = $model_name
            | .environment_variables.AWS_ACCESS_KEY_ID = $aws_key
            | .environment_variables.AWS_SECRET_ACCESS_KEY = $aws_secret
            | .environment_variables.AWS_SESSION_TOKEN = $aws_token
            | .environment_variables.MLFLOW_TRACKING_USERNAME = $mlflow_user
            | .environment_variables.MLFLOW_TRACKING_PASSWORD = $mlflow_pass
            | .environment_variables.AWS_DEFAULT_REGION = "ap-southeast-1"' \
            kaggle/kernel-metadata.json > /tmp/kernel-metadata.json

          mv /tmp/kernel-metadata.json kaggle/kernel-metadata.json
          kaggle kernels push -p kaggle/

          echo "Kaggle training job triggered successfully."
          echo "This workflow is fire-and-forget by design."
