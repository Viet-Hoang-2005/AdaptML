# deploy_from_mlflow.yml: GitHub Actions workflow để triển khai model production từ MLflow
name: MLOps NIDS - Deploy Production Model from MLflow

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Business model version to deploy, e.g. v3"
        required: true
        type: string
      run_id:
        description: "MLflow Run ID containing the model artifacts"
        required: true
        type: string
      experiment_id:
        description: "MLflow Experiment ID"
        required: true
        type: string
  repository_dispatch:
    types: [mlflow_production_selected]

permissions:
  id-token: write
  contents: read

env:
  AWS_BUCKET_NAME: mlops-nids-artifacts
  AWS_DEFAULT_REGION: ap-southeast-1
  API_BASE_URL: https://api.mlops-nids-nt114.id.vn

jobs:
  deploy_to_k3s:
    name: "Deploy MLflow Production Model to K3s"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Model Version
        id: resolve_model_version
        run: |
          if [ -n "${{ github.event.client_payload.model_version }}" ]; then
            echo "model_version=${{ github.event.client_payload.model_version }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.client_payload.run_id }}" >> $GITHUB_OUTPUT
            echo "experiment_id=${{ github.event.client_payload.experiment_id }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.model_version }}" ]; then
            echo "model_version=${{ inputs.model_version }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ inputs.run_id }}" >> $GITHUB_OUTPUT
            echo "experiment_id=${{ inputs.experiment_id }}" >> $GITHUB_OUTPUT
          else
            echo "Missing model_version from repository_dispatch payload or workflow input."
            exit 1
          fi

      - name: Validate Deployment Inputs
        env:
          MODEL_VERSION: ${{ steps.resolve_model_version.outputs.model_version }}
          RUN_ID: ${{ steps.resolve_model_version.outputs.run_id }}
          EXPERIMENT_ID: ${{ steps.resolve_model_version.outputs.experiment_id }}
        run: |
          for key in MODEL_VERSION RUN_ID EXPERIMENT_ID; do
            value="${!key}"
            if [ -z "$value" ] || [ "$value" = "None" ] || [ "$value" = "null" ]; then
              echo "Missing required deployment input: $key"
              exit 1
            fi
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Setup Kubeconfig
        run: |
          KUBE_CONFIG="${SECRETS_KUBE_CONFIG:-}"
          if [ -z "$KUBE_CONFIG" ] || [ "$KUBE_CONFIG" = "None" ] || [ "$KUBE_CONFIG" = "null" ]; then
            echo "Missing required secret: KUBE_CONFIG"
            exit 1
          fi

          echo "::add-mask::$KUBE_CONFIG"
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify MLflow Artifacts in S3
        env:
          MODEL_VERSION: ${{ steps.resolve_model_version.outputs.model_version }}
          RUN_ID: ${{ steps.resolve_model_version.outputs.run_id }}
          EXPERIMENT_ID: ${{ steps.resolve_model_version.outputs.experiment_id }}
        run: |
          MODEL_ARTIFACT="s3://${AWS_BUCKET_NAME}/mlflow-artifacts/${EXPERIMENT_ID}/${RUN_ID}/artifacts/deployment_exports/xgb_nids_model_${MODEL_VERSION}.pkl"
          LABEL_ARTIFACT="s3://${AWS_BUCKET_NAME}/mlflow-artifacts/${EXPERIMENT_ID}/${RUN_ID}/artifacts/deployment_exports/label_classes_${MODEL_VERSION}.json"

          echo "Verifying model artifact: $MODEL_ARTIFACT"
          aws s3 ls "$MODEL_ARTIFACT"

          echo "Verifying label artifact: $LABEL_ARTIFACT"
          aws s3 ls "$LABEL_ARTIFACT"

      - name: Update API Deployment Model Version
        env:
          MODEL_VERSION: ${{ steps.resolve_model_version.outputs.model_version }}
          RUN_ID: ${{ steps.resolve_model_version.outputs.run_id }}
          EXPERIMENT_ID: ${{ steps.resolve_model_version.outputs.experiment_id }}
        run: |
          kubectl get deployment mlops-nids-api
          kubectl set env deployment/mlops-nids-api \
            --containers='*' \
            MODEL_VERSION="$MODEL_VERSION" \
            RUN_ID="$RUN_ID" \
            EXPERIMENT_ID="$EXPERIMENT_ID"

          kubectl patch deployment mlops-nids-api --type='json' -p="[
            {\"op\":\"replace\",\"path\":\"/spec/template/spec/initContainers/0/env/0/value\",\"value\":\"${MODEL_VERSION}\"},
            {\"op\":\"replace\",\"path\":\"/spec/template/spec/initContainers/0/env/1/value\",\"value\":\"${EXPERIMENT_ID}\"},
            {\"op\":\"replace\",\"path\":\"/spec/template/spec/initContainers/0/env/2/value\",\"value\":\"${RUN_ID}\"}
          ]"

          kubectl rollout restart deployment/mlops-nids-api
          kubectl rollout status deployment/mlops-nids-api --timeout=300s

      - name: Verify API Health
        env:
          MODEL_VERSION: ${{ steps.resolve_model_version.outputs.model_version }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "$API_BASE_URL/" > /tmp/api-health.json; then
              cat /tmp/api-health.json
              python -c 'import json, os; data=json.load(open("/tmp/api-health.json")); expected=os.environ["MODEL_VERSION"]; actual=data.get("model_version"); assert actual == expected, f"Expected model_version={expected}, got {actual}"'
              exit 0
            fi
            echo "API health check failed; retrying in 10s..."
            sleep 10
          done

          echo "API health check did not pass after retries."
          exit 1

      - name: Trigger Reference Data Sync Job
        run: |
          echo "Triggering Reference Data Sync Job to update Baseline Data for drift detection..."
          kubectl delete job mlops-nids-sync-data --ignore-not-found
          kubectl apply -f k8s/sync-data-job.yaml
          echo "Reference Data Sync Job started."

      - name: Verify Running System
        run: |
          kubectl get pods -l app=mlops-nids-api
          kubectl logs -l app=mlops-nids-api -c aws-s3-model-sync --tail=80 || true
          kubectl logs -l app=mlops-nids-api -c fastapi-server --tail=80 || true
          kubectl get jobs
