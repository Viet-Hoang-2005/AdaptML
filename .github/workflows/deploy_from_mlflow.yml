# deploy_from_mlflow.yml: GitHub Actions workflow để triển khai model production từ MLflow
name: MLOps NIDS - Deploy Production Model from MLflow

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Business model version to deploy, e.g. v3"
        required: true
        type: string
      run_id:
        description: "MLflow Run ID containing the model artifacts"
        required: true
        type: string
      experiment_id:
        description: "MLflow Experiment ID"
        required: true
        type: string
  repository_dispatch:
    types: [mlflow_production_selected]

permissions:
  id-token: write
  contents: write # Cần để commit ngược Model Version vào Git cho ArgoCD sync

env:
  AWS_BUCKET_NAME: mlops-nids-artifacts
  AWS_DEFAULT_REGION: ap-southeast-1
  API_BASE_URL: https://api.mlops-nids-nt114.id.vn

jobs:
  deploy_to_k3s:
    name: "Deploy MLflow Production Model to K3s (GitOps)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Model Version
        id: resolve_model_version
        run: |
          if [ -n "${{ github.event.client_payload.model_version }}" ]; then
            echo "model_version=${{ github.event.client_payload.model_version }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.client_payload.run_id }}" >> $GITHUB_OUTPUT
            echo "experiment_id=${{ github.event.client_payload.experiment_id }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.model_version }}" ]; then
            echo "model_version=${{ inputs.model_version }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ inputs.run_id }}" >> $GITHUB_OUTPUT
            echo "experiment_id=${{ inputs.experiment_id }}" >> $GITHUB_OUTPUT
          else
            echo "Missing model_version from repository_dispatch payload or workflow input."
            exit 1
          fi

      - name: Validate Deployment Inputs
        env:
          MODEL_VERSION: ${{ steps.resolve_model_version.outputs.model_version }}
          RUN_ID: ${{ steps.resolve_model_version.outputs.run_id }}
          EXPERIMENT_ID: ${{ steps.resolve_model_version.outputs.experiment_id }}
        run: |
          for key in MODEL_VERSION RUN_ID EXPERIMENT_ID; do
            value="${!key}"
            if [ -z "$value" ] || [ "$value" = "None" ] || [ "$value" = "null" ]; then
              echo "Missing required deployment input: $key"
              exit 1
            fi
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fetch Secrets from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SECRETS, mlops/github-actions-secrets
          parse-json-secrets: true

      - name: Verify MLflow Artifacts in S3
        env:
          MODEL_VERSION: ${{ steps.resolve_model_version.outputs.model_version }}
          RUN_ID: ${{ steps.resolve_model_version.outputs.run_id }}
          EXPERIMENT_ID: ${{ steps.resolve_model_version.outputs.experiment_id }}
        run: |
          MODEL_ARTIFACT="s3://${AWS_BUCKET_NAME}/mlflow-artifacts/${EXPERIMENT_ID}/${RUN_ID}/artifacts/deployment_exports/xgb_nids_model_${MODEL_VERSION}.pkl"
          LABEL_ARTIFACT="s3://${AWS_BUCKET_NAME}/mlflow-artifacts/${EXPERIMENT_ID}/${RUN_ID}/artifacts/deployment_exports/label_classes_${MODEL_VERSION}.json"

          echo "Verifying model artifact: $MODEL_ARTIFACT"
          aws s3 ls "$MODEL_ARTIFACT"

          echo "Verifying label artifact: $LABEL_ARTIFACT"
          aws s3 ls "$LABEL_ARTIFACT"

      - name: Install yq (YAML processor)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update MODEL_VERSION, RUN_ID, EXPERIMENT_ID in k8s/apps/api-deployment.yaml
        env:
          MODEL_VERSION: ${{ steps.resolve_model_version.outputs.model_version }}
          RUN_ID: ${{ steps.resolve_model_version.outputs.run_id }}
          EXPERIMENT_ID: ${{ steps.resolve_model_version.outputs.experiment_id }}
        run: |
          echo "Updating api-deployment.yaml with:"
          echo "  MODEL_VERSION=$MODEL_VERSION"
          echo "  RUN_ID=$RUN_ID"
          echo "  EXPERIMENT_ID=$EXPERIMENT_ID"

          # Cập nhật Init Container envs (aws-s3-model-sync)
          yq e -i \
            '(.spec.template.spec.initContainers[] | select(.name == "aws-s3-model-sync") | .env[] | select(.name == "MODEL_VERSION") | .value) = "'"$MODEL_VERSION"'"' \
            k8s/apps/api-deployment.yaml
          yq e -i \
            '(.spec.template.spec.initContainers[] | select(.name == "aws-s3-model-sync") | .env[] | select(.name == "EXPERIMENT_ID") | .value) = "'"$EXPERIMENT_ID"'"' \
            k8s/apps/api-deployment.yaml
          yq e -i \
            '(.spec.template.spec.initContainers[] | select(.name == "aws-s3-model-sync") | .env[] | select(.name == "RUN_ID") | .value) = "'"$RUN_ID"'"' \
            k8s/apps/api-deployment.yaml

          # Cập nhật App Container envs (fastapi-server)
          yq e -i \
            '(.spec.template.spec.containers[] | select(.name == "fastapi-server") | .env[] | select(.name == "MODEL_VERSION") | .value) = "'"$MODEL_VERSION"'"' \
            k8s/apps/api-deployment.yaml
          yq e -i \
            '(.spec.template.spec.containers[] | select(.name == "fastapi-server") | .env[] | select(.name == "EXPERIMENT_ID") | .value) = "'"$EXPERIMENT_ID"'"' \
            k8s/apps/api-deployment.yaml
          yq e -i \
            '(.spec.template.spec.containers[] | select(.name == "fastapi-server") | .env[] | select(.name == "RUN_ID") | .value) = "'"$RUN_ID"'"' \
            k8s/apps/api-deployment.yaml

      - name: Commit & Push updated Model Version
        env:
          MODEL_VERSION: ${{ steps.resolve_model_version.outputs.model_version }}
          RUN_ID: ${{ steps.resolve_model_version.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/api-deployment.yaml
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "feat(model): Deploy $MODEL_VERSION (run: $RUN_ID) [skip ci]"
          git push

      - name: Summary
        env:
          MODEL_VERSION: ${{ steps.resolve_model_version.outputs.model_version }}
          RUN_ID: ${{ steps.resolve_model_version.outputs.run_id }}
          EXPERIMENT_ID: ${{ steps.resolve_model_version.outputs.experiment_id }}
        run: |
          echo "## MLflow Model Deployment Triggered (GitOps)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Model Version | \`$MODEL_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MLflow Run ID | \`$RUN_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Experiment ID | \`$EXPERIMENT_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD will auto-sync the new model version to K3s within ~3 minutes." >> $GITHUB_STEP_SUMMARY
          echo "Monitor at: https://argocd.mlops-nids-nt114.id.vn" >> $GITHUB_STEP_SUMMARY
