---
- name: Transfer Argo CD control resources between parent Applications
  hosts: master
  become: true
  gather_facts: false
  vars:
    gitops_previous_application_name: platform-operators
    gitops_application_name: mlops-paas-system
  tasks:
    - name: Read the source parent Application
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ gitops_previous_application_name }}"
        namespace: argocd
        kubeconfig: "{{ k3s_remote_kubeconfig }}"
      register: gitops_source_parent

    - name: Require a stable source parent with tracked resources
      ansible.builtin.assert:
        that:
          - gitops_source_parent.resources | length == 1
          - gitops_source_parent.resources[0].status.resources | default([]) | length > 0
          - gitops_source_parent.resources[0].operation is not defined
        fail_msg: >-
          The source parent must exist, have a reconciled resource inventory,
          and have no operation in progress.

    - name: Disable automated sync and pruning on the source parent
      kubernetes.core.k8s:
        state: patched
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ gitops_previous_application_name }}"
        namespace: argocd
        kubeconfig: "{{ k3s_remote_kubeconfig }}"
        merge_type: merge
        definition:
          spec:
            syncPolicy:
              automated: null

    - name: Confirm the source parent is manual
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ gitops_previous_application_name }}"
        namespace: argocd
        kubeconfig: "{{ k3s_remote_kubeconfig }}"
      register: gitops_source_parent_manual
      until:
        - gitops_source_parent_manual.resources | length == 1
        - gitops_source_parent_manual.resources[0].spec.syncPolicy.automated is not defined
      retries: 12
      delay: 5
      changed_when: false

    - name: Transfer each control resource tracking label to the root
      ansible.builtin.include_tasks: tasks/transfer_gitops_resource_tracking.yml
      loop: "{{ gitops_source_parent.resources[0].status.resources }}"
      loop_control:
        loop_var: gitops_resource_identity
        label: >-
          {{ gitops_resource_identity.kind }}/{{
            gitops_resource_identity.namespace | default('cluster')
          }}/{{ gitops_resource_identity.name }}
