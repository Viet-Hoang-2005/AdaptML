---
- name: Adopt production resources into Argo CD child Applications
  hosts: master
  become: true
  gather_facts: false
  vars:
    gitops_previous_application_name: mlops-paas-system
  tasks:
    - name: Normalize the requested child Application names
      ansible.builtin.set_fact:
        gitops_adopt_applications_normalized: >-
          {{
            gitops_adopt_applications.split(',')
            if gitops_adopt_applications is string
            else gitops_adopt_applications
          }}
      when: gitops_adopt_applications is defined

    - name: Require an explicit list of child Applications
      ansible.builtin.assert:
        that:
          - gitops_adopt_applications_normalized is defined
          - gitops_adopt_applications_normalized is sequence
          - gitops_adopt_applications_normalized is not string
          - gitops_adopt_applications_normalized | length > 0
          - gitops_adopt_applications_normalized | reject('equalto', '') | list | length == gitops_adopt_applications_normalized | length
        fail_msg: >-
          Pass gitops_adopt_applications as a non-empty list. Adoption never
          enables automated sync or pruning.

    - name: Adopt each child Application in the requested order
      ansible.builtin.include_tasks: tasks/sync_gitops_application.yml
      loop: "{{ gitops_adopt_applications_normalized }}"
      loop_control:
        loop_var: gitops_application_name
