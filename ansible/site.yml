---
- name: Setup common utilities and OS preparation on all nodes
  hosts: all
  gather_facts: true
  roles:
    - common

- name: Setup K3s Server (Master) and Helm
  hosts: master
  gather_facts: true
  roles:
    - k3s_master
    - helm

- name: Join Worker nodes to K3s cluster
  hosts: workers
  gather_facts: true
  roles:
    - k3s_worker

- name: Deploy Kubernetes Add-ons (Storage, Secrets, Scaling, ArgoCD, Workflows, Monitoring)
  hosts: master
  gather_facts: true
  roles:
    - k8s_addons
