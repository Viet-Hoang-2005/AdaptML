---
- name: "Read live resource before tracking handoff"
  kubernetes.core.k8s_info:
    api_version: >-
      {{
        gitops_resource_identity.group ~ '/' ~ gitops_resource_identity.version
        if gitops_resource_identity.group | default('') | length > 0
        else gitops_resource_identity.version
      }}
    kind: "{{ gitops_resource_identity.kind }}"
    name: "{{ gitops_resource_identity.name }}"
    namespace: "{{ gitops_resource_identity.namespace | default(omit, true) }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: gitops_live_resource_before_tracking_handoff
  no_log: true

- name: "Require live resource to exist before tracking handoff"
  ansible.builtin.assert:
    that:
      - gitops_live_resource_before_tracking_handoff.resources | length == 1
    fail_msg: >-
      Refusing to adopt missing resource {{ gitops_resource_identity.kind }}/{{
        gitops_resource_identity.namespace | default('cluster')
      }}/{{ gitops_resource_identity.name }}.

- name: "Read current Argo CD tracking owner"
  ansible.builtin.set_fact:
    gitops_resource_tracking_owner: >-
      {{
        gitops_live_resource_before_tracking_handoff.resources[0]
        .metadata.labels['argocd.argoproj.io/instance'] | default('')
      }}
  no_log: true

- name: "Reject tracking owned by an unrelated Application"
  ansible.builtin.assert:
    that:
      - gitops_resource_tracking_owner in ['', gitops_previous_application_name, gitops_application_name]
    fail_msg: >-
      Refusing to transfer {{ gitops_resource_identity.kind }}/{{
        gitops_resource_identity.namespace | default('cluster')
      }}/{{ gitops_resource_identity.name }} from unrelated Argo CD Application
      {{ gitops_resource_tracking_owner }}.

- name: "Set child Application tracking label"
  kubernetes.core.k8s:
    state: patched
    api_version: >-
      {{
        gitops_resource_identity.group ~ '/' ~ gitops_resource_identity.version
        if gitops_resource_identity.group | default('') | length > 0
        else gitops_resource_identity.version
      }}
    kind: "{{ gitops_resource_identity.kind }}"
    name: "{{ gitops_resource_identity.name }}"
    namespace: "{{ gitops_resource_identity.namespace | default(omit, true) }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    definition:
      metadata:
        labels:
          argocd.argoproj.io/instance: "{{ gitops_application_name }}"
  when: gitops_resource_tracking_owner != gitops_application_name
  no_log: true

- name: "Verify child Application tracking label"
  kubernetes.core.k8s_info:
    api_version: >-
      {{
        gitops_resource_identity.group ~ '/' ~ gitops_resource_identity.version
        if gitops_resource_identity.group | default('') | length > 0
        else gitops_resource_identity.version
      }}
    kind: "{{ gitops_resource_identity.kind }}"
    name: "{{ gitops_resource_identity.name }}"
    namespace: "{{ gitops_resource_identity.namespace | default(omit, true) }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: gitops_live_resource_after_tracking_handoff
  until:
    - gitops_live_resource_after_tracking_handoff.resources | length == 1
    - >-
      gitops_live_resource_after_tracking_handoff.resources[0]
      .metadata.labels['argocd.argoproj.io/instance'] | default('')
      == gitops_application_name
  retries: 6
  delay: 2
  changed_when: false
  no_log: true
