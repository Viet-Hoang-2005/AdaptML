---
- name: "Read {{ gitops_application_name }} before adoption"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ gitops_application_name }}"
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: gitops_application_before_adoption

- name: "Require {{ gitops_application_name }} to be a manual child Application"
  ansible.builtin.assert:
    that:
      - gitops_application_before_adoption.resources | length == 1
      - gitops_application_before_adoption.resources[0].spec.syncPolicy.automated is not defined
    fail_msg: >-
      Argo CD Application {{ gitops_application_name }} must exist and remain
      manual during ownership adoption.

- name: "Synchronize {{ gitops_application_name }} without pruning"
  kubernetes.core.k8s:
    state: patched
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ gitops_application_name }}"
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    definition:
      operation:
        sync:
          prune: false
          syncOptions:
            - ServerSideApply=true
            - RespectIgnoreDifferences=true
            - ApplyOutOfSyncOnly=true
            - FailOnSharedResource=true

- name: "Wait for {{ gitops_application_name }} adoption"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ gitops_application_name }}"
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: adopted_gitops_application
  until:
    - adopted_gitops_application.resources | length == 1
    - adopted_gitops_application.resources[0].status.sync.status | default('') == 'Synced'
    - adopted_gitops_application.resources[0].status.health.status | default('') == 'Healthy'
    - adopted_gitops_application.resources[0].operation is not defined
  failed_when: >-
    adopted_gitops_application.resources | length == 1 and
    adopted_gitops_application.resources[0].status.operationState.phase | default('')
    in ['Error', 'Failed']
  retries: 90
  delay: 10
  changed_when: false

