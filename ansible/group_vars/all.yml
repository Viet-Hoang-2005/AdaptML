---
domain_name: "mlops-nids-nt114.id.vn"
aws_region: "ap-southeast-1"
k3s_version: "v1.34.9+k3s1"
helm_version: "v3.17.3"
k3s_etcd_snapshot_schedule: "0 */6 * * *"
k3s_etcd_snapshot_retention: 12
k3s_expected_worker_count: 2
traefik_request_timeout: "600s"
traefik_forwarded_headers_trusted_ips:
  # K3s ServiceLB uses externalTrafficPolicy=Cluster, so Traefik sees the
  # Flannel gateway of the worker selected by the ALB rather than the ALB IP.
  - "10.42.1.0/32"
  - "10.42.2.0/32"

# Rollout phases are deliberately independent. This production rollout enables
# the training infrastructure, but the tenant-facing feature stays disabled.
bootstrap_k3s_cluster: true
deploy_core_platform: true
deploy_training_platform: true
enable_karpenter: true

# Core and training operators are child Applications of the unified production root.
# Ansible owns only Argo CD bootstrap
core_operator_application_names:
  - platform-aws-ebs-csi
  - platform-external-secrets
  - platform-cloudnative-pg
  - platform-keda
  - platform-argo-workflows
  - platform-argo-events
  - platform-monitoring
core_operator_workloads:
  - {namespace: kube-system, release: aws-ebs-csi-driver}
  - {namespace: external-secrets, release: external-secrets}
  - {namespace: cnpg-system, release: cloudnative-pg}
  - {namespace: keda, release: keda}
  - {namespace: argo, release: argo-workflows}
  - {namespace: argo-events, release: argo-events}
  - {namespace: monitoring, release: monitoring}
core_operator_crds:
  - externalsecrets.external-secrets.io
  - clusters.postgresql.cnpg.io
  - scaledobjects.keda.sh
  - workflows.argoproj.io
  - eventsources.argoproj.io
  - prometheuses.monitoring.coreos.com
platform_operator_application_names:
  - platform-kubeflow-training
  - platform-karpenter-crds
  - platform-karpenter
  - platform-karpenter-capacity
  - platform-node-feature-discovery
  - platform-gpu-operator

# Ansible publishes only the runtime K3s token value. Terraform owns the
# secret container and Argo CD owns all Karpenter Kubernetes resources.
karpenter_k3s_token_secret_name: "mlops/k3s-agent-token"

# The smoke jobs use a pinned public CUDA image. They never receive tenant
# credentials, application Secrets, or run in the tenant workload namespace.
training_smoke_namespace: "ansible-training-smoke"
training_smoke_timeout_seconds: 1200
training_smoke_node_cleanup_timeout_seconds: 900
training_smoke_image: "nvidia/cuda@sha256:001469ea0f3dec85a1ca929aeea3b58ae369d4c11228b10aec1f642bb6ca7a6f"
# GPU smoke remains opt-in until the AWS G/VT quota request is approved and
# effective. The CPU smoke test remains part of every training verification.
training_gpu_smoke_enabled: false

argocd_chart_version: "7.8.23"

ansible_artifacts_directory: "{{ playbook_dir }}/artifacts"
k3s_local_kubeconfig: "{{ ansible_artifacts_directory }}/kubeconfig"
k3s_remote_kubeconfig: "/etc/rancher/k3s/k3s.yaml"
