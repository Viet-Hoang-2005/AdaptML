---
- name: Resynchronize existing Argo CD Applications without pruning
  hosts: master
  become: true
  gather_facts: false
  tasks:
    - name: Normalize the requested Application names
      ansible.builtin.set_fact:
        gitops_resync_applications_normalized: >-
          {{
            gitops_resync_applications.split(',')
            if gitops_resync_applications is string
            else gitops_resync_applications
          }}
      when: gitops_resync_applications is defined

    - name: Require an explicit list of Applications
      ansible.builtin.assert:
        that:
          - gitops_resync_applications_normalized is defined
          - gitops_resync_applications_normalized is sequence
          - gitops_resync_applications_normalized is not string
          - gitops_resync_applications_normalized | length > 0
        fail_msg: >-
          Pass gitops_resync_applications as a non-empty list or CSV string.
          Resynchronization never enables pruning.

    - name: Resynchronize each Application in the requested order
      ansible.builtin.include_tasks: tasks/sync_operator_application.yml
      loop: "{{ gitops_resync_applications_normalized }}"
      loop_control:
        loop_var: operator_application_name
