---
- name: Require the Terraform Karpenter outputs
  ansible.builtin.assert:
    that:
      - terraform_karpenter_node_instance_profile_name | default('') | length > 0
      - terraform_karpenter_interruption_queue_name | default('') | length > 0
      - terraform_karpenter_controller_policy_arn | default('') | length > 0
    fail_msg: Enable and apply the Terraform Karpenter stack before this phase.
  no_log: true
  when: enable_karpenter | bool

- name: Resolve the private K3s API endpoint for elastic nodes
  ansible.builtin.set_fact:
    k3s_cluster_endpoint: >-
      https://{{ hostvars[groups['master'][0]].private_ip }}:6443
  when: enable_karpenter | bool

- name: Read the K3s agent token for elastic nodes
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: karpenter_k3s_node_token_b64
  no_log: true
  check_mode: false
  when:
    - enable_karpenter | bool
    - k3s_node_token_override | trim | length == 0

- name: Resolve the effective K3s node token
  ansible.builtin.set_fact:
    effective_k3s_node_token: >-
      {{ k3s_node_token_override | trim
         if k3s_node_token_override | trim
         else karpenter_k3s_node_token_b64.content | b64decode | trim }}
  no_log: true
  when: enable_karpenter | bool

- name: Require the K3s agent token for elastic nodes
  ansible.builtin.assert:
    that:
      - effective_k3s_node_token | length > 0
    fail_msg: The K3s agent token is required before Karpenter can launch nodes.
  no_log: true
  when: enable_karpenter | bool

- name: Store the K3s agent token from the WSL control host
  delegate_to: localhost
  become: false
  community.aws.secretsmanager_secret:
    name: "{{ karpenter_k3s_token_secret_name }}"
    description: K3s agent token for self-managed Karpenter nodes
    state: present
    secret_type: string
    json_secret:
      token: "{{ effective_k3s_node_token }}"
    overwrite: true
    region: "{{ aws_region }}"
  no_log: true
  when: enable_karpenter | bool

- name: Require Argo CD to reconcile every training operator application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item }}"
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: reconciled_platform_operator_application
  until:
    - reconciled_platform_operator_application.resources | length == 1
    - reconciled_platform_operator_application.resources[0].status.sync.status | default('') == 'Synced'
    - reconciled_platform_operator_application.resources[0].status.health.status | default('') == 'Healthy'
  retries: 60
  delay: 10
  changed_when: false
  loop: "{{ platform_operator_application_names }}"

- name: Inject cluster-specific Karpenter controller settings outside Git
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: karpenter
    namespace: karpenter
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    definition:
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: CLUSTER_NAME
                    value: "{{ karpenter_cluster_name }}"
                  - name: CLUSTER_ENDPOINT
                    value: "{{ k3s_cluster_endpoint }}"
                  - name: INTERRUPTION_QUEUE
                    value: "{{ karpenter_interruption_queue_name }}"
  no_log: true
  when:
    - enable_karpenter | bool

- name: Wait for Karpenter after injecting runtime controller settings
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: karpenter
    namespace: karpenter
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    wait_timeout: 300
  when:
    - enable_karpenter | bool

- name: Render the cluster-specific Karpenter NodePools and EC2NodeClasses
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/karpenter-nodepool.yaml.j2"
    dest: /var/lib/rancher/k3s/server/manifests/karpenter-nodepool.yaml
    owner: root
    group: root
    mode: "0600"
  become: true
  when:
    - enable_karpenter | bool
    - manage_karpenter_nodepools_with_ansible | bool

- name: Remove the rendered Karpenter manifest when elastic capacity is disabled
  become: true
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests/karpenter-nodepool.yaml
    state: absent
  when: not enable_karpenter | bool

- name: Wait for the CPU EC2NodeClass to become ready
  kubernetes.core.k8s_info:
    api_version: karpenter.k8s.aws/v1
    kind: EC2NodeClass
    name: training-cpu
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Ready
      status: "True"
  when:
    - enable_karpenter | bool
    - manage_karpenter_nodepools_with_ansible | bool

- name: Wait for the CPU NodePool to become ready
  kubernetes.core.k8s_info:
    api_version: karpenter.sh/v1
    kind: NodePool
    name: mlops-paas-training-cpu
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Ready
      status: "True"
  when:
    - enable_karpenter | bool
    - manage_karpenter_nodepools_with_ansible | bool

- name: Wait for the GPU EC2NodeClass and NodePool to become ready
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Ready
      status: "True"
  loop:
    - api_version: karpenter.k8s.aws/v1
      kind: EC2NodeClass
      name: training-gpu
    - api_version: karpenter.sh/v1
      kind: NodePool
      name: mlops-paas-training-gpu
  when:
    - enable_karpenter | bool
    - enable_gpu_nodepool | bool
    - manage_karpenter_nodepools_with_ansible | bool
