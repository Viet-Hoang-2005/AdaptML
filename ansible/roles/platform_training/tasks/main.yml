---
- name: Require the Terraform Karpenter outputs
  ansible.builtin.assert:
    that:
      - terraform_karpenter_node_instance_profile_name | default('') | length > 0
      - terraform_karpenter_interruption_queue_name | default('') | length > 0
      - terraform_karpenter_controller_policy_arn | default('') | length > 0
    fail_msg: Enable and apply the Terraform Karpenter stack before this phase.
  no_log: true
  when: enable_karpenter | bool

- name: Resolve the private K3s API endpoint for elastic nodes
  ansible.builtin.set_fact:
    k3s_cluster_endpoint: >-
      https://{{ hostvars[groups['master'][0]].private_ip }}:6443
  when: enable_karpenter | bool

- name: Read the K3s agent token for elastic nodes
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: karpenter_k3s_node_token_b64
  no_log: true
  check_mode: false
  when:
    - enable_karpenter | bool
    - k3s_node_token_override | trim | length == 0

- name: Resolve the effective K3s node token
  ansible.builtin.set_fact:
    effective_k3s_node_token: >-
      {{ k3s_node_token_override | trim
         if k3s_node_token_override | trim
         else karpenter_k3s_node_token_b64.content | b64decode | trim }}
  no_log: true
  when: enable_karpenter | bool

- name: Require the K3s agent token for elastic nodes
  ansible.builtin.assert:
    that:
      - effective_k3s_node_token | length > 0
    fail_msg: The K3s agent token is required before Karpenter can launch nodes.
  no_log: true
  when: enable_karpenter | bool

- name: Render the pinned Kubeflow Training Operator CRDs
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    kustomize {{ kubeflow_training_operator_crds_kustomize_path }}?ref={{ kubeflow_training_operator_version }}
  register: kubeflow_operator_crds_render
  changed_when: false
  when: training_operators_owner == 'ansible'

- name: Validate the Kubeflow Training Operator CRDs against the live API server
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    apply --server-side --dry-run=server
    -k {{ kubeflow_training_operator_crds_kustomize_path }}?ref={{ kubeflow_training_operator_version }}
  changed_when: false
  when: training_operators_owner == 'ansible'

- name: Install the pinned Kubeflow Training Operator CRDs
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    apply --server-side
    -k {{ kubeflow_training_operator_crds_kustomize_path }}?ref={{ kubeflow_training_operator_version }}
  register: kubeflow_operator_crds_apply
  changed_when: >-
    'configured' in kubeflow_operator_crds_apply.stdout or
    'created' in kubeflow_operator_crds_apply.stdout
  when: training_operators_owner == 'ansible'

- name: Wait for the PyTorchJob CRD to be established
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    wait crd/pytorchjobs.kubeflow.org --for=condition=Established --timeout=300s
  changed_when: false
  when: training_operators_owner == 'ansible'

- name: Ensure the Kubeflow Training Operator namespace exists
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: Namespace
    name: kubeflow
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  when: training_operators_owner == 'ansible'

- name: Render the pinned Kubeflow Training Operator controller manifests
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    kustomize {{ kubeflow_training_operator_kustomize_path }}?ref={{ kubeflow_training_operator_version }}
  register: kubeflow_operator_controller_render
  changed_when: false
  when: training_operators_owner == 'ansible'

- name: Validate the Kubeflow Training Operator controller against the live API server
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    apply --server-side --dry-run=server
    -k {{ kubeflow_training_operator_kustomize_path }}?ref={{ kubeflow_training_operator_version }}
  changed_when: false
  when: training_operators_owner == 'ansible'

- name: Install the pinned Kubeflow Training Operator controller
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    apply --server-side
    -k {{ kubeflow_training_operator_kustomize_path }}?ref={{ kubeflow_training_operator_version }}
  register: kubeflow_operator_controller_apply
  changed_when: >-
    'configured' in kubeflow_operator_controller_apply.stdout or
    'created' in kubeflow_operator_controller_apply.stdout
  when: training_operators_owner == 'ansible'

- name: Pin the Kubeflow Training Operator to static workers
  kubernetes.core.k8s:
    state: patched
    kind: Deployment
    api_version: apps/v1
    name: training-operator
    namespace: kubeflow
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    definition:
      spec:
        template:
          spec:
            nodeSelector:
              workload-type: worker
  when: training_operators_owner == 'ansible'

- name: Wait for the Kubeflow Training Operator
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    -n kubeflow rollout status deployment/training-operator --timeout=300s
  changed_when: false
  when: training_operators_owner == 'ansible'

- name: Store the K3s agent token from the WSL control host
  delegate_to: localhost
  become: false
  community.aws.secretsmanager_secret:
    name: "{{ karpenter_k3s_token_secret_name }}"
    description: K3s agent token for self-managed Karpenter nodes
    state: present
    secret_type: string
    json_secret:
      token: "{{ effective_k3s_node_token }}"
    overwrite: true
    region: "{{ aws_region }}"
  no_log: true
  when: enable_karpenter | bool

- name: Install Karpenter CRDs
  kubernetes.core.helm:
    name: karpenter-crd
    chart_ref: oci://public.ecr.aws/karpenter/karpenter-crd
    chart_version: "{{ karpenter_version }}"
    release_namespace: karpenter
    create_namespace: true
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    timeout: 10m0s
  when:
    - enable_karpenter | bool
    - training_operators_owner == 'ansible'

- name: Install Karpenter controller on static workers
  kubernetes.core.helm:
    name: karpenter
    chart_ref: oci://public.ecr.aws/karpenter/karpenter
    chart_version: "{{ karpenter_version }}"
    release_namespace: karpenter
    create_namespace: true
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    timeout: 10m0s
    release_values:
      replicas: 1
      nodeSelector:
        workload-type: worker
      settings:
        clusterName: "{{ karpenter_cluster_name }}"
        clusterEndpoint: "{{ k3s_cluster_endpoint }}"
        interruptionQueue: "{{ karpenter_interruption_queue_name }}"
  when:
    - enable_karpenter | bool
    - training_operators_owner == 'ansible'

- name: Configure the NVIDIA Helm repository
  kubernetes.core.helm_repository:
    name: nvidia
    repo_url: https://helm.ngc.nvidia.com/nvidia
  when:
    - enable_gpu_nodepool | bool
    - training_operators_owner == 'ansible'

- name: Install Node Feature Discovery only on elastic training nodes
  kubernetes.core.helm:
    name: nfd
    chart_ref: oci://registry.k8s.io/nfd/charts/node-feature-discovery
    chart_version: "{{ nfd_chart_version }}"
    release_namespace: gpu-operator
    create_namespace: true
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    timeout: 10m0s
    release_values:
      master:
        nodeSelector:
          workload-type: worker
      worker:
        nodeSelector:
          workload-type: training
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule
      gc:
        nodeSelector:
          workload-type: worker
  when:
    - enable_gpu_nodepool | bool
    - training_operators_owner == 'ansible'

- name: Require Argo CD to reconcile every training operator application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item }}"
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: reconciled_platform_operator_application
  until:
    - reconciled_platform_operator_application.resources | length == 1
    - reconciled_platform_operator_application.resources[0].status.sync.status | default('') == 'Synced'
    - reconciled_platform_operator_application.resources[0].status.health.status | default('') == 'Healthy'
  retries: 60
  delay: 10
  changed_when: false
  loop: "{{ platform_operator_application_names }}"
  when: training_operators_owner == 'argocd'

- name: Inject cluster-specific Karpenter controller settings outside Git
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: karpenter
    namespace: karpenter
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    definition:
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: CLUSTER_NAME
                    value: "{{ karpenter_cluster_name }}"
                  - name: CLUSTER_ENDPOINT
                    value: "{{ k3s_cluster_endpoint }}"
                  - name: INTERRUPTION_QUEUE
                    value: "{{ karpenter_interruption_queue_name }}"
  no_log: true
  when:
    - training_operators_owner == 'argocd'
    - enable_karpenter | bool

- name: Wait for Karpenter after injecting runtime controller settings
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    -n karpenter rollout status deployment/karpenter --timeout=300s
  changed_when: false
  when:
    - training_operators_owner == 'argocd'
    - enable_karpenter | bool

- name: Install NVIDIA GPU Operator for elastic training nodes
  kubernetes.core.helm:
    name: gpu-operator
    chart_ref: gpu-operator
    chart_repo_url: https://helm.ngc.nvidia.com/nvidia
    chart_version: "{{ nvidia_gpu_operator_chart_version }}"
    release_namespace: gpu-operator
    create_namespace: true
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
    wait: true
    timeout: 15m0s
    release_values:
      nfd:
        enabled: false
      daemonsets:
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule
      operator:
        nodeSelector:
          workload-type: worker
      driver:
        enabled: true
      toolkit:
        enabled: true
        env:
          - name: CONTAINERD_CONFIG
            value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
          - name: CONTAINERD_SOCKET
            value: /run/k3s/containerd/containerd.sock
          - name: CONTAINERD_RUNTIME_CLASS
            value: nvidia
          - name: CONTAINERD_SET_AS_DEFAULT
            value: "true"
  when:
    - enable_gpu_nodepool | bool
    - training_operators_owner == 'ansible'

- name: Render the cluster-specific Karpenter NodePools and EC2NodeClasses
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/karpenter-nodepool.yaml.j2"
    dest: /var/lib/rancher/k3s/server/manifests/karpenter-nodepool.yaml
    owner: root
    group: root
    mode: "0600"
  become: true
  when:
    - enable_karpenter | bool
    - manage_karpenter_nodepools_with_ansible | bool

- name: Remove the rendered Karpenter manifest when elastic capacity is disabled
  become: true
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests/karpenter-nodepool.yaml
    state: absent
  when: not enable_karpenter | bool

- name: Wait for the CPU EC2NodeClass to become ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    wait ec2nodeclass/training-cpu --for=condition=Ready --timeout=300s
  register: training_cpu_nodeclass_ready
  retries: 30
  delay: 10
  until: training_cpu_nodeclass_ready.rc == 0
  changed_when: false
  when:
    - enable_karpenter | bool
    - manage_karpenter_nodepools_with_ansible | bool

- name: Wait for the CPU NodePool to become ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    wait nodepool/mlops-paas-training-cpu --for=condition=Ready --timeout=300s
  register: training_cpu_nodepool_ready
  retries: 30
  delay: 10
  until: training_cpu_nodepool_ready.rc == 0
  changed_when: false
  when:
    - enable_karpenter | bool
    - manage_karpenter_nodepools_with_ansible | bool

- name: Wait for the GPU EC2NodeClass and NodePool to become ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s_remote_kubeconfig }}
    wait {{ item }} --for=condition=Ready --timeout=300s
  loop:
    - ec2nodeclass/training-gpu
    - nodepool/mlops-paas-training-gpu
  register: training_gpu_capacity_ready
  retries: 30
  delay: 10
  until: training_gpu_capacity_ready.rc == 0
  changed_when: false
  when:
    - enable_karpenter | bool
    - enable_gpu_nodepool | bool
    - manage_karpenter_nodepools_with_ansible | bool
