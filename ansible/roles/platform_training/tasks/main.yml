---
- name: Require Argo CD to reconcile every training operator application
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item }}"
    namespace: argocd
    kubeconfig: "{{ k3s_remote_kubeconfig }}"
  register: reconciled_platform_operator_application
  until:
    - reconciled_platform_operator_application.resources | length == 1
    - reconciled_platform_operator_application.resources[0].status.sync.status | default('') == 'Synced'
    - reconciled_platform_operator_application.resources[0].status.health.status | default('') == 'Healthy'
  retries: 60
  delay: 10
  changed_when: false
  loop: "{{ platform_operator_application_names }}"
