---
- name: Wait for worker nodes to join and be Ready
  shell: |
    export KUBECONFIG=/home/ubuntu/.kube/config
    kubectl get nodes -l workload-type=worker | grep -i ready | wc -l
  register: ready_workers
  until: ready_workers.stdout | int >= 1
  retries: 30
  delay: 10
  changed_when: false
  when: bootstrap_k3s_cluster | bool

- name: Set derived K3s API endpoint for Karpenter bootstrap
  set_fact:
    k3s_cluster_endpoint: "https://{{ private_ip | default(ansible_host) }}:6443"

- name: Set effective K3s node token for Karpenter
  set_fact:
    effective_k3s_node_token: "{{ k3s_node_token_override | default('') | trim if (k3s_node_token_override | default('') | trim) else hostvars[groups['master'][0]].get('k3s_node_token', '') }}"
  no_log: true

- name: Copy k8s directory to master node
  copy:
    src: "{{ playbook_dir }}/../k8s"
    dest: "/home/ubuntu/"
    owner: ubuntu
    group: ubuntu

- name: Render cluster-specific Karpenter NodePools and EC2NodeClasses
  template:
    src: karpenter-nodepool.yaml.j2
    dest: /home/ubuntu/k8s/karpenter/nodepool.yaml
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  when: manage_karpenter_nodepools_with_ansible | bool

- name: Ensure script files are executable
  file:
    path: "/home/ubuntu/k8s/scripts/{{ item }}"
    mode: '0755'
  loop:
    - ebs-csi-driver-install.sh
    - eso-install.sh
    - keda-install.sh
    - argo-install.sh
    - argo-workflows-install.sh
    - monitoring-install.sh
    - cloudnative-pg-install.sh
    - kubeflow-training-operator-install.sh
    - karpenter-controller-install.sh

- name: Store K3s agent token in AWS Secrets Manager for Karpenter nodes
  shell: |
    set -euo pipefail
    if aws secretsmanager describe-secret --region "${AWS_DEFAULT_REGION}" --secret-id "${SECRET_ID}" >/dev/null 2>&1; then
      aws secretsmanager put-secret-value --region "${AWS_DEFAULT_REGION}" --secret-id "${SECRET_ID}" --secret-string "${SECRET_VALUE}" >/dev/null
    else
      aws secretsmanager create-secret --region "${AWS_DEFAULT_REGION}" --name "${SECRET_ID}" --description "K3s node token for Karpenter-provisioned self-managed K3s agents" --secret-string "${SECRET_VALUE}" >/dev/null
    fi
  args:
    executable: /bin/bash
  environment:
    AWS_DEFAULT_REGION: "{{ aws_region }}"
    SECRET_ID: "{{ karpenter_k3s_token_secret_name }}"
    SECRET_VALUE: "{{ {'token': effective_k3s_node_token} | to_json }}"
  no_log: true
  when:
    - manage_karpenter_nodepools_with_ansible | bool
    - effective_k3s_node_token | length > 0

- name: Run AWS EBS CSI Driver install script
  shell: bash k8s/scripts/ebs-csi-driver-install.sh
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

- name: Run External Secrets Operator install script
  shell: bash k8s/scripts/eso-install.sh
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

- name: Run CloudNativePG operator install script
  shell: bash k8s/scripts/cloudnative-pg-install.sh
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
    CNPG_OPERATOR_CHART_VERSION: "{{ cnpg_operator_chart_version }}"

- name: Run KEDA install script
  shell: bash k8s/scripts/keda-install.sh
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

- name: Run Argo Workflows install script
  shell: bash k8s/scripts/argo-workflows-install.sh
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

- name: Run Kubeflow Training Operator install script
  shell: bash k8s/scripts/kubeflow-training-operator-install.sh
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
    KUBEFLOW_TRAINING_OPERATOR_VERSION: "{{ kubeflow_training_operator_version }}"

- name: Run Karpenter controller install script
  shell: bash k8s/scripts/karpenter-controller-install.sh
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
    AWS_DEFAULT_REGION: "{{ aws_region }}"
    CLUSTER_NAME: "{{ karpenter_cluster_name }}"
    CLUSTER_ENDPOINT: "{{ k3s_cluster_endpoint }}"
    KARPENTER_VERSION: "{{ karpenter_version }}"
    KARPENTER_BRIDGE_CRD_VERSION: "{{ karpenter_bridge_crd_version }}"
    KARPENTER_INTERRUPTION_QUEUE: "{{ karpenter_interruption_queue_name }}"
    KARPENTER_CONTROLLER_ROLE_ARN: "{{ karpenter_controller_role_arn }}"

- name: Apply rendered Karpenter NodePools and EC2NodeClasses
  shell: kubectl apply -f k8s/karpenter/nodepool.yaml
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: manage_karpenter_nodepools_with_ansible | bool

- name: Run Prometheus & Grafana monitoring install script
  shell: bash k8s/scripts/monitoring-install.sh
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

- name: Run ArgoCD install script
  shell: bash k8s/scripts/argo-install.sh
  args:
    chdir: /home/ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
