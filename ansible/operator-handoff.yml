---
- name: Adopt training operators into Argo CD without pruning
  hosts: master
  become: true
  gather_facts: false
  vars:
    operator_handoff_applications:
      - platform-kubeflow-training
      - platform-karpenter-crds
      - platform-karpenter
      - platform-node-feature-discovery
      - platform-gpu-operator
  tasks:
    - name: Require the Ansible-owned transition stage
      ansible.builtin.assert:
        that:
          - training_operators_owner == 'ansible'
        fail_msg: >-
          Manual adoption is only allowed while Ansible is still the declared
          owner. Do not rerun this playbook after the Argo CD handoff.

    - name: Adopt each operator application in dependency order
      ansible.builtin.include_tasks: tasks/sync_operator_application.yml
      loop: "{{ operator_handoff_applications }}"
      loop_control:
        loop_var: operator_application_name
